COURSE.push({w:8,phase:3,title:"Design Systems and Component Thinking",
thesis:"A design system is not a component library. It's a set of <b>decisions, made once, that let a team produce coherent work without re-deciding.</b> The components are the least interesting layer.",
days:[
{n:1,title:"What a design system actually is — the three layers",
concept:`
<p>Ask ten designers and nine will describe a Figma file full of components. That's the smallest and most replaceable part.</p>
<p><strong>Layer 1 — Principles and decisions.</strong> The stated positions the product takes. <em>"We prefer undo to confirmation." "Destructive actions are never adjacent to frequent ones." "Density is comfortable by default, compact on data surfaces."</em></p>
<p>This layer is invisible, has no Figma file, and is the layer that actually produces coherence. Two designers who share principles produce compatible work without shared components. Two designers who share components but not principles produce incoherent work using identical buttons — which is what most "design systems" achieve in practice.</p>
<p><strong>Layer 2 — Foundations.</strong> The shared vocabulary: tokens for colour, type, space, radius, elevation, motion. Plus the grid and density stance. What makes things <em>feel</em> like one product even when components differ.</p>
<p><strong>Layer 3 — Components and patterns.</strong> The visible layer, and the most disposable — components get rebuilt constantly as frameworks change. <strong>Patterns</strong> (how components combine to solve a recurring problem — a form, an empty state, a destructive-action flow) are more valuable than components, because a pattern encodes a <em>solution</em> while a component encodes a <em>part</em>.</p>
<blockquote><p>Teams build layer 3 first, skip layer 1 entirely, then wonder why the system doesn't produce consistency. <strong>The documentation of when and why is worth more than the components</strong> — which is exactly why Polaris is the best-regarded system on the internet: its components are ordinary and its usage guidance is exceptional.</p></blockquote>
<p><strong>What a good system is for:</strong> decision reduction (spend judgment on the novel 20%) · coherence at scale · speed (real, but secondary and oversold) · a quality floor (accessibility and edge cases solved once, correctly).</p>
<p><strong>What it is not for:</strong> enforcing sameness, replacing judgment, or being complete. <strong>The best systems are deliberately incomplete</strong> with a clear, welcoming process for the cases they don't cover — because those cases are where the product is evolving.</p>`,
source:{label:"Apple HIG and Material 3 — read the principles pages",url:"https://developer.apple.com/design/human-interface-guidelines/",note:"Read them side by side with <a href=\"https://m3.material.io/\">Material 3</a>. Notice how much of both is <em>argument</em> rather than specification. That's layer 1, and it's why those documents outlived a dozen component libraries."},
drill:`<p>Write <strong>eight principles</strong> for your Studio B product. Each must be (a) a decision, not a platitude, (b) something a reasonable person could disagree with, (c) capable of resolving a real design argument.</p><p><em>"We value simplicity"</em> fails all three. <em>"We show disabled controls with a reason rather than hiding them, because inconsistent interfaces across permission levels feel broken"</em> passes all three.</p>`},

{n:2,title:"Tokens — the abstraction that makes design scale",
concept:`
<p>Tokens are named design decisions. That's the whole idea — and it's powerful because naming a decision makes it reusable, changeable, and arguable.</p>
<pre>PRIMITIVE / GLOBAL   blue-500 · space-4 · radius-md · duration-200
   (raw values, never referenced directly in a design)
        ↓
SEMANTIC / ALIAS     action-primary · space-inset-comfortable · surface-raised
   (meaning — the layer you design with)
        ↓
COMPONENT            button-primary-bg · card-padding · modal-radius
   (only when a component genuinely needs to diverge)</pre>
<p><strong>Why three tiers:</strong> with one, changing your brand blue means finding every use. With three, you change one primitive. More importantly, the semantic tier is where <em>meaning</em> lives — and meaning survives redesigns. <code>action-primary</code> is still <code>action-primary</code> after a rebrand; <code>blue-500</code> is meaningless the moment the brand goes green.</p>
<p><strong>What to tokenise</strong>, by value: colour · spacing · typography (as bundles) · radius, border width, elevation · <strong>motion — duration and easing</strong> (almost always forgotten, and where you have an unfair advantage) · breakpoints, z-index, opacity.</p>
<h4>Naming — the genuinely hard part</h4>
<ul>
<li><strong>Semantic, not descriptive</strong> — <code>text-secondary</code>, not <code>grey-600</code></li>
<li><strong>Consistent in structure</strong> — pick <code>[category]-[role]-[variant]-[state]</code> and never deviate</li>
<li><strong>Not over-specific</strong> — <code>button-submit-bg</code> is too narrow; <code>action-primary-bg</code> covers the case and the next twenty</li>
<li><strong>Modes, not names, carry theme</strong> — you don't need <code>text-primary-dark</code>; you need <code>text-primary</code> that resolves differently per mode</li>
</ul>
<p><strong>In Figma:</strong> variables with modes are the implementation. One set of semantic variables, multiple modes, and every component references semantics only. <em>If a component references a primitive directly, it will break in a mode.</em> That's the rule to enforce and the thing to check for.</p>
<div class="warn"><strong>The most common mistake:</strong> tokenising too early and too much. A hundred tokens for a product with eight screens is overhead pretending to be rigour. Start with what you've used twice. Promote on the third use. <strong>Systems grow from real repetition, not anticipated repetition.</strong></div>`,
source:{label:"Material 3 — design tokens",url:"https://m3.material.io/foundations/design-tokens/overview",note:"Then <a href=\"https://spectrum.adobe.com/\">Adobe Spectrum's token documentation</a> — two rigorous, different naming philosophies. Read both and pick a side."},
drill:`<p>Formalise your Week 7 foundations as a <strong>complete three-tier token set</strong> in Figma variables, with light and dark modes. Include motion tokens (duration and easing) even though Week 9 hasn't happened — you'll fill the values next week.</p><p>Then audit: does any component reference a primitive directly? Fix it.</p>`},

{n:3,title:"Component API thinking — props, variants, slots, composition",
concept:`
<p>The day that most changes how you build. The shift: <strong>stop thinking about what a component looks like, start thinking about what it accepts.</strong></p>
<p>A component is a <em>function</em>. Designing one means designing its <strong>API</strong> — and the API is a far more consequential decision than the visual design.</p>
<h4>The four kinds of input</h4>
<ol>
<li><strong>Variants</strong> — mutually exclusive modes. <code>type: primary | secondary | tertiary | destructive</code>. Keep small and orthogonal.</li>
<li><strong>Properties</strong> — independent toggles. <code>size</code>, <code>disabled</code>, <code>loading</code>, <code>icon-position</code>, <code>full-width</code>.</li>
<li><strong>Slots</strong> — regions the consumer fills with arbitrary content. <em>The most powerful and most underused idea in component design.</em> A <code>Card</code> with <code>header</code>, <code>body</code>, <code>actions</code> slots serves a hundred cases. A <code>Card</code> with <code>title: string</code> serves one, and gets forked the first time someone needs a badge in the header.</li>
<li><strong>State</strong> — hover, focus, active, disabled, loading, error, selected, read-only. <strong>A component isn't designed until all its states are.</strong> Focus states specifically are forgotten in roughly 90% of design files and are a hard accessibility requirement.</li>
</ol>
<p><strong>The combinatorial trap.</strong> 4 types × 3 sizes × 2 icon positions × 8 states = 192 combinations. You cannot draw 192 artboards. Instead: make properties <em>orthogonal</em> so consumers compose · draw the <em>type × state</em> matrix and let size and icon be mechanical · explicitly document <em>invalid</em> combinations and why (<code>destructive</code> + <code>tertiary</code> might be forbidden because a destructive action must never be low-emphasis).</p>
<h4>Composition over configuration</h4>
<p>When a component grows a tenth property, that's the signal it should have been two components, or one with slots.</p>
<p>✗ <code>Card(title, subtitle, image, badge, badgeColor, actionLabel, actionIcon, footerText…)</code><br>
✓ <code>Card</code> with <code>&lt;CardHeader&gt;</code>, <code>&lt;CardMedia&gt;</code>, <code>&lt;CardBody&gt;</code>, <code>&lt;CardActions&gt;</code></p>
<p>The first gets forked within a month. The second grows with the product.</p>
<div class="warn"><strong>Why this matters even though you're not writing the code:</strong> engineers build to APIs. Deliver a coherent API and the implementation matches your intent and <em>stays</em> matched. Deliver 192 artboards and an engineer invents an API, and from then on code and design diverge quietly and permanently. <strong>Component API design is the single highest-leverage thing a designer can do to keep design and code in sync</strong> — and very few designers do it.</div>
<p><strong>A test for your API:</strong> hand a component to someone and ask them to build a case you didn't anticipate. If they can, it's good. If they have to modify the component, it isn't.</p>`,
source:{label:"Polaris component documentation",url:"https://polaris.shopify.com/",note:"Read a component's <em>full</em> documentation page, not just the visuals — notice how much is about <em>when not to use it</em>. Compare with <a href=\"https://atlassian.design/\">Atlassian</a>."},
drill:`<p>Design <strong>one component properly</strong> — a Button or an Input. Deliver: full variant/property/slot API as a table · the type × state matrix drawn · documented invalid combinations · a usage doc with "use when" and "don't use when."</p><p>Then hand it to someone (or Claude) and ask them to build a case you didn't design for.</p>`},

{n:4,title:"Reading the great systems",
concept:`
<p>Deliberately a reading day. The four major public systems are the best-documented design thinking freely available anywhere, and each has a distinct philosophy.</p>
<p><strong>Material Design 3</strong> — the most <em>complete</em>. Token architecture, dynamic colour, adaptive layout, best public writing on motion. Weakness: it serves everyone, so it's generic by necessity. <em>Read for:</em> tokens, motion, adaptive layout.</p>
<p><strong>Apple HIG</strong> — the most <em>philosophical</em>. Less "here's a component," more "here's what we believe." The prose is the product. <em>Read for:</em> how to write principles, platform-native thinking. Weakness: prescriptive in ways that don't transfer off-platform.</p>
<p><strong>Shopify Polaris</strong> — the best <em>content and usage guidance</em> in the industry. Extensive "use when / don't use when," and exceptional content guidelines. <em>Read for:</em> usage documentation, content design, how to make a system teach rather than just supply.</p>
<p><strong>IBM Carbon</strong> — the best for <em>density and enterprise</em>. The 2x grid, multiple density scales, excellent motion guidance with a productive/expressive split, best-in-class data viz. <em>Read for:</em> dense UI, tables, charts, motion tokens.</p>
<h4>How to read a design system</h4>
<p>Not front to back. Take <em>one problem you actually have</em> and read all four on it:</p>
<ul>
<li>How does each handle <strong>empty states</strong>?</li>
<li>How does each handle <strong>destructive actions</strong>?</li>
<li>How does each define <strong>elevation</strong>?</li>
<li>What does each say about <strong>when not to use a modal</strong>?</li>
</ul>
<blockquote><p>The places where four competent teams <em>disagree</em> are the places where there's a genuine design decision. Seeing four resolutions of a tradeoff teaches its shape far faster than any one system's answer.</p></blockquote>
<p><strong>What to notice:</strong> how much of each is <em>prohibition</em> rather than provision · how they handle components they <em>don't</em> have · how they document contribution and change · where they contradict each other, and what each is optimising for.</p>`,
source:{label:"GitLab Pajamas — governance in public",url:"https://design.gitlab.com/",note:"Worth 20 minutes: radically transparent, you can watch decision-making happen. No other major system exposes this."},
drill:`<p>Pick <strong>one problem</strong> — I'd suggest destructive actions, since it touches error, confirmation, undo and hierarchy at once. Read what all four systems say.</p><p>Write a <strong>one-page comparison</strong>: where they agree, where they diverge, what each is optimising for, and what <em>you</em> would do and why. This is a genuinely good portfolio artifact on its own.</p>`},

{n:5,title:"Governance, contribution and the politics of a system",
concept:`
<p>Design systems fail for social reasons far more often than technical ones. The day nobody teaches and everybody needs.</p>
<div class="tablewrap"><table>
<tr><th>Model</th><th>How it works</th><th>Fails by</th></tr>
<tr><td>Centralised</td><td>A dedicated team owns everything</td><td>Becoming a bottleneck; drifting from real needs</td></tr>
<tr><td>Federated</td><td>Product designers contribute; a small group curates</td><td>Inconsistency if curation is weak; contribution never happening if slow</td></tr>
<tr><td>Hybrid</td><td>Core team owns foundations; contribution for components</td><td>Needs the core team to genuinely say no sometimes</td></tr>
</table></div>
<h4>Why systems die, by frequency</h4>
<ol>
<li><strong>Contribution is harder than forking.</strong> If adding takes three weeks and copy-pasting takes twenty minutes, everyone forks, and within a year there are nine buttons. <strong>The contribution path must be genuinely faster than the workaround</strong> or the system is decorative.</li>
<li><strong>It doesn't cover what people need.</strong> Built from imagined rather than observed repetition.</li>
<li><strong>No owner.</strong> It was a project, not a product. It rots.</li>
<li><strong>It says yes to everything.</strong> Every request becomes a variant. Within two years it's a pile.</li>
<li><strong>Design and code diverge.</strong> Usually a symptom of not designing to an API.</li>
</ol>
<h4>What works</h4>
<ul>
<li>Version and changelog it like software</li>
<li><strong>Deprecation explicit and gradual</strong> — mark, announce, provide the migration, then remove. Silent removal destroys trust once and permanently.</li>
<li>A real intake process with a stated response time. Slow-but-predictable beats fast-but-random.</li>
<li><strong>Say no with a reason and an alternative.</strong> "No, this is a one-off; here's how to build it locally without forking" is a good no.</li>
<li><strong>Measure adoption, not component count.</strong> Component count is a vanity metric. Percentage of shipped UI using system components is the real one.</li>
</ul>
<div class="warn"><strong>Your role, realistically:</strong> consumer and contributor, not owner. Use the system, and <em>when you deviate, document why</em> — the documented deviation is how systems learn; an undocumented one is drift. Contribute upward when you've built something twice. Push back when the system is wrong, with evidence not preference. And <strong>never fork silently</strong> — the single behaviour that kills systems, and always locally rational, which is why it needs to be a stated norm.</div>
<p><strong>The framing that lands in a meeting:</strong> a design system is <em>infrastructure</em>. It has maintenance costs, needs an owner, depreciates, and should be judged on adoption and acceleration — not on how complete it looks.</p>`,
source:{label:"GitLab Pajamas — contribution and governance",url:"https://design.gitlab.com/",note:"Public governance in action. Also Nathan Curtis's EightShapes writing on design system operations — the most practically useful body of work on this."},
drill:`<p>Write the <strong>governance section</strong> for your Studio B mini-system, one page: who owns it · how someone contributes · intake and response commitment · how deviation is documented · how deprecation works · what you'd measure.</p><p>Even for a solo project, writing this clarifies what the system is <em>for</em>.</p>`},

{n:6,studio:"B",title:"Studio B close — build the mini-system",
concept:`
<p>Assemble everything into a small, coherent, documented system — and <strong>keep it small on purpose.</strong></p>
<blockquote><p><strong>The size rule: 5–8 components.</strong> A small system you can fully justify demonstrates more judgment than a large one you assembled by copying. In a portfolio, forty generic components reads as "downloaded a UI kit"; eight with documented rationale reads as "understands systems."</p></blockquote>
<p>Choose components by <strong>what your Studio B screens actually used twice or more</strong>. That's the entire selection criterion. Anything used once is not yet a system component.</p>`,
source:{label:"Polaris — how to document a component",url:"https://polaris.shopify.com/",note:"Use their component pages as the format template for your own documentation."},
deliverable:"Deliverable B6 — The mini design system",
drill:`<ol>
<li><strong>Principles</strong> — the eight from Day 1, refined</li>
<li><strong>Tokens</strong> — full three-tier set, light + dark, including motion placeholders</li>
<li><strong>5–8 components</strong>, each with: a written API table · all interaction states including focus · "use when / don't use when" · at least one documented invalid combination</li>
<li><strong>2–3 patterns</strong> — how components combine for a recurring problem</li>
<li><strong>Governance page</strong> — the one-pager from Day 5</li>
<li><strong>The comparison piece</strong> from Day 4</li>
</ol>
<p>Plus one paragraph: <strong>which of your Week 7 screens had to change</strong> once the system existed, and what that tells you.</p>
<p><em>Time: ~2 hrs. Much of this exists already — today is formalisation, not new design.</em></p>
<p><code>/product-design-course critique B6</code> — ask Claude to test your component APIs by proposing cases you didn't design for. That's the real test of a system.</p>`}
]});

/* ---------------- WEEK 9 ---------------- */
COURSE.push({w:9,phase:3,title:"Motion, Latency and Time",
thesis:"This is your unfair advantage, pointed at a new target. In film and brand, motion carries <i>feeling</i>. In product, motion carries <b>information</b> — what happened, where it came from, how long, and whether you're still in control.",
days:[
{n:1,title:"Motion's four jobs, and the one job it doesn't have",
concept:`
<p>Motion earns its place by doing one of exactly four jobs. Anything else is cost without benefit — and in product, motion's cost is <em>time</em>, paid by the user, on every use.</p>
<p><strong>Job 1 — Continuity: preserving object identity across a change.</strong> When a thing moves or transforms rather than disappearing and reappearing, the user knows it's the <em>same thing</em>. Highest-value job, most under-exploited. A list item that expands into a detail view teaches the relationship. The same transition as a cut requires re-establishing, every time, what you're looking at.</p>
<p><strong>Job 2 — Spatial orientation.</strong> Interfaces are pretend spaces; motion establishes the geography. A panel sliding from the right establishes that it lives to the right and dismisses rightward. Without motion, users maintain the spatial model manually, in working memory, and mostly fail.</p>
<p><strong>Job 3 — Feedback.</strong> Norman's stage 5. Especially for actions with no visible result — a save, a copy, a background sync. Often the only feedback channel that doesn't steal the user's position on the page.</p>
<p><strong>Job 4 — Attention direction.</strong> Motion is the most powerful pre-attentive channel — it overrides everything. Which is exactly why it must be spent carefully: one moving element in a still field is unmissable; three are noise; a permanently-animating element is a permanent tax that users eventually learn to filter, at which point you've spent the channel and gained nothing.</p>
<h4>The job motion does NOT have in product: expression</h4>
<p>This is the hard part for you. In brand and film, motion carries personality and can be justified by being <em>good</em>. In product, "it looks nice" is not a justification, because the cost is paid on every repetition. A 400ms flourish seen once in a showreel is a delight. The same 400ms on a button pressed forty times a day is four seconds a week of a person's life spent watching your taste.</p>
<blockquote><p><strong>The test for every animation: what question does this answer for the user?</strong> If it doesn't answer <em>what happened / where did it come from / where did it go / am I still in control / how long</em> — cut it or halve it.</p></blockquote>
<div class="warn"><strong>The exception, and it's real:</strong> <em>once-per-session or once-per-lifetime</em> moments — first-run, a milestone, a genuine success. Here expression is legitimate, because repetition cost is near zero. Notice these are exactly the moments most products under-invest in while over-animating their buttons. That inversion is an opportunity you're unusually well-equipped to exploit.</div>`,
source:{label:"IBM Carbon — motion: productive vs expressive",url:"https://carbondesignsystem.com/elements/motion/overview/",note:"The productive/expressive split is the single most useful framing available. Then <a href=\"https://m3.material.io/styles/motion/overview\">Material 3 motion</a>."},
drill:`<p>Audit motion in three products you use daily. For each animation: which of the four jobs? How long (estimate)? Once-per-session or once-per-minute?</p><p>Find one that's pure expression on a high-frequency action — that's a bug. Then find one place motion is <em>missing</em> and continuity is being lost.</p>`},

{n:2,title:"Duration, easing and the physics of trust",
concept:`
<p>You know easing. What you probably haven't done is treat duration and easing as <strong>tokens with semantics</strong> — decisions made once at system level rather than per-animation taste.</p>
<div class="tablewrap"><table>
<tr><th>Range</th><th>Use</th></tr>
<tr><td>50–100ms</td><td>Micro-feedback: hover, focus, button press, checkbox</td></tr>
<tr><td>150–250ms</td><td>The workhorse. Most transitions, panel opens, expansions</td></tr>
<tr><td>250–400ms</td><td>Large-area changes: full-screen transitions, big modals</td></tr>
<tr><td>400ms+</td><td>Almost always too slow for anything repeated. Once-per-session only</td></tr>
</table></div>
<p><strong>Duration scales with distance and area, not with importance.</strong> Applying one duration to everything is the most common systemic motion error — small things feel sluggish and large things feel jarring.</p>
<p><strong>Exit is faster than enter</strong>, roughly 0.7–0.8×. Things arriving need to be perceived; things leaving just need to get out of the way. A dismissal as slow as an appearance feels like the interface is arguing with you.</p>
<div class="tablewrap"><table>
<tr><th>Curve</th><th>Feels like</th><th>Use for</th></tr>
<tr><td>Ease-out</td><td>Responsive, arriving</td><td><strong>The default.</strong> Entering, expanding, appearing</td></tr>
<tr><td>Ease-in</td><td>Departing, accelerating away</td><td>Elements leaving the screen entirely</td></tr>
<tr><td>Ease-in-out</td><td>Deliberate, controlled</td><td>Moving <em>within</em> the screen, both ends visible</td></tr>
<tr><td>Linear</td><td>Mechanical</td><td>Only continuous indeterminate things: spinners, progress</td></tr>
<tr><td>Spring / overshoot</td><td>Physical, alive</td><td>Direct-manipulation responses. <strong>Dangerous on frequent UI</strong> — overshoot moves the target after you've committed to a click</td></tr>
</table></div>
<blockquote><p>Motion is where an interface expresses its <em>physics</em>, and consistent physics is what makes a product feel trustworthy rather than merely decorated. If panels sometimes slide and sometimes fade, sometimes 200ms and sometimes 350, the interface has no consistent world — and users read that as unreliability without being able to say why. <strong>Coherent motion is a substantial and almost entirely invisible contributor to perceived quality.</strong></p></blockquote>
<pre>duration-instant    100ms
duration-fast       150ms
duration-standard   250ms
duration-slow       400ms

easing-standard     cubic-bezier(0.2, 0, 0, 1)   → entering, default
easing-accelerate   cubic-bezier(0.3, 0, 1, 1)   → exiting
easing-decelerate   cubic-bezier(0, 0, 0, 1)     → arriving</pre>
<div class="warn"><strong>Non-negotiable:</strong> honour <code>prefers-reduced-motion</code>. Vestibular disorders make large-area motion genuinely nauseating. The correct response isn't removing all motion — it's replacing <em>movement</em> with <em>fades</em> and reducing durations. Every animation needs a reduced-motion variant.</div>`,
source:{label:"Material — duration & easing",url:"https://m1.material.io/motion/duration-easing.html",note:"Still the clearest single page on the subject anywhere. Then <a href=\"https://carbondesignsystem.com/elements/motion/overview/\">Carbon's motion tokens</a> for the implementation."},
drill:`<p>Define the <strong>motion tokens</strong> for your design system — 4 durations, 3–4 easings, each with a stated semantic use.</p><p>Then take one component from Studio B and specify every animation using only those tokens, including reduced-motion variants. Where a token doesn't fit, that's information: either you need another token, or the animation is wrong.</p>`},

{n:3,title:"Choreography, shared elements and spatial continuity",
concept:`
<p>Single animations are easy. <strong>Choreography</strong> — multiple elements moving in relation to each other — is where motion becomes structural, and where your film background is worth the most.</p>
<p><strong>Shared element transitions.</strong> When an element persists across a state change, animate it <em>continuously</em> rather than cross-fading. Tapping a card, and its image expands to become the hero image of the detail view. The eye tracks one object; no re-orientation needed; the relationship between list and detail is taught without a word.</p>
<p>The single highest-value motion technique in product design, and underused because it's genuinely harder to build — the two screens must know about each other. Worth arguing for on the interactions that matter most.</p>
<p><strong>Staggering.</strong> Offsetting multiple entering elements by 20–50ms creates a read order and makes the group comprehensible rather than an undifferentiated flash.</p>
<ul>
<li><strong>Stagger in the direction of reading</strong> — lead the eye, don't scatter it</li>
<li><strong>Cap the total.</strong> Twenty items at 50ms is a full second. Stagger the first 4–6, then have the rest arrive together.</li>
<li><strong>Don't stagger on repeat views.</strong> Charming once, tedious on the fortieth load. Stagger on first paint, not every re-render — a distinction most implementations miss.</li>
</ul>
<p><strong>Hierarchy of movement.</strong> In a choreographed transition, not everything moves equally. Establish what's primary — usually what the user acted on — and let it lead. <strong>Everything moving at once is the motion equivalent of everything being bold.</strong> Your compositional instincts apply directly; it's the same problem in the time axis.</p>
<p><strong>Spatial models — pick one and hold it.</strong> Layers/z-depth · cards/surfaces · lateral space (back goes left, forward goes right, always). The specific model matters much less than <em>consistency</em>. If back sometimes slides and sometimes fades, the user's spatial model never forms — which shows up as "I can never find anything" complaints that get misdiagnosed as IA problems.</p>
<div class="warn"><strong>Interruptibility — the thing most designers get wrong.</strong> Real interfaces get interacted with mid-animation. Animation must be interruptible and reversible from any point — tap to close while a panel is still opening, and it must reverse from where it is, not finish opening then close. Non-interruptible animation is the fastest way to make an interface feel unresponsive. This is why springs are increasingly preferred for gestures: they handle interruption naturally.</div>`,
source:{label:"Material 3 — motion choreography and transitions",url:"https://m3.material.io/styles/motion/overview",note:"Then screen-record apps you admire and step through at 0.25× speed. This is a form of study you're already equipped for and most designers aren't."},
drill:`<p>Take the most important transition in your Studio B flow — probably list → detail. Storyboard it: what moves, what stays, what leads, what follows, the timing offsets, and <strong>what happens if the user interrupts at 40%</strong>.</p><p>Build it (Figma Smart Animate, Rive, or After Effects). Specify it in tokens.</p>`},

{n:4,title:"The response-time budget and the Doherty Threshold",
concept:`
<p><strong>The Doherty Threshold</strong> (IBM, 1982): productivity rises sharply when system response drops below <strong>400ms</strong> — and <em>superlinearly</em>. The finding wasn't just "fast is better"; below ~400ms the user and machine enter a state where neither waits, and the user stays in flow, works faster, and explores more.</p>
<blockquote><p>Above the threshold, attention leaves. And attention returning is not free — they must re-establish where they were, what they were doing, and what they were holding in working memory. <strong>The cost of a 2-second wait is not 2 seconds.</strong></p></blockquote>
<div class="tablewrap"><table>
<tr><th>Actual response</th><th>Required design response</th></tr>
<tr><td>&lt; 100ms</td><td>Nothing. The result is the feedback. <em>Do not add a spinner</em> — you'd be adding perceived latency to something that felt instant.</td></tr>
<tr><td>100–300ms</td><td>State change on the control itself</td></tr>
<tr><td>300ms–1s</td><td>Immediate acknowledgement + in-place indication</td></tr>
<tr><td>1–10s</td><td>Determinate progress if possible. Keep oriented. Allow cancellation.</td></tr>
<tr><td>&gt; 10s</td><td>Design a <em>departure and return</em>. Let them leave. Notify on completion. Preserve context.</td></tr>
</table></div>
<h4>Perceived vs actual — where the leverage is</h4>
<p>You often can't make the system faster, but perceived duration is substantially malleable:</p>
<ul>
<li><strong>Occupied time feels shorter.</strong> "Analysing 240 of 1,200…" feels faster than an identical wait behind a spinner.</li>
<li><strong>Uncertain waits feel longer.</strong> An estimate — even rough — reduces perceived duration.</li>
<li><strong>Anxiety inflates duration.</strong> "Your file is safe, we're just processing it" measurably shortens a wait.</li>
<li><strong>Early progress feels faster.</strong> Bars that move quickly then slow are perceived as faster than linear ones at identical total duration. Mildly manipulative — use for genuinely variable operations, not to disguise a system you should have optimised.</li>
<li><strong>Peak-End applies to waits.</strong> A wait that ends cleanly is remembered as shorter.</li>
</ul>
<div class="warn"><strong>Optimistic UI</strong> is the strongest technique available — it takes a 400ms operation to 0ms perceptually. <strong>But it's a promise, and you must design the retraction:</strong> what happens on failure, how the user finds out, whether their subsequent actions are still valid. An optimistic UI without a designed failure path is a product that lies to its users, occasionally, silently. That's worse than being slow.</div>`,
source:{label:"Laws of UX — Doherty Threshold",url:"https://lawsofux.com/doherty-threshold/",note:"Then NN/g's <a href=\"https://www.nngroup.com/articles/response-times-3-important-limits/\">Response Times: The 3 Important Limits</a>."},
drill:`<p>Take one slow operation in a product you use — an export, a search, a generation. Time it. Then redesign the wait: what's shown at 0ms, 300ms, 1s, 5s, 15s? What can be optimistic? What's cancellable? What does the user see if it fails at second 12?</p><p>Specify the whole timeline, not just the loading state.</p>`},

{n:5,title:"Designing for latency — skeletons, optimism, perceived performance",
concept:`
<p>Practical patterns, and when each is right. This matters disproportionately for AI products, where waits are long, variable and unavoidable — which is the bridge into Studio C.</p>
<div class="tablewrap"><table>
<tr><th>Pattern</th><th>Right when</th><th>Wrong when</th></tr>
<tr><td>Nothing</td><td>&lt; 100ms</td><td>Anything longer — user thinks the click missed</td></tr>
<tr><td>Spinner</td><td>300ms–1s, unknown duration, small area</td><td>&gt; 2s (feels stuck), or full-page (destroys context)</td></tr>
<tr><td>Skeleton</td><td>Layout known in advance, 300ms–3s</td><td>Layout unknown — a wrong skeleton is worse than none</td></tr>
<tr><td>Progress bar</td><td>You genuinely know the proportion</td><td>You're faking it. Users learn instantly, and a lying bar destroys trust in every other indicator</td></tr>
<tr><td>Streaming</td><td>Output arrives incrementally</td><td>Output only meaningful complete</td></tr>
<tr><td>Optimistic</td><td>Success likely, failure recoverable</td><td>Failure likely, or consequences serious (payments, deletes)</td></tr>
<tr><td>Background + notify</td><td>&gt; 10s</td><td>Shorter — being sent away is its own cost</td></tr>
</table></div>
<h4>Skeletons, properly</h4>
<ul>
<li>Must <strong>match the real layout</strong>. Different shape = layout shift <em>and</em> a broken promise.</li>
<li>Shimmer should be <strong>slow and low-contrast</strong>. A fast, high-contrast shimmer is a pre-attentive attention magnet pointed at nothing.</li>
<li><strong>Don't skeleton under ~300ms</strong> — the flash is worse than the wait. Delay its appearance by 200–300ms so fast responses never show one.</li>
<li>Skeleton the <em>structure</em>, not every atom. Three grey bars, not a pixel-perfect grey clone.</li>
</ul>
<h4>Streaming — the pattern that matters most for your work</h4>
<ul>
<li><strong>What arrives first, and is it useful alone?</strong> Streaming a summary before detail beats streaming left-to-right through content that only makes sense complete.</li>
<li><strong>How does the user know it's still going vs finished?</strong> The end needs an explicit marker. Users can't tell "done" from "stalled."</li>
<li><strong>Can they act on partial output?</strong> Being able to <em>stop</em> a stream dramatically changes how a slow system feels — it converts waiting into a choice.</li>
<li><strong>Does the layout jump?</strong> Streaming text that reflows under a cursor is a Fitts disaster.</li>
</ul>
<div class="warn"><strong>Counter-intuitive and important:</strong> streamed text arriving <em>faster than reading speed</em> provides no benefit over showing it complete — and can be worse, because moving text is harder to read. Streaming's value is in <em>starting sooner</em>, not in the animation. If your model returns in 800ms, showing the complete answer is better. Most AI products make this by default rather than deliberately.</div>`,
source:{label:"NN/g — Progress indicators & skeleton screens",url:"https://www.nngroup.com/articles/progress-indicators/",note:"Then examine three AI products' streaming behaviour closely — screen-record and step through. Note where each marks completion."},
drill:`<p>Design the <strong>complete latency experience</strong> for one operation in Studio B — timeline from 0ms to failure, every pattern choice justified.</p><p>Then do it for an AI operation you use daily, and write down three things it does wrong. Those three are candidate design work for Studio C.</p>`},

{n:6,studio:"C",title:"Studio C kickoff — the AI feature brief",
concept:`
<p>Your capstone and portfolio piece. Today's real work is <strong>choosing well and enumerating failure.</strong></p>
<h4>1. The failure-first discipline</h4>
<p>Before any screen exists, enumerate how the model can be wrong. The inversion that makes AI design good, and almost nobody does it.</p>
<ul>
<li><strong>Confidently wrong</strong> — plausible, fluent, incorrect. <em>The hardest and most important case.</em></li>
<li><strong>Subtly wrong</strong> — mostly right with an error buried in the middle</li>
<li><strong>Refuses</strong> — declines a reasonable request</li>
<li><strong>Over-complies</strong> — does something it shouldn't</li>
<li><strong>Misunderstands intent</strong> — answers a different question correctly</li>
<li><strong>Stale or out of scope</strong> — lacks context it needed</li>
<li><strong>Slow or times out</strong></li>
<li><strong>Inconsistent</strong> — different answer to the same input</li>
</ul>
<p>For each: <strong>how would the user find out, and what can they do about it?</strong> If the answer to the first is "they wouldn't," that's your primary design problem, and the whole feature should be shaped around it.</p>
<h4>2. The verification-cost test</h4>
<p>Does the feature reduce total work, <em>counting the cost of checking</em>? Write it out honestly. Many AI features fail this, and identifying that in a brief — before four weeks of design — is exactly the judgment this course is meant to build.</p>
<div class="warn"><strong>The one rule for choosing:</strong> the model must be able to be <em>wrong in a way the user can't immediately detect</em>. That's what makes it a real AI design problem rather than a button that calls an API. Summarisation, extraction, recommendation, generation, classification and agentic actions all qualify. A spell-checker does not.</div>`,
source:{label:"Microsoft HAX Toolkit",url:"https://www.microsoft.com/en-us/haxtoolkit/",note:"Skim the toolkit overview and the design pattern library before writing the brief. Week 11 goes deep on the 18 guidelines."},
deliverable:"Deliverables C1 (feature brief) + C2 (motion spec)",
drill:`<p><strong>C1 — Feature brief</strong> (one page): the job and evidence it exists · the capability in one sentence · <strong>the failure taxonomy</strong>, all eight categories with detectability and recovery · the verification-cost analysis, honest · the appetite · what you're explicitly not doing.</p>
<p><strong>C2 — Motion spec:</strong> motion tokens finalised with real values · the latency timeline for the core AI operation, 0ms → complete → failure · streaming behaviour (what arrives first, completion marker, stop control, layout stability) · reduced-motion variants.</p>
<p><em>Time: C1 ~50 min · C2 ~40 min.</em></p>
<p><code>/product-design-course critique C1</code> — Claude will pressure-test the failure taxonomy. Under-enumerating failure modes is the defining weakness of AI design work and very hard to see from inside.</p>`}
]});
