COURSE.push({w:5,phase:2,title:"Research That Changes Decisions",
thesis:"Most design research is theatre — it produces artifacts that decorate a deck and change nothing. <b>Useful research is defined by one property: at least one decision came out differently because of it.</b>",
days:[
{n:1,title:"Needfinding, and what people cannot tell you",
concept:`
<blockquote><p><strong>People are excellent reporters of their problems and unreliable predictors of their behaviour.</strong></p></blockquote>
<p>Ask "would you use this?" and you get a socially-shaped guess. Ask "walk me through the last time you did this" and you get data. The entire craft is built on that distinction.</p>
<h4>Three things people genuinely cannot tell you</h4>
<ol>
<li><strong>What they'll do in future.</strong> Intention is a weak predictor, and interview settings inflate it — people are trying to be helpful. Every "yes I'd definitely use that" is worth approximately nothing.</li>
<li><strong>Why they did something.</strong> People confabulate causes fluently and sincerely. The explanation is a plausible story constructed after the fact, not a readout of reasoning. Not dishonesty — that's how introspection works.</li>
<li><strong>What they want that doesn't exist.</strong> Articulating an unmet need requires a vocabulary the need hasn't yet generated. They can describe the <em>pain</em> precisely. The solution is your job.</li>
</ol>
<h4>What they're excellent at</h4>
<ul>
<li>Recounting specific past episodes, especially recent and emotionally marked ones</li>
<li>Showing you their actual workarounds — the spreadsheet, the notes app, the sticky note on the monitor</li>
<li>Reacting to something concrete in front of them</li>
<li>Telling you what's annoying, vividly</li>
</ul>
<h4>So needfinding is three moves</h4>
<p><strong>1. Ask about the past, specifically.</strong> Not "how do you usually…" (an idealised composite) but "tell me about the last time you…" (an episode with real detail, including the messy parts).</p>
<p><strong>2. Look for workarounds — the highest-signal artifact in all of design research.</strong> A workaround is proof of a need strong enough that someone paid a real cost to satisfy it, unaided. Someone maintaining a parallel spreadsheet next to your product is a need with demonstrated willingness to pay in effort. Worth more than fifty survey responses.</p>
<p><strong>3. Watch, don't just ask.</strong> People omit the parts that have become invisible to them — and those parts are frequently where the problem lives.</p>
<div class="warn"><strong>On surveys</strong>, since your marketing background will reach for them: surveys measure <em>known</em> variables across a <em>large</em> population. They're terrible at discovery, because you can only ask about what you already thought of. Use surveys to <em>size</em> a problem you've already found qualitatively. Never to find one.</div>`,
source:{label:"Stanford CS147 — needfinding brief",url:"https://hci.stanford.edu/courses/cs147/",note:"A genuinely well-designed exercise you can run on yourself. The book version is Erika Hall, <em>Just Enough Research</em>."},
drill:`<p>Write your <strong>interview guide</strong> for Studio B. 8–10 questions. Rules: every question is about a <em>specific past episode</em>; no question contains your hypothesis; none can be answered yes/no; at least two hunt for workarounds.</p><p>Then read each aloud and delete any you'd be <em>disappointed</em> to get an unexpected answer to — those are the leading ones.</p>`},

{n:2,title:"Running an interview without leading the witness",
concept:`
<p>The interview is a skill, and it's mostly a skill of <strong>restraint</strong>.</p>
<div class="tablewrap"><table>
<tr><th>Phase</th><th>Time</th><th>Purpose</th></tr>
<tr><td>Warm-up</td><td>5 min</td><td>No wrong answers; you didn't build the thing. Get them talking.</td></tr>
<tr><td>Context</td><td>5–10 min</td><td>Their role, world, week. Grounds everything after.</td></tr>
<tr><td>The episode</td><td>15–20 min</td><td>"Tell me about the last time…" then dig. <strong>This is the interview.</strong></td></tr>
<tr><td>Artifacts</td><td>5 min</td><td>"Can you show me?" Screens, files, spreadsheets.</td></tr>
<tr><td>Wrap</td><td>5 min</td><td>"What haven't I asked about?" — routinely the best answer.</td></tr>
</table></div>
<h4>The techniques that matter</h4>
<p><strong>Silence.</strong> After they finish, wait four seconds. It will feel unbearable and they will fill it, and the fill is usually better than the answer. Highest-return technique in interviewing; costs nothing but nerve.</p>
<p><strong>"Tell me more about that."</strong> Content-free, so it can't lead.</p>
<p><strong>The five whys, gently.</strong> Warmly, or it becomes an interrogation.</p>
<p><strong>Ask for the last time, not the usual time.</strong> "Usually" produces a sanitised composite; "last Tuesday" produces reality.</p>
<p><strong>Play back for confirmation.</strong> "So the annoying part isn't X, it's Y?" Frequently prompts a correction more precise than the original.</p>
<h4>The four ways to ruin an interview</h4>
<ol>
<li><strong>Leading.</strong> "Don't you find it frustrating when…" You handed them the answer and they'll take it, because people are cooperative.</li>
<li><strong>Pitching.</strong> The moment you explain your idea, the interview is over — they're reacting to you now.</li>
<li><strong>Fixing.</strong> They describe a problem, you say "oh, you can do that with…" You just taught them a workaround and destroyed your data. Offer help <em>after</em> the recording stops.</li>
<li><strong>Filling silence.</strong> The most common failure and the easiest to fix.</li>
</ol>
<div class="warn"><strong>A specific warning for you.</strong> Marketing interviews are about <em>reaction</em> to messaging — you present and observe. Design interviews are about <em>observation</em> of behaviour with nothing presented. The muscle memory transfers badly. You will want to show them something. Don't.</div>`,
source:{label:"NN/g — User Interviews",url:"https://www.nngroup.com/articles/user-interviews/",note:"Plus their material on avoiding leading questions. The best book on the mechanics is Steve Portigal, <em>Interviewing Users</em>."},
drill:`<p>Run a <strong>practice interview</strong> today on a friend or colleague, about any mundane recurring task — meal planning, passwords, deciding what to watch. 20 minutes, recorded.</p><p>Listen back and count: leading questions, silences you filled, solutions you offered. The count will be higher than you expect. That's the point of doing it before the real ones.</p>`},

{n:3,title:"Synthesis — transcripts to insight without hallucinating",
concept:`
<p>You now have hours of messy human talk. Synthesis is the stage where research most often goes wrong, because it's where you can find whatever you were looking for.</p>
<h4>1. Extract observations, not conclusions</h4>
<p>Pull individual, atomic, <em>quoted</em> things. One per sticky. The rule: <strong>an observation must be something the person said or did, not what you think it means.</strong></p>
<p>✓ "Keeps a separate spreadsheet of which clients have paid, updated weekly"<br>
✗ "Frustrated by lack of payment tracking"</p>
<p>The second is an interpretation smuggled in as data — and once it's on the wall you'll never re-examine it.</p>
<h4>2. Affinity map — without predefined categories</h4>
<p>Let the groups emerge, then name them. If you start with categories, you'll sort into your existing beliefs and learn nothing.</p>
<h4>3. Look for three signals</h4>
<ul>
<li><strong>Repeated behaviours across people</strong> — strongest signal. Three of three doing the same odd thing is a pattern.</li>
<li><strong>Contradictions</strong> — where stated belief conflicts with observed behaviour. This gap is nearly always where the real insight lives.</li>
<li><strong>Emotional spikes</strong> — where the register changed. Emotion marks what matters.</li>
</ul>
<h4>4. Findings, then insights — kept separate</h4>
<blockquote><p><strong>Finding:</strong> All three keep a parallel record outside the tool. Two mentioned not trusting the tool's history after a past sync issue.<br><br><strong>Insight:</strong> The parallel spreadsheet isn't a feature gap — it's a <em>trust</em> artifact. Adding reporting won't remove it. Making history verifiable might.</p></blockquote>
<h4>Guarding against hallucinated patterns</h4>
<ul>
<li><strong>N is tiny.</strong> Three interviews <em>find</em> things and never <em>size</em> them. Say "two of three," never "67% of users."</li>
<li><strong>Count the disconfirmations.</strong> For every pattern, actively look for the interview that contradicts it.</li>
<li><strong>The prediction check.</strong> Go back to your dated hypothesis from Week 4 Day 6. What was wrong? <em>If nothing was wrong, be suspicious of yourself</em> — either you didn't listen, you led, or you picked a problem you already understood.</li>
</ul>
<div class="warn"><strong>On using AI for synthesis.</strong> Models are genuinely good at transcription, first-pass clustering, finding repeated language, and generating counter-hypotheses. They're dangerous at producing a confident synthesis that smooths over the contradictions — which are the valuable part. Use a model to <em>widen</em>; use your own reading to <em>decide</em>. And never let a model see your hypothesis before it clusters — you'll get your hypothesis back, beautifully written.</div>`,
source:{label:"NN/g — Affinity Diagramming",url:"https://www.nngroup.com/articles/affinity-diagram/",note:"The book version is Goodman, Kuniavsky &amp; Moed, <em>Observing the User Experience</em> — the synthesis chapters."},
drill:`<p>Use yesterday's practice interview. Extract 15–20 atomic observations onto stickies. Affinity map with no predefined categories. Name the clusters. Write one finding and one insight, properly separated.</p><p>Notice how much smaller the output is than the input — <strong>that compression is the work.</strong></p>`},

{n:4,title:"Personas: why they mostly fail, and what to use instead",
concept:`
<p>Personas were a genuinely good idea (Alan Cooper) that got hollowed into a ritual. Understanding <em>why</em> they fail teaches more than using them.</p>
<p><strong>The original intent:</strong> stop designing for "the user," an infinitely flexible abstraction who conveniently wants whatever you were going to build. Cooper's insight was that specificity <em>prevents accommodation</em> — you can't add a feature "for the user" if the user is Marcus, 34, who would never find it.</p>
<h4>Why they usually fail</h4>
<ol>
<li><strong>Built from demographics rather than behaviour.</strong> "Sarah, 32, marketing manager, likes yoga." None of that predicts a design decision. Age and hobbies are noise; <em>behaviour under a constraint</em> is signal.</li>
<li><strong>Built from assumption, not research.</strong> A workshop persona is written-down team consensus with the authority of research and none of the substance — worse than nothing.</li>
<li><strong>Too flattering and too coherent.</strong> Real users are inconsistent, distracted, partially informed, doing three things at once. Personas are always competent and always paying attention.</li>
<li><strong>They calcify.</strong> Made once, printed, never updated, cited for four years.</li>
<li><strong>They answer the wrong question.</strong> They tell you <em>who</em>, when the design-relevant question is nearly always <em>in what situation</em>.</li>
</ol>
<h4>Three better tools</h4>
<p><strong>A. Jobs and situations.</strong> Situational and directly generative.</p>
<p><strong>B. Behavioural archetypes.</strong> Defined by behaviour under constraint:</p>
<blockquote><p><strong>The Deadline Deliverer</strong> — works in bursts against external deadlines, uses the tool 3–4 times a month intensively, never explores, never reads release notes, needs everything findable on the day. <em>Fails when:</em> anything moved since last time.</p></blockquote>
<p>That predicts design decisions. "Sarah, 32, likes yoga" does not.</p>
<p><strong>C. Anti-personas</strong> — explicit statements of who you're <em>not</em> designing for. Often the most useful artifact in the room, because it makes a scoping decision visible and arguable rather than implicit.</p>
<p><strong>When personas do work:</strong> large organisations where many people who'll never meet a user need a shared shorthand — and only when grounded in real research, behaviour-first, dated, and revised. That's rare.</p>`,
source:{label:"NN/g — Personas",url:"https://www.nngroup.com/articles/persona/",note:"The mainstream defence. Then Alan Cooper's <em>The Inmates Are Running the Asylum</em> for the original argument. Read both and form a position — you'll be asked in interviews."},
drill:`<p>Write <strong>two behavioural archetypes</strong> for your Studio B problem, based only on what your interviews actually showed. Each defined by behaviour under constraint, each with a "fails when" clause.</p><p>Then <strong>one anti-persona</strong> — who you're explicitly not designing for, and what you're giving up by excluding them.</p>`},

{n:5,title:"Usability testing — the cheapest high-value thing you'll ever do",
concept:`
<p>If you adopt one research method for the rest of your career, adopt this one. Fast, nearly free, and the only method that reliably makes a room full of people agree a design has a problem.</p>
<p><strong>The core finding:</strong> five users find roughly <strong>85%</strong> of usability problems. The curve is steep then flattens. Testing five people <em>twice</em>, on two iterations, beats testing ten <em>once</em> — by a lot. The point isn't statistical confidence, it's problem discovery.</p>
<h4>The protocol</h4>
<ol>
<li><strong>Write tasks, not questions.</strong> "Buy a ticket for the 8pm show on Friday for two" — not "what do you think of this page?" A task produces behaviour; a question produces opinion, and opinion is worthless here.</li>
<li><strong>Set the scene, then shut up.</strong> Your job during the test is silence.</li>
<li><strong>Think-aloud.</strong> When they go quiet, prompt with "what are you thinking?" — never "are you looking for the button?"</li>
<li><strong>Never help.</strong> The hard part, and <em>the entire method</em>. The struggle is the data. Sit on your hands.</li>
<li><strong>Answer questions with questions.</strong> "What do you think it does?"</li>
<li><strong>Record success, time, errors, quotes.</strong></li>
</ol>
<div class="warn"><strong>Why it's politically powerful.</strong> Watching a real person fail at your interface is <em>unarguable</em> in a way a report is not. The single most effective thing you can do to change an organisation's design culture is get engineers and PMs to <strong>watch a session live</strong>. Ten minutes of watching a user hunt for a button they built converts more people than a year of advocacy. Your marketing background should tell you why: it's a demonstration, not a claim.</div>
<p><strong>Moderated</strong> (richer, probe the why, essential for early or complex flows) vs <strong>unmoderated</strong> (Maze, Lyssna — faster, scales, no probing). Use moderated when you don't know what you're looking for; unmoderated when you do.</p>
<p><strong>On testing your own work:</strong> you'll be a worse moderator, because you'll unconsciously help. Write the script in advance, read it verbatim, count your interventions.</p>`,
source:{label:"Why You Only Need to Test with 5 Users",url:"https://www.nngroup.com/articles/why-you-only-need-to-test-with-5-users/",note:"Then Steve Krug's <em>Rocket Surgery Made Easy</em> — essentially a how-to script. The classic short paper is Gomoll &amp; Nicol, \"Guidelines for user observation,\" on the MIT 6.831 list."},
drill:`<p>Write a <strong>usability test script</strong> for the Studio A flow you tore down — three tasks, a scene-setting intro, your think-aloud prompts. Then run it on one person.</p><p>Count your interventions. The number will be embarrassing. That's the lesson.</p>`},

{n:6,studio:"B",title:"Studio B — run three real interviews",
concept:`
<p>Today is fieldwork. No new concept — go and talk to humans.</p>
<h4>Before you start</h4>
<ul>
<li>Interview guide written, leading questions removed</li>
<li>Recording set up, permission script ready</li>
<li>Your dated hypothesis from Week 4 written down <em>where you can't see it during the interviews</em></li>
<li>You have decided, in advance, that you will not pitch</li>
</ul>
<p>Three interviews is 2–3 hours including notes and probably won't fit one session. Spread across two or three days if needed — this is the one day of the course it's fine to expand.</p>
<div class="warn">This is also the day most people quietly skip, and skipping it makes Weeks 6–8 hollow. Everything downstream is built on these three conversations.</div>
<p><strong>Immediately after each one</strong>, before the next: five minutes of "what surprised me" notes. Surprise decays fast — within an hour you'll have rationalised it into something you always knew.</p>`,
source:{label:"NN/g — User Interviews",url:"https://www.nngroup.com/articles/user-interviews/",note:"Skim once more before you start, particularly the section on avoiding leading questions."},
deliverable:"Deliverables B1 (interviews) + B2 (synthesis)",
drill:`<p><strong>B1 — Three interviews.</strong> Recorded, transcribed, with post-interview surprise notes.</p>
<p><strong>B2 — Synthesis:</strong></p>
<ul>
<li>30–50 atomic observations, affinity mapped, clusters named</li>
<li><strong>Findings</strong> — what you observed, with counts ("two of three")</li>
<li><strong>Insights</strong> — what it means, clearly separated from findings</li>
<li><strong>One POV statement</strong> with a surprising and falsifiable "because"</li>
<li><strong>The prediction check</strong> — your Week 4 hypothesis vs what you found. What was wrong? Say it plainly.</li>
</ul>
<p><em>Time: interviews 2–3 hrs (may span days) · synthesis ~90 min.</em></p>
<p><code>/product-design-course critique B2</code> — Claude will check whether your insights are actually derived from your observations, or whether your hypothesis survived by being restated. That's the failure mode here, and it's very hard to see in your own work.</p>`}
]});

/* ---------------- WEEK 6 ---------------- */
COURSE.push({w:6,phase:2,title:"Flows, Structure and Information Architecture",
thesis:"Screens are the <i>output</i> of product design, not the input. The input is a structure — a decomposed task, a flow with branches, a state matrix. <b>Designers who start with screens end up with beautiful products that don't hold together.</b>",
days:[
{n:1,title:"Task analysis — decomposing a goal into steps",
concept:`
<p>Before you can design a flow you have to know what the flow <em>is</em>. Task analysis is the unglamorous decomposition that makes everything after it easy.</p>
<pre>GOAL: Get paid for a completed project
├─ 1. Confirm the work is accepted
│   ├─ 1.1 Send deliverables
│   ├─ 1.2 Confirm receipt
│   └─ 1.3 Handle revision requests        ← usually forgotten
├─ 2. Create the invoice
│   ├─ 2.1 Retrieve agreed rate            ← where does this live?
│   ├─ 2.2 Calculate total incl. tax
│   └─ 2.3 Generate document
├─ 3. Send it
└─ 4. Track and chase                      ← the actual pain
    ├─ 4.1 Know whether it's been seen
    ├─ 4.2 Know whether it's overdue
    └─ 4.3 Chase without damaging the relationship  ← nobody designs this</pre>
<h4>What the decomposition gives you</h4>
<ol>
<li><strong>Steps that happen outside your product.</strong> "Retrieve agreed rate" probably means digging through email. That's a step in the user's task your product doesn't touch — often the best opportunity in the whole tree.</li>
<li><strong>Forgotten branches.</strong> Revisions. Partial payment. The client who never responds. These only surface when you decompose systematically instead of imagining the happy case.</li>
<li><strong>Separation of task from solution.</strong> The tree is technology-neutral. That neutrality lets you notice 4.3 is a <em>social</em> problem your product could address with tone and timing rather than a feature.</li>
<li><strong>Where the pain concentrates.</strong> Everyone builds beautiful invoice generation (step 2) and nobody designs step 4. That mismatch between where effort goes and where pain lives is extremely common.</li>
</ol>
<p><strong>Annotate each leaf with:</strong> frequency (high-frequency steps deserve Fitts-optimised, accelerator-supported design) · difficulty · <strong>information required</strong> (your working-memory audit, and it directly generates your screen content) · who else is involved (steps with other humans have social costs).</p>
<p><strong>How deep?</strong> Stop when a step is a single decision or action with no internal structure. You'll go too shallow the first few times — when a step still feels like it has a story inside it, break it down again.</p>`,
source:{label:"MIT 6.831 — user-centered design & task analysis",url:"https://ocw.mit.edu/courses/6-831-user-interface-design-and-implementation-spring-2011/",note:"Also Rogers, Sharp &amp; Preece, <em>Interaction Design</em>, the chapter on establishing requirements."},
drill:`<p>Full hierarchical task analysis for your Studio B problem, using <strong>only what your interviews told you</strong> — not what you assume. Three levels minimum. Annotate every leaf.</p><p>Circle the steps that happen <em>outside</em> any product. Those circles are your opportunity map.</p>`},

{n:2,title:"Flow diagrams — the artifact that makes you a product designer",
concept:`
<p>If one artifact marks the transition from UI designer to product designer, it's a good flow diagram. It's also what most portfolios are missing, and hiring managers notice.</p>
<p>A flow diagram is not a sitemap and not a wireflow. It's a directed graph of <strong>states and transitions</strong>.</p>
<pre>▭  State/screen    — where the user is
◇  Decision        — a branch, user's or system's
▱  System action   — happens without the user (API call, validation, inference)
⏹  Terminal        — an end state, success OR failure</pre>
<h4>What separates a good flow from a decorative one</h4>
<ol>
<li><strong>Every decision node has all its branches drawn.</strong> A diamond with one line out isn't a decision. The branches are the design work everyone skips.</li>
<li><strong>Failure paths as prominent as the happy path.</strong> Real flows fork constantly: validation failed, network failed, permission denied, session expired, the model refused.</li>
<li><strong>All entry points shown.</strong> Deep link from email, notification, shared URL, back-button re-entry, resumed session. Each arrives with <em>different context available</em> — a flow that assumes front-door entry breaks for everyone else. One of the most common real-world bugs in shipped products.</li>
<li><strong>Exit points, including abandonment.</strong> "User closes the tab at step 3" is a real path and needs a designed answer — usually: save the draft.</li>
<li><strong>Annotated with information required</strong> at each step. This turns a flow into a screen spec without designing screens yet.</li>
</ol>
<div class="warn"><strong>The discipline that makes this hard and worth it:</strong> resist drawing screens. The temptation, for you especially, will be to render each node as a little wireframe. Don't. <strong>The moment the flow contains visual design, you stop being able to see the structure</strong> — and you start defending layouts instead of interrogating logic. Draw it ugly on purpose.</div>
<p>Practical rules: one flow per goal · name states as <em>states</em> ("Payment method selected, unconfirmed") not screen names · number the nodes · draw it in FigJam, not Figma — a low-fidelity canvas keeps you low-fidelity.</p>`,
source:{label:"Page Flows — real product flows",url:"https://pageflows.com/",note:"Study recorded flows and reverse-engineer the diagram from a real product's screens. The book is Jim Kalbach, <em>Mapping Experiences</em>."},
drill:`<p>Draw the complete flow diagram for the <strong>core goal</strong> in your task analysis. Requirements: every decision has all branches · at least three failure paths · at least two entry points · at least one abandonment path with a designed answer.</p><p>Ugly boxes only. If you catch yourself styling it, stop.</p>`},

{n:3,title:"Information architecture, navigation and findability",
concept:`
<p>IA is the least visible and most consequential layer. Get it wrong and no amount of visual polish recovers it, because the user's mental model is built on it.</p>
<p><strong>Three separable problems</strong> — conflating them is the usual mistake: <em>organisation</em> (how things are grouped), <em>labelling</em> (what they're called), <em>navigation</em> (how you move).</p>
<div class="tablewrap"><table>
<tr><th>Scheme</th><th>Example</th><th>Good when</th></tr>
<tr><td>Exact</td><td>Alphabetical contact list</td><td>User knows the exact item</td></tr>
<tr><td>Topical</td><td>Docs by subject</td><td>Well-known, stable domain</td></tr>
<tr><td>Task-based</td><td>"Get paid", "Find work"</td><td>Users think in goals, not objects</td></tr>
<tr><td>Audience-based</td><td>"For teams" / "For individuals"</td><td>Genuinely distinct user groups</td></tr>
<tr><td>Metaphor-based</td><td>Desktop, trash, folders</td><td>Strong existing mental model</td></tr>
</table></div>
<p><strong>Task-based organisation is underused and usually right in product</strong>, because users arrive with intentions. The most common IA failure is organising navigation around your <em>database schema</em> — Accounts, Entities, Records, Settings — perfectly logical, matches nobody's mental model.</p>
<h4>Labelling — the highest-leverage, cheapest work in IA</h4>
<ul>
<li><strong>Use the user's words, from your interviews.</strong> You have transcripts. Grep them. Those words beat anything a naming workshop produces.</li>
<li><strong>Concrete over abstract.</strong> "Insights" tells nobody anything. "Weekly report" does.</li>
<li><strong>Never invent a word when a category-standard one exists</strong> (Jakob's Law). Your clever name costs every user a learning step, forever.</li>
<li><strong>Test labels separately from design.</strong> A first-click test — "where would you click to do X?" — takes fifteen minutes and finds label failures that survive months of design review.</li>
</ul>
<p><strong>Navigation</strong> must always answer three questions: <em>where am I, where can I go, how do I get back.</em> Depth vs breadth is a real trade, but the bigger issue is usually that products bury the 20% of destinations accounting for 80% of trips.</p>
<p><strong>Two methods worth knowing:</strong> <em>card sorting</em> (open = they name the groups, tells you their model; closed = you provide groups, tests yours) and <em>tree testing</em> (structure without visual design — isolates IA failure from visual failure, otherwise almost impossible to separate).</p>`,
source:{label:"Shopify Polaris — naming and content",url:"https://polaris.shopify.com/",note:"How a serious team documents naming decisions. The standard reference is Rosenfeld, Morville &amp; Arango, <em>Information Architecture</em> (the polar bear book)."},
drill:`<p>Do an <strong>open card sort</strong> on your Studio B content — with a real person, ideally an interviewee. Every content item on a card; let them group and name.</p><p>Compare their structure to the one you'd have built. Where they differ, they're right and you're wrong — and finding out why is the exercise.</p>`},

{n:4,title:"The state matrix — every screen is really n screens",
concept:`
<p>The artifact that makes states tractable — and the one that most impresses engineers, because it's the thing they always have to invent themselves.</p>
<div class="tablewrap"><table>
<tr><th>Screen</th><th>Empty</th><th>Loading</th><th>Partial</th><th>Error</th><th>Offline</th><th>Perm-limited</th><th>Success</th></tr>
<tr><td>Project list</td><td>✎</td><td>✎</td><td>—</td><td>✎</td><td>✎</td><td>✎</td><td>—</td></tr>
<tr><td>Project detail</td><td>—</td><td>✎</td><td>✎</td><td>✎</td><td>✎</td><td>✎</td><td>—</td></tr>
<tr><td>Upload</td><td>—</td><td>✎</td><td>✎</td><td>✎</td><td>✎</td><td>—</td><td>✎</td></tr>
</table></div>
<p><code>✎</code> = needs designing. <code>—</code> = not applicable, <strong>and you must be able to say why.</strong></p>
<h4>The states almost everyone forgets</h4>
<ol>
<li><strong>Empty — first-run.</strong> Should <em>teach the model and offer the first action</em>. The highest-leverage screen you'll ever design, and almost universally an afterthought.</li>
<li><strong>Empty — user-emptied.</strong> Different! "Inbox zero," not "No messages."</li>
<li><strong>Empty — filtered to nothing.</strong> Also different. The fix is "clear the filter," not "create your first item." Three different empty states, one slot, and most products ship one message for all three.</li>
<li><strong>Partial.</strong> Some data loaded, some failed. Increasingly common, almost never designed.</li>
<li><strong>Too much.</strong> 10,000 items. Does your card grid survive?</li>
<li><strong>Stale.</strong> Data from ten minutes ago. Do you say so?</li>
<li><strong>Permission-limited.</strong> Hide the control, or show it disabled with a reason? <em>Show it disabled with a reason</em> — hiding makes the product feel broken and inconsistent across users.</li>
<li><strong>Offline / degraded.</strong> What still works? What's queued? What's lost?</li>
</ol>
<blockquote><p>Every one of these cells is a decision that will get made by <em>someone</em>. If you don't make it, an engineer makes it at implementation under deadline, inconsistently with the eleven other cells three different engineers decided. <strong>The matrix isn't documentation — it's the mechanism by which the product stays coherent.</strong></p></blockquote>
<p><strong>Practical:</strong> don't design all cells to the same fidelity. Identify the ~8–12 that matter and design those; for the rest, write a one-line rule ("all list errors use the standard inline error with retry"). Rules cover the long tail better than screens — and a stated rule is what a design system is made of.</p>`,
source:{label:"Polaris — empty, loading and error patterns",url:"https://polaris.shopify.com/",note:"Read how they <em>write about when to use each</em>. The usage guidance is the lesson, not the components. Compare with <a href=\"https://m3.material.io/\">Material 3</a>."},
drill:`<p>Build the full state matrix for your Studio B flow. Every screen × every state dimension. Every <code>—</code> justified in one line.</p><p>Then design <strong>the three empty states</strong> (first-run, user-emptied, filtered-to-nothing) as actual screens. Just those three.</p>`},

{n:5,title:"Progressive disclosure and Tesler's Law",
concept:`
<p><strong>Tesler's Law of Conservation of Complexity:</strong> every system has an irreducible amount of complexity. It cannot be removed — only <em>moved</em>, between the system and the user.</p>
<p>This kills a fantasy. "Simplify it" is not a coherent instruction. The real question is always: <strong>who absorbs this complexity — the user, the designer, or the engineer?</strong></p>
<ul>
<li><strong>Email addresses.</strong> Someone must specify the recipient. Autocomplete moves that from the user's memory into the system's index. The complexity didn't vanish; engineering ate it.</li>
<li><strong>Time zones.</strong> Someone must decide what "3pm" means. Either the user specifies, or the system infers and is sometimes wrong. Every calendar product is a different position on this trade.</li>
<li><strong>AI features.</strong> Task complexity moves to the model. But a <em>new</em> complexity appears — verification. Tesler predicts this exactly: you didn't remove the work, you transformed it.</li>
</ul>
<blockquote><p>When someone says "make it simpler," respond with <strong>"for whom, and what should absorb it?"</strong> That single question will make you sound more senior than almost anything else you can say in a design review.</p></blockquote>
<h4>Progressive disclosure — lightest to heaviest</h4>
<ol>
<li><strong>Sensible defaults</strong> — the most powerful and most underused. If 80% want a value, set it.</li>
<li><strong>Staged disclosure</strong> — "Advanced settings," accordions.</li>
<li><strong>Progressive reduction</strong> — the interface simplifies as competence is demonstrated. Powerful, rare, easy to get wrong.</li>
<li><strong>Separate modes for separate users</strong> — heaviest; doubles your design and maintenance surface. Use last.</li>
</ol>
<h4>Where it goes wrong</h4>
<ul>
<li><strong>Hiding things users need frequently</strong> — you traded a small cost for everyone into a large repeated cost for the people who matter most.</li>
<li><strong>Hiding things users need to know exist</strong> — nobody opens "Advanced." A capability behind a disclosure nobody opens does not exist.</li>
<li><strong>Using it to avoid prioritising.</strong> "We'll put it under More" is how a product accumulates forty features nobody uses.</li>
</ul>
<p><strong>The honest test:</strong> if you removed the disclosed content entirely, would anyone notice? If no — delete it, don't hide it.</p>`,
source:{label:"Laws of UX — Tesler's Law",url:"https://lawsofux.com/teslers-law/",note:"Then NN/g's <a href=\"https://www.nngroup.com/articles/progressive-disclosure/\">Progressive Disclosure</a>. John Maeda's <em>The Laws of Simplicity</em> for the philosophical version."},
drill:`<p>Take a complex interface you use — an editor's settings, a cloud console, an ad manager (your performance marketing background gives good candidates). Identify <strong>where the complexity has been placed</strong> and who absorbs it.</p><p>Then find one thing hidden that shouldn't be, and one thing shown that should be defaulted away. Justify both.</p>`},

{n:6,studio:"B",title:"Studio B — full flow and state map",
concept:`
<p>Assembly day. Everything from this week becomes the structural spec you'll design screens from next week.</p>
<div class="warn"><strong>Why this order matters, since it will feel like a delay.</strong> You could design screens today. They'd look good. And they would encode a structure you hadn't examined, and you'd discover the structural problems in Week 9 when the screens are too polished to throw away. <strong>The structure is cheap to change and the screens are not.</strong> Every hour here saves three later.</div>`,
source:{label:"Mapping Experiences — flows, journeys, blueprints",url:"https://pageflows.com/",note:"Reference real product flows as you assemble. Kalbach's book is the definitive treatment of when each artifact is appropriate."},
deliverable:"Deliverables B3 (task analysis + flow) + B4 (state matrix)",
drill:`<p><strong>B3 — Task analysis + flow diagram</strong></p>
<ul>
<li>HTA, 3 levels minimum, annotated with frequency / difficulty / information required / other people</li>
<li>Complete flow: all decision branches, ≥3 failure paths, ≥2 entry points, ≥1 abandonment path with a designed answer</li>
<li>Numbered nodes, deliberately unstyled</li>
</ul>
<p><strong>B4 — State matrix</strong></p>
<ul>
<li>All screens × all state dimensions; every <code>—</code> justified</li>
<li>The three empty states designed as real screens</li>
<li>A short list of <strong>stated rules</strong> covering the long-tail cells — this list is the seed of your Week 8 design system</li>
</ul>
<p>Plus one paragraph on where Tesler's Law bites: what irreducible complexity exists, and who you've decided absorbs it.</p>
<p><em>Time: TA ~30 min · flow ~45 min · matrix ~30 min · empty states ~30 min. Split across two days if needed.</em></p>`}
]});

/* ---------------- WEEK 7 ---------------- */
COURSE.push({w:7,phase:3,title:"Interface Craft and the Grid Beneath",
thesis:"You can already make things look good. This week is about the specific ways visual and brand craft <b>transfers badly</b> to product interfaces — and about converting your instincts into systems other people can execute against.",
compress:"Behind? Cut this week to Days 1, 5 and 6. They contain what you genuinely don't already know.",
days:[
{n:1,title:"The visual designer's trap — why product UI isn't a poster",
concept:`
<p>The most important day of the week, and it's about unlearning.</p>
<p><strong>Everything that makes a great poster makes a bad product screen.</strong> Not "some things" — the core moves invert.</p>
<div class="tablewrap"><table>
<tr><th>Poster / brand craft</th><th>Product UI</th></tr>
<tr><td>One dominant focal point</td><td>Multiple simultaneous read paths for different intents</td></tr>
<tr><td>Generous, even whitespace = premium</td><td>Even whitespace destroys grouping; space must be rhythmic and unequal</td></tr>
<tr><td>Composition is fixed</td><td>Must survive arbitrary content, length and count</td></tr>
<tr><td>Content chosen to fit the layout</td><td>Layout must accommodate content you'll never see</td></tr>
<tr><td>Read once, then discarded</td><td>Read a thousand times; every friction compounds</td></tr>
<tr><td>Impression is the goal</td><td>Prediction is the goal — the user must know what happens next</td></tr>
<tr><td>Novelty is a virtue</td><td>Novelty is a tax (Jakob's Law)</td></tr>
<tr><td>Beauty is the deliverable</td><td>Beauty is a <em>constraint satisfied</em>, not the objective</td></tr>
</table></div>
<h4>The five failure modes</h4>
<p><strong>1. Designing for the hero case.</strong> You lay out a card with a 22-character title and a nice image. Real data has a 140-character title, no image, eleven tags, and one item where every field is null. <strong>Design with your worst realistic data first</strong>, then check it degrades gracefully to the pretty case. Backwards from how you're trained, and the highest-value habit here.</p>
<p><strong>2. Optimising the first impression over the thousandth use.</strong> The onboarding screen everyone praises is seen once. The list view nobody comments on is seen four hundred times. <em>Spend your effort inversely to how often a screen appears in a portfolio.</em></p>
<p><strong>3. Treating density as failure.</strong> Dense ≠ cluttered. Cluttered means <em>no structure</em>. Bloomberg terminals, Linear, Figma's layers panel — extremely dense and extremely usable, because the density is structured. For expert users, density is a <em>feature</em>: fewer navigations, less memory load, faster comparison.</p>
<p><strong>4. Using colour and weight decoratively.</strong> Visual emphasis is a <em>claim about importance</em> and you have a fixed budget. Ask of every emphasised element: what is this claiming, and is the claim true?</p>
<p><strong>5. Making the artifact rather than the system.</strong> A brand designer delivers a finished thing. A product designer delivers a thing <em>plus the rules by which more of it can be made</em> — usually by other people, without you. <strong>If your Figma file can't be extended by an engineer without asking you a question, it isn't done.</strong></p>
<p><strong>What genuinely transfers, and lean on it hard:</strong> hierarchy and contrast instincts (pure asset, just re-point at <em>meaning</em> rather than <em>impact</em>) · typographic sensitivity (enormously valuable and rare among product designers) · compositional balance under constraint · restraint, once relocated.</p>`,
source:{label:"Refactoring UI — hierarchy & real data",url:"https://www.refactoringui.com/",note:"Written by people who came at this from engineering, so the framing will be unfamiliar in a useful way. Fast read."},
drill:`<p>Take your favourite piece of your own visual work and one dense product UI you admire. Write <strong>ten differences in the design decisions</strong>, and for each, the <em>reason</em> the difference exists.</p><p>Then find one of your past UI pieces and identify which of the five failure modes it committed.</p>`},

{n:2,title:"Spacing systems and the 8pt grid as a language",
concept:`
<p>You know how to space things. What's missing is that in product, <strong>spacing must be a stated system, not a per-screen judgment</strong> — because other people have to reproduce it, at scale, without you.</p>
<p><strong>Why a base unit</strong> (4 or 8): it makes spacing finite and shareable. Instead of infinite choices you have a scale, and the scale is a <em>shared vocabulary</em> between you, the next designer, and the engineer. The specific number matters much less than the fact that there is one.</p>
<p>A typical scale: <code>4, 8, 12, 16, 24, 32, 48, 64, 96</code>. Roughly geometric at the top — evenly spaced steps stop being distinguishable, and you need big jumps to make grouping legible.</p>
<blockquote><p>Space <em>within</em> a group must be visibly smaller than space <em>between</em> groups. <strong>Aim for at least 2×.</strong></p></blockquote>
<p>This is Gestalt proximity expressed as a number. When a screen feels "flat" or hard to parse, this rule is usually being violated — everything is 16px from everything, so nothing is grouped. Fixing spacing rhythm is frequently the highest-impact, lowest-effort change available.</p>
<p><strong>Vertical rhythm, realistically:</strong> perfect baseline grids are a print inheritance and rarely survive product constraints. What matters is <em>consistency of gaps between component types</em> — the space above a section heading is always X. Consistency of relationship beats mathematical purity.</p>
<div class="warn"><strong>Auto-layout is spatial reasoning, not convenience.</strong> It's the mechanism by which your spacing becomes a <em>rule</em> rather than a <em>position</em>. A hand-positioned layout encodes nothing; an auto-layout with named spacing tokens encodes intent that survives content change and translates directly to what engineers build. If you're placing by eye and nudging, you're producing a picture of an interface rather than a specification of one.</div>
<p><strong>Density scales.</strong> Serious systems ship more than one. Carbon has multiple row heights; Material has density variants. Deciding your density <em>stance</em> per surface is a real design decision.</p>`,
source:{label:"IBM Carbon — the 2x grid and spacing",url:"https://carbondesignsystem.com/",note:"Read alongside <a href=\"https://m3.material.io/\">Material 3's layout guidance</a> as two different opinions about the same problem. The disagreement is more instructive than either alone."},
drill:`<p>Take one screen you've designed. Measure <strong>every</strong> space in it. List the unique values. If there are more than eight, you don't have a system.</p><p>Rebuild it on a strict scale, enforcing the 2× within/between rule. Compare before and after — the difference will be larger than you expect.</p>`},

{n:3,title:"Typographic scale for interfaces, not for brand",
concept:`
<p>Your typography is likely your strongest asset. The transfer problem: <strong>brand typography optimises for voice and impact; interface typography optimises for scanning, hierarchy and legibility at small sizes under fatigue.</strong></p>
<p><strong>Fewer sizes.</strong> Editorial can carry a dozen. A product interface needs about 5–7 total: display, heading, subheading, body, secondary, caption, maybe an overline. More and hierarchy stops <em>reading</em> as hierarchy — the user can't tell two adjacent levels apart, so they carry no information.</p>
<p><strong>Smaller steps.</strong> Brand scales use dramatic ratios (1.5, golden). Interface scales are tighter — 1.125 to 1.25 — because you need many distinguishable levels in a small range. Big ratios blow out the top and you can't fit a heading in a card.</p>
<p><strong>Weight does more work than size.</strong> In dense UI, changing size disturbs layout; changing weight doesn't. <code>600 at 14px</code> vs <code>400 at 14px</code> is a clear hierarchy step costing zero vertical space. Under-used by designers coming from print, where the size lever is cheap.</p>
<p><strong>Line length still matters</strong>, and it's the most-violated rule in product UI. 45–75 characters. Wide dashboard columns routinely produce 150-character body text that's genuinely hard to read — and nobody flags it, because it looks fine at a glance.</p>
<p><strong>Line height inverts.</strong> Small text needs <em>more</em> relative line height (1.5–1.6); large display needs <em>less</em> (1.1–1.2). One ratio across a scale is a common, visible error.</p>
<p><strong>Numerals matter more than in brand work.</strong> Tabular figures for anything in a column — prices, counts, dates, metrics. Proportional numerals in a table make comparison genuinely harder, and it's invisible until you look for it. Check your typeface has them <em>before</em> committing to it for a data-heavy product.</p>
<div class="warn"><strong>Font choice, honestly:</strong> a highly characterful typeface is a liability at small sizes and in long sessions. This will fight your instincts. The right move is usually a workhorse UI face for the interface, spending your typographic personality budget on marketing surfaces, headings and empty states — where it's seen briefly and does brand work. Not a compromise; correct allocation of a resource.</div>`,
source:{label:"Compare Material, Polaris and Carbon type scales",url:"https://m3.material.io/",note:"Three resolutions of the same constraints. Then <em>Refactoring UI</em>'s typography chapters."},
drill:`<p>Build a <strong>complete interface type scale</strong> for Studio B: 5–7 sizes, each with weight, line-height, letter-spacing, and a stated <em>use</em> ("card title," "table cell," "helper text").</p><p>The use statement is the deliverable — a scale without semantics is decoration. Then set the densest screen in your flow using only that scale.</p>`},

{n:4,title:"Colour as semantics — status, hierarchy, tokens",
concept:`
<p>In brand work colour is expression. In product, <strong>colour is primarily a carrier of meaning</strong> — and meaning has to be consistent or it stops working.</p>
<h4>The four jobs colour does</h4>
<ol>
<li><strong>Status</strong> — success, warning, error, info. The one place external consistency outranks brand differentiation. Green-means-good is worth more to your user than your palette is.</li>
<li><strong>Hierarchy / emphasis</strong> — primary vs secondary vs tertiary action. A <em>ranking</em>, and rankings break if there are two firsts.</li>
<li><strong>Categorisation</strong> — labels, tags, chart series. Limited to ~5–7 distinguishable categories. Beyond that, colour has stopped encoding and started decorating.</li>
<li><strong>Brand presence</strong> — the smallest job, and the one that most often eats the others' budget.</li>
</ol>
<p><strong>The rule:</strong> if a colour appears and doesn't do one of jobs 1–3, ask whether it should be there. Brand colour should be <em>deployed</em>, in specific places, not <em>distributed</em>.</p>
<p><strong>Never encode with colour alone.</strong> ~8% of men have colour vision deficiency, and colour-only encoding also fails in bright light, on bad screens, in dark mode, in printouts. Pair with icon, text, position, or shape.</p>
<h4>Semantic tokens — the mental shift</h4>
<pre>PRIMITIVE   blue-500, grey-100, red-600      (raw; never used directly)
    ↓
SEMANTIC    action-primary, surface-raised,   (meaning — you design with these)
            status-danger, text-secondary
    ↓
COMPONENT   button-primary-bg,                (only when a component must diverge)
            input-border-focus</pre>
<p>Why: <strong>dark mode becomes a remapping instead of a redesign.</strong> Without semantic tokens, dark mode is a manual re-decision on every element and it always drifts. Meaning stays consistent because there's one place it's defined. You can change the brand without touching a screen. And it's the vocabulary engineers already use.</p>
<p><strong>Dark mode specifically:</strong> it is not an inversion. Pure black causes halation with light text — use dark grey. Elevation inverts: light mode raised surfaces get <em>shadows</em>, dark mode raised surfaces get <em>lighter</em>. Saturated colours vibrate against dark and usually need desaturating. Contrast must be re-verified, not assumed — a pair that passes in light mode frequently fails inverted.</p>`,
source:{label:"Material 3 — the colour system",url:"https://m3.material.io/styles/color/system/overview",note:"The most thoroughly worked-out public treatment of semantic colour. Then <a href=\"https://spectrum.adobe.com/\">Adobe Spectrum</a> for a more restrained take."},
drill:`<p>Build the <strong>semantic colour token set</strong> for Studio B. Three layers. Requirements: every semantic token has a stated meaning · every status colour is paired with a non-colour signal · the whole set resolves in both light and dark.</p><p>Apply it to your densest screen and check contrast in both modes.</p>`},

{n:5,title:"Layout under pressure — real data, long strings, resizing",
concept:`
<p>The day that separates a portfolio screen from a shippable one, and the one that's genuinely new to you.</p>
<h4>Four kinds of pressure</h4>
<p><strong>1. Content pressure.</strong> The realistic worst case for every field: longest plausible name, then the <em>implausible</em> one (someone will paste an essay into your 30-character field) · empty and null · counts of 0, 1, 2, 10,000 · numbers at every magnitude (does the column jump?) · <strong>other languages</strong> — German compounds run ~30% longer, Arabic and Hebrew reverse the layout, CJK is denser but taller. Even if English-only today, designing to survive +30% string length is free insurance and takes ten minutes.</p>
<p><strong>2. Viewport pressure.</strong> Not "mobile, tablet, desktop" — a continuous range, plus a resized window, plus split-screen tablet, plus a 4K monitor where your max-width has to actually exist or line lengths go to 200 characters.</p>
<p><strong>3. State pressure.</strong> Every cell of your state matrix must fit in the <em>same</em> layout. An error appearing must not reflow everything below into a different position — that's a Fitts disaster, because the user's target moves out from under a click already in flight.</p>
<p><strong>4. Time pressure.</strong> Content arrives asynchronously. Does the layout jump as things load? Cumulative layout shift is a genuine usability failure — it causes mis-clicks and makes a product feel unstable in a way users describe as "cheap" without being able to say why.</p>
<h4>The techniques</h4>
<ul>
<li><strong>Design the extremes first, then the middle.</strong></li>
<li><strong>Reserve space for async content.</strong> Skeleton at final dimensions, not a spinner that collapses.</li>
<li><strong>Truncate deliberately.</strong> End-truncation loses file extensions; middle-truncation preserves both ends (<code>document_final…v3.pdf</code>). Decide per field.</li>
<li><strong>Constrain, don't just fill.</strong> <code>max-width</code> on text containers is one line of intent that fixes a whole class of large-screen failure.</li>
<li><strong>Test at 200% browser zoom.</strong> A WCAG requirement, and it finds layout assumptions nothing else does.</li>
</ul>
<div class="warn"><strong>The habit worth building:</strong> keep a "torture test" data set for your project — longest name, null-heavy record, 200-item list, zero state, 8-digit number. Paste it in before you call a screen done. Two minutes, and it catches most of what would otherwise reach QA.</div>`,
source:{label:"Inclusive Components",url:"https://inclusive-components.design/",note:"Every article treats content and viewport pressure as first-class, which is unusual and instructive."},
drill:`<p>Take your densest Studio B screen. Build a <strong>torture-test version</strong>: longest realistic strings everywhere, one null-heavy record, a 200-item list, an inline error, at 320px and 2560px wide, at 200% zoom.</p><p>Screenshot every failure. Fix them. This is the drill that most changes the quality of your output.</p>`},

{n:6,studio:"B",title:"Studio B — screens from your flows",
concept:`
<p>Now you design. Note what you have that you didn't in Week 1: a task analysis, a flow with branches, a state matrix, a type scale, a colour system, a spacing system, and real research behind all of it.</p>
<div class="warn"><strong>The rule for today:</strong> every screen must be traceable to a node in your flow diagram. Label them with node numbers. If you find yourself designing a screen that isn't in the flow, <strong>stop and go fix the flow</strong> — either you found a real gap (good, update it) or you're inventing (bad, delete it).</div>
<p><strong>Order of work:</strong> the densest, most data-heavy screen first (it stress-tests every system decision) → the three empty states → the happy-path core flow → one failure path, fully designed.</p>
<p>Do not start with the prettiest screen. You'll over-invest in it and bend the system around it.</p>`,
source:{label:"Mobbin — how serious teams solved this",url:"https://mobbin.com/",note:"Use as <em>evidence</em>, never as a shortcut past thinking. Look for how shipped products handle the states you're designing."},
deliverable:"Deliverable B5 — 6–10 screens",
drill:`<ul>
<li>Every screen labelled with its flow node number</li>
<li>Every screen built with auto-layout and named tokens — no hand-positioned elements</li>
<li>Spacing from your scale only; type from your scale only; colour from your semantic tokens only</li>
<li>At least one screen shown in three states (default, empty, error)</li>
<li>The torture-test version of your densest screen included</li>
<li>Light and dark for at least the densest screen</li>
</ul>
<p>Plus one paragraph: what did designing the screens reveal that the flow diagram missed? There will be something.</p>
<p><em>Time: 3–4 hours across two days. The biggest making-day so far.</em></p>
<p><code>/product-design-course critique B5</code> — ask Claude to check traceability and system compliance specifically, not aesthetics. You don't need help with aesthetics.</p>`}
]});
