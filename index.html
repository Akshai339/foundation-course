<title>Foundation — Product Design Course</title>

<script>
/* Belt and braces: if the host skeleton didn't emit a viewport meta, add one.
   Without it phones use a ~980px fallback viewport and the mobile layout never applies. */
(function(){
  if(!document.querySelector('meta[name="viewport"]')){
    var m=document.createElement("meta");
    m.setAttribute("name","viewport");
    m.setAttribute("content","width=device-width, initial-scale=1, viewport-fit=cover");
    (document.head||document.documentElement).appendChild(m);
  }
})();
</script>

<style>
  :root {
    --ground:#F5F6F8; --surface:#FFFFFF; --surface-2:#EBEEF2; --surface-3:#E0E4EB;
    --ink:#111519; --ink-2:#48525F; --ink-3:#7A8492;
    --line:#DBDFE7; --line-2:#C4CAD5;
    --accent:#1E38C4; --accent-ink:#1E38C4; --accent-soft:#E6EAFA; --accent-line:#B9C3F0;
    --good:#146B4B; --good-soft:#E2F2EA;
    --warn:#8A5A00; --warn-soft:#FBF2DE;
    --p1:#BDC7F0; --p2:#8D9CE4; --p3:#4C61D4; --p4:#1E38C4;
    --on-p1:#111519; --on-p2:#FFFFFF; --on-p3:#FFFFFF; --on-p4:#FFFFFF;
    --shadow:0 1px 2px rgba(17,21,25,.05), 0 10px 30px -20px rgba(17,21,25,.25);
    --shadow-lg:0 2px 6px rgba(17,21,25,.06), 0 24px 60px -30px rgba(17,21,25,.35);
    --serif: ui-serif, "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "Segoe UI Variable Text", "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#0B0E12; --surface:#13171D; --surface-2:#1A1F27; --surface-3:#232933;
      --ink:#E8ECF2; --ink-2:#A2ABB9; --ink-3:#6B7583;
      --line:#242A33; --line-2:#333B47;
      --accent:#8298FF; --accent-ink:#A6B4FF; --accent-soft:#171F3B; --accent-line:#2E3A66;
      --good:#5FD1A2; --good-soft:#10241C;
      --warn:#DDA84B; --warn-soft:#231C0D;
      --p1:#293251; --p2:#3C4B87; --p3:#5A70C9; --p4:#8298FF;
      --on-p1:#C5CDE4; --on-p2:#EAEEFB; --on-p3:#0B0E12; --on-p4:#0B0E12;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -20px rgba(0,0,0,.8);
      --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -30px rgba(0,0,0,.9);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B0E12; --surface:#13171D; --surface-2:#1A1F27; --surface-3:#232933;
    --ink:#E8ECF2; --ink-2:#A2ABB9; --ink-3:#6B7583;
    --line:#242A33; --line-2:#333B47;
    --accent:#8298FF; --accent-ink:#A6B4FF; --accent-soft:#171F3B; --accent-line:#2E3A66;
    --good:#5FD1A2; --good-soft:#10241C; --warn:#DDA84B; --warn-soft:#231C0D;
    --p1:#293251; --p2:#3C4B87; --p3:#5A70C9; --p4:#8298FF;
    --on-p1:#C5CDE4; --on-p2:#EAEEFB; --on-p3:#0B0E12; --on-p4:#0B0E12;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -20px rgba(0,0,0,.8);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 24px 60px -30px rgba(0,0,0,.9);
  }
  :root[data-theme="light"]{
    --ground:#F5F6F8; --surface:#FFFFFF; --surface-2:#EBEEF2; --surface-3:#E0E4EB;
    --ink:#111519; --ink-2:#48525F; --ink-3:#7A8492;
    --line:#DBDFE7; --line-2:#C4CAD5;
    --accent:#1E38C4; --accent-ink:#1E38C4; --accent-soft:#E6EAFA; --accent-line:#B9C3F0;
    --good:#146B4B; --good-soft:#E2F2EA; --warn:#8A5A00; --warn-soft:#FBF2DE;
    --p1:#BDC7F0; --p2:#8D9CE4; --p3:#4C61D4; --p4:#1E38C4;
    --on-p1:#111519; --on-p2:#FFFFFF; --on-p3:#FFFFFF; --on-p4:#FFFFFF;
    --shadow:0 1px 2px rgba(17,21,25,.05), 0 10px 30px -20px rgba(17,21,25,.25);
    --shadow-lg:0 2px 6px rgba(17,21,25,.06), 0 24px 60px -30px rgba(17,21,25,.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;}
  a{color:var(--accent-ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}

  /* ================= APP SHELL ================= */

  .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh;}

  aside{
    background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:0;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:22px 20px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;}
  .brand b{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.015em;}
  .brand span{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);}

  nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;}
  .navbtn{
    display:flex;align-items:center;gap:11px;width:100%;
    padding:9px 11px;border:0;background:none;border-radius:5px;
    cursor:pointer;text-align:left;font-size:14.5px;color:var(--ink-2);
  }
  .navbtn:hover{background:var(--surface-2);color:var(--ink);}
  .navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
  .navbtn .ic{width:16px;flex:none;text-align:center;font-size:13px;opacity:.85;}

  .rail-prog{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:9px;}
  .rail-prog .pct{display:flex;align-items:baseline;gap:6px;}
  .rail-prog .pct b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .rail-prog .pct span{font-size:12.5px;color:var(--ink-3);}
  .bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s ease;}
  .rail-prog .ph{font-size:12px;color:var(--ink-3);}
  .rail-prog .streak{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em;}

  main{min-width:0;padding:0 0 120px;}

  .topbar{
    position:sticky;top:0;z-index:20;background:var(--ground);
    border-bottom:1px solid var(--line);
    padding:14px clamp(18px,4vw,52px);
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);}
  .topbar .sp{flex:1;}
  .tbtn{
    background:var(--surface);border:1px solid var(--line);border-radius:5px;
    padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--line-2);color:var(--ink);}

  .view{padding:clamp(26px,4vw,46px) clamp(18px,4vw,52px) 0;max-width:1080px;}
  .view[hidden]{display:none;}

  /* ================= TYPE ================= */

  h1.vt{font-family:var(--serif);font-size:clamp(30px,4.6vw,44px);font-weight:600;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance;}
  h2.st{font-family:var(--serif);font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance;}
  .lede{font-family:var(--serif);font-size:clamp(16.5px,2vw,19px);line-height:1.55;color:var(--ink-2);max-width:62ch;margin:0;text-wrap:pretty;}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:0;}

  /* ================= TODAY ================= */

  .today-head{display:flex;flex-direction:column;gap:14px;margin-bottom:30px;}
  .today-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chip{
    font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;padding:4px 8px;border-radius:3px;white-space:nowrap;
  }
  .chip.ph1{background:var(--p1);color:var(--on-p1);}
  .chip.ph2{background:var(--p2);color:var(--on-p2);}
  .chip.ph3{background:var(--p3);color:var(--on-p3);}
  .chip.ph4{background:var(--p4);color:var(--on-p4);}
  .chip.ghost{background:var(--surface-2);color:var(--ink-3);}
  .chip.done{background:var(--good-soft);color:var(--good);}
  .chip.studio{background:var(--ink);color:var(--ground);}

  .wk-thesis{
    background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:0 5px 5px 0;padding:15px 18px;font-family:var(--serif);
    font-size:16px;line-height:1.55;color:var(--ink-2);max-width:66ch;
  }
  .wk-thesis b{color:var(--ink);font-weight:600;font-style:italic;}

  .blocks{display:flex;flex-direction:column;gap:18px;max-width:none;}

  .block{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:var(--shadow);}
  .block-head{
    display:flex;align-items:center;gap:11px;padding:13px 20px;
    border-bottom:1px solid var(--line);background:var(--surface-2);
  }
  .block-head h3{margin:0;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);}
  .block-head time{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap;}
  .block-body{padding:20px 22px 24px;}

  .prose{max-width:66ch;}
  .prose > *:first-child{margin-top:0;}
  .prose > *:last-child{margin-bottom:0;}
  .prose p{margin:0 0 15px;font-size:15.5px;line-height:1.68;color:var(--ink-2);}
  .prose p strong,.prose li strong{color:var(--ink);font-weight:600;}
  .prose h4{
    margin:26px 0 10px;font-size:12px;letter-spacing:.11em;text-transform:uppercase;
    font-weight:700;color:var(--ink-3);
  }
  .prose ul,.prose ol{margin:0 0 15px;padding-left:20px;}
  .prose li{margin-bottom:7px;font-size:15.5px;line-height:1.62;color:var(--ink-2);}
  .prose blockquote{
    margin:18px 0;padding:12px 16px;background:var(--accent-soft);
    border-left:2px solid var(--accent);border-radius:0 4px 4px 0;
    font-family:var(--serif);font-size:16.5px;line-height:1.5;color:var(--ink);
  }
  .prose blockquote p{margin:0;color:inherit;font-size:inherit;line-height:inherit;}
  .prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:3px;border:1px solid var(--line);}
  .prose pre{
    font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--surface-2);
    border:1px solid var(--line);border-radius:5px;padding:14px 16px;overflow-x:auto;margin:0 0 16px;color:var(--ink-2);
  }
  .prose .tablewrap{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:5px;}
  .prose table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px;}
  .prose th,.prose td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5;}
  .prose th{background:var(--surface-2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700;white-space:nowrap;}
  .prose tr:last-child td{border-bottom:0;}
  .prose td:first-child{font-weight:600;color:var(--ink);}
  .prose .warn{
    background:var(--warn-soft);border-left:2px solid var(--warn);color:var(--warn);
    padding:11px 15px;border-radius:0 4px 4px 0;margin:0 0 16px;font-size:14.5px;
  }
  .prose .warn strong{color:var(--warn);}

  .srcbox{display:flex;flex-direction:column;gap:11px;}
  .srclink{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent-ink);
    padding:9px 14px;border-radius:5px;text-decoration:none;font-size:14.5px;font-weight:600;
  }
  .srclink:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .srclink .ar{font-size:11px;opacity:.7;}
  .srcnote{margin:0;font-size:14.5px;color:var(--ink-2);max-width:64ch;line-height:1.6;}

  .deliv{
    background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:5px;
    padding:12px 15px;margin:0 0 16px;font-size:13.5px;color:var(--accent-ink);font-weight:600;
  }

  .daynav{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    margin-top:26px;padding-top:22px;border-top:1px solid var(--line);
  }
  .bigbtn{
    flex:1 1 auto;min-width:190px;display:flex;align-items:center;justify-content:center;gap:9px;
    background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:6px;
    padding:14px 20px;font-size:15px;font-weight:600;cursor:pointer;
  }
  .bigbtn:hover{filter:brightness(1.08);}
  .bigbtn.isdone{background:var(--good-soft);color:var(--good);border-color:var(--good);}
  .navbtn2{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:14px 18px;font-size:14.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap;
  }
  .navbtn2:hover:not(:disabled){border-color:var(--line-2);color:var(--ink);}
  .navbtn2:disabled{opacity:.35;cursor:not-allowed;}

  /* ================= COURSE MAP ================= */

  .phase{display:flex;flex-direction:column;gap:13px;margin-bottom:32px;}
  .phase-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--line-2);}
  .phase-head h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:600;}
  .phase-head .gl{margin:0;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink-3);}
  .wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;}
  .wcard{
    background:var(--surface);border:1px solid var(--line);border-radius:6px;
    padding:15px 17px 12px;display:flex;flex-direction:column;gap:11px;
  }
  .wcard-top{display:flex;gap:11px;align-items:flex-start;}
  .wcard-top .wn{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink-3);padding-top:3px;font-variant-numeric:tabular-nums;}
  .wcard-top b{font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.005em;flex:1;}
  .wcard-top .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap;padding-top:3px;font-variant-numeric:tabular-nums;}
  .dlist{display:flex;flex-direction:column;gap:1px;}
  .drow{
    display:flex;gap:9px;align-items:flex-start;width:100%;
    background:none;border:0;padding:6px 7px;border-radius:4px;cursor:pointer;text-align:left;
    font-size:13.5px;line-height:1.45;color:var(--ink-2);
  }
  .drow:hover{background:var(--surface-2);color:var(--ink);}
  .drow .dn{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;padding-top:1px;width:9px;}
  .drow .tick{flex:none;width:13px;font-size:11px;color:var(--good);padding-top:1px;}
  .drow.is-done .dt{color:var(--ink-3);text-decoration:line-through;}
  .drow.is-cur{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;}
  .drow.is-studio .dt{font-weight:600;color:var(--ink);}

  /* ================= STUDIOS ================= */

  .studios{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px;}
  .studio{
    background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ink);
    border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:11px;
  }
  .studio.cap{border-top-color:var(--accent);}
  .studio .smeta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);}
  .studio h3{margin:0;font-family:var(--serif);font-size:21px;font-weight:600;}
  .studio p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6;}
  .studio .fail{margin-top:3px;padding-top:11px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-3);}
  .studio .fail b{color:var(--ink-2);}
  .dlv{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
  .dlv label{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer;padding:4px 5px;border-radius:4px;line-height:1.45;}
  .dlv label:hover{background:var(--surface-2);}
  .dlv input{margin:3px 0 0;accent-color:var(--accent);width:14px;height:14px;flex:none;cursor:pointer;}
  .dlv input:checked ~ span{text-decoration:line-through;color:var(--ink-3);}
  .dlv .code{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:none;width:18px;padding-top:1px;}

  /* ================= LIBRARY ================= */

  .lib{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:24px 32px;}
  .libgroup{display:flex;flex-direction:column;gap:10px;}
  .libgroup h3{margin:0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .libgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;}
  .libgroup li{font-size:14px;line-height:1.45;}
  .libgroup a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2);}
  .libgroup a:hover{color:var(--accent-ink);border-bottom-color:var(--accent);}
  .libgroup .by{display:block;color:var(--ink-3);font-size:12.5px;margin-top:1px;}
  .st{color:var(--accent-ink);font-size:10px;}

  /* ================= SETTINGS / SYNC ================= */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 22px;display:flex;flex-direction:column;gap:13px;max-width:640px;}
  .panel h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600;}
  .panel p{margin:0;font-size:14.5px;color:var(--ink-2);line-height:1.6;}
  .synccode{
    font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:5px;padding:11px 13px;width:100%;color:var(--ink);resize:vertical;min-height:76px;
  }
  .row{display:flex;gap:9px;flex-wrap:wrap;}
  .pbtn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:5px;padding:9px 15px;font-size:14px;font-weight:600;cursor:pointer;}
  .pbtn.sec{background:var(--surface);color:var(--ink-2);border-color:var(--line);font-weight:400;}
  .pbtn.sec:hover{border-color:var(--line-2);color:var(--ink);}
  .ok{font-size:13px;color:var(--good);}

  /* ================= MOBILE ================= */

  .mobtabs{display:none;}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    aside{display:none;}
    main{padding-bottom:82px;}
    .view{padding:20px 16px 0;}
    .topbar{padding:12px 16px;}
    .mobtabs{
      display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:40;
      background:var(--surface);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));
    }
    .mtab{
      display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;
      padding:7px 2px;border-radius:6px;cursor:pointer;color:var(--ink-3);font-size:10px;letter-spacing:.02em;
    }
    .mtab .ic{font-size:15px;}
    .mtab[aria-current="page"]{color:var(--accent-ink);font-weight:600;}
    .block-body{padding:17px 16px 20px;}
    .block-head{padding:11px 16px;}
    .prose p,.prose li{font-size:16px;}
    .bigbtn{min-width:100%;}
    .daynav{flex-direction:column-reverse;}
    .navbtn2{width:100%;}
  }

  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;}}

COURSE.push({w:1,phase:1,title:"The Discipline and the Machine in the Head",
thesis:"A user is not looking at your interface. They are running a loop — form a goal, guess what to do, do it, look at what happened, decide if it worked. <b>Every good interface decision is a decision about that loop.</b>",
days:[
{n:1,title:"What product design actually is, and the four things it isn't",
concept:`
<p>Most definitions of product design are useless because they list activities. Here's a better one:</p>
<blockquote><p>Product design is deciding <strong>what should exist, for whom, at what cost</strong> — and then making it comprehensible.</p></blockquote>
<p>Two clauses. The first is a <em>judgment</em> problem. The second is a <em>craft</em> problem. You are currently strong at the second and untrained in the first. That asymmetry is why this course is shaped the way it is.</p>
<h4>The four things it isn't</h4>
<p><strong>It isn't UI design.</strong> UI is the visual and interactive surface — a component of product design, roughly as typesetting is a component of publishing. A UI designer receives a spec and makes it good. A product designer questions whether the spec should exist. When people say "AI made design easy," they mean AI made <em>UI</em> easy. They're right, and it's exactly why the value moved upstream.</p>
<p><strong>It isn't UX design</strong>, as the title is usually used — research and flows without visual execution. Product design is the integrated role. Your generalist background is an advantage here, not a compromise.</p>
<p><strong>It isn't user advocacy.</strong> This trips up thoughtful people. Your job is not to be the user's lawyer in a room of businesspeople. It's to find designs where the user's interest and the business's interest are <em>the same thing</em>, and be honest when they're not. A designer who only ever argues for the user gets quietly routed around.</p>
<p><strong>It isn't problem-solving. It's problem-<em>selecting</em>.</strong> Anyone can solve a well-defined problem, and increasingly a model can too. Choosing which problem is worth solving, in what order, with how much effort — that's the job.</p>
<div class="warn"><strong>Hold onto this:</strong> for three weeks you're building a <em>mechanical</em> model of the user. Not an empathetic one. Empathy tells you to care. Mechanism tells you what to do.</div>`,
source:{label:"MIT 6.831 — Lecture 1: Usability",url:"https://ocw.mit.edu/courses/6-831-user-interface-design-and-implementation-spring-2011/",note:"Read for usability as <em>learnability, efficiency, safety</em> — three dimensions that usually trade off against each other. Note where each of your favourite tools sits."},
drill:`<p>Write 200 words on: <strong>"the last time I designed something that looked right and worked badly."</strong> Be specific and unkind to yourself. Name what you optimised for instead of the user's loop.</p><p>Keep this. You re-read it in Week 12.</p>`},

{n:2,title:"Norman's Action Cycle and the two Gulfs",
concept:`
<p>The single most useful model in the field. Learn it properly and you will diagnose interfaces for the rest of your career.</p>
<pre>                    GOAL
                  ("I want X")
                      |
      +---------------+---------------+
      |                               |
  EXECUTION                       EVALUATION
      |                               |
  1. Plan     (what can I do?)    7. Compare   (did I get X?)
  2. Specify  (how do I do it?)   6. Interpret (what does that mean?)
  3. Perform  (do it)             5. Perceive  (what happened?)
      |                               |
      +----------&gt; THE WORLD &lt;--------+</pre>
<p>Between intentions and controls there is a <strong>Gulf of Execution</strong>: can I figure out how to do what I want? Between the system's output and understanding there is a <strong>Gulf of Evaluation</strong>: can I tell what happened and whether it worked?</p>
<blockquote><p>Every usability problem is one of these two gulfs. Not most. <strong>All.</strong></p></blockquote>
<p>It's a diagnostic, not a metaphor. When something feels bad, don't say "it's confusing." Ask which gulf, which stage:</p>
<div class="tablewrap"><table>
<tr><th>Symptom</th><th>Stage</th><th>The fix is about</th></tr>
<tr><td>"I don't know what I can do here"</td><td>1. Plan</td><td>Visibility, affordances</td></tr>
<tr><td>"I know what I want but not how"</td><td>2. Specify</td><td>Labelling, mapping, discoverability</td></tr>
<tr><td>"I tried and it didn't take"</td><td>3. Perform</td><td>Hit targets, gestures, constraints</td></tr>
<tr><td>"Did that work?"</td><td>5. Perceive</td><td>Feedback — the most common failure</td></tr>
<tr><td>"It did something, I don't know what"</td><td>6. Interpret</td><td>Legible system state</td></tr>
<tr><td>"It worked but not how I wanted"</td><td>7. Compare</td><td>Mismatched conceptual model</td></tr>
</table></div>
<p>Nine times out of ten it's stage 5 or 6 — the system did something and told you nothing. Feedback is cheap to build and chronically under-designed, which makes it the highest-leverage thing a new product designer can fix.</p>
<div class="warn"><strong>For AI products:</strong> the Gulf of Evaluation is <em>enormous</em>. The model did something. Was it right? You often can't tell by looking. That's the defining design problem of your industry — and it's not new, it's Norman's stage 6 at maximum difficulty.</div>`,
source:{label:"The Design of Everyday Things — Ch. 2",url:"https://omscs6750.gatech.edu/spring-2022/required-reading-list/",note:"Norman, <em>The Psychology of Everyday Actions</em>. The Georgia Tech CS6750 reading list confirms the chapter mapping; Norman's 1986 \"Cognitive Engineering\" is the primary source."},
drill:`<p>Take one flow you used today — bank app, Figma, Slack. Diagram all seven stages for <strong>one specific goal</strong>. Mark where each gulf is widest. One sentence per gulf on what the designer could have done.</p><p>This is the exact method you'll use for Studio A.</p>`},

{n:3,title:"Affordances, signifiers, constraints, mappings",
concept:`
<p>Four words used loosely that mean precise things. Getting them precise upgrades you from "designer" to "designer people listen to."</p>
<p><strong>Affordance</strong> — a <em>relationship</em> between an object's properties and an agent's capabilities. A chair affords sitting to an adult, not a toddler. Critically: <strong>affordances are not visual properties.</strong> A button doesn't "have" an affordance; the relationship between it and a mouse-wielding human affords clicking. Norman spent years correcting the industry's misuse of this word.</p>
<p><strong>Signifier</strong> — the <em>perceptible signal</em> showing where the action happens. This is what designers usually mean when they misuse "affordance." A shadow under a button. A "PUSH" plate. Underlined blue text.</p>
<p>The distinction is load-bearing: <strong>the affordance exists whether or not you can perceive it.</strong> A flat unadorned div can be clickable — it affords clicking — but with no signifier, nobody knows. Every flat-design disaster of the 2010s was a signifier problem, and the industry's inability to name it correctly is why it took a decade to fix.</p>
<p><strong>Constraint</strong> — a limitation reducing possible actions. Four kinds: <em>physical</em> (the plug fits one way), <em>cultural</em> (red means stop), <em>semantic</em> (the rider faces forward, so the windscreen goes in front), <em>logical</em> (one piece left, one hole left).</p>
<p>Constraints are the most underused tool in interface design. <strong>Junior designers add explanation; senior designers remove possibility.</strong> If a user can't do the wrong thing, you don't need to explain the right thing.</p>
<p><strong>Mapping</strong> — the relationship between controls and effects. Good mapping is spatial and natural: the stove knob arranged like its burner. Every time a user must remember which control does what, you have a mapping failure — and you've spent their working memory.</p>
<blockquote><p>Affordances determine what's <strong>possible</strong>. Signifiers communicate what's <strong>available</strong>. Constraints eliminate what's <strong>wrong</strong>. Mappings make relationships <strong>obvious</strong>.</p></blockquote>
<p>Four separate levers. Most designers only reach for signifiers — labels, icons, tooltips, onboarding. Reach for constraints and mappings first. They're structural, and structural fixes don't need explaining.</p>`,
source:{label:"The Design of Everyday Things — Ch. 1",url:"https://ocw.mit.edu/courses/6-831-user-interface-design-and-implementation-spring-2011/",note:"<em>The Psychopathology of Everyday Things</em> — the teapot, the doors, the light switches. Charming, and the intellectual foundation of the discipline."},
drill:`<p>Capture <strong>five</strong> interfaces (mix physical and digital). For each, label one affordance, one signifier, one constraint, one mapping.</p><p>Then find one where a <em>signifier</em> is doing work a <em>constraint</em> should be doing — and redesign that one thing.</p>`},

{n:4,title:"Conceptual models vs mental models — your real product",
concept:`
<p>The reframe that changes what you think you're making.</p>
<blockquote><p>You are not designing screens. <strong>You are designing a model in someone's head.</strong> The screens are the delivery mechanism.</p></blockquote>
<p>Three models are always in play:</p>
<ol>
<li><strong>The system model</strong> — how it actually works. Databases, sync, model weights. Too complex and too weird to expose.</li>
<li><strong>The conceptual model</strong> — the deliberately simplified story the <em>design</em> tells. <em>This is your actual output.</em></li>
<li><strong>The user's mental model</strong> — the story that ends up in their head.</li>
</ol>
<p>Your job: a conceptual model simpler than the system, accurate enough to predict from, easy to absorb.</p>
<h4>Worked examples</h4>
<p><strong>Files and folders</strong> are a conceptual model. The disk has no folders — it has blocks and an index. "Folders" is a lie: a load-bearing, forty-year, extraordinarily successful lie, because it lets people predict correctly. That's the only test a conceptual model has to pass.</p>
<p><strong>Gmail labels vs Apple Mail folders.</strong> Same storage, two models. Labels are more powerful and more accurate; folders match people's existing model from physical offices. Gmail spent years fighting the fact that its <em>better</em> model was the <em>harder</em> one. Accuracy is not the same as fit.</p>
<p><strong>Undo</strong> is a model claim: "the system has a history and you can move backwards." Break it once — one unmarked irreversible action — and the model shatters and the user becomes cautious. Cautious users explore less, and learn your product more slowly.</p>
<p>Mental models come from three places: <strong>the interface</strong>, <strong>prior products</strong>, and <strong>the words you use</strong>. That third is why naming is a structural decision, not a copywriting one. "Workspace" vs "project" vs "board" imports an entire set of expectations about permanence, ownership and nesting before anyone clicks.</p>
<div class="warn"><strong>Watch for model leakage.</strong> The system model bleeds through at the edges — usually in errors, loading, or sync conflicts. The user gets a coherent story for 95% of use, then hits "409: version conflict on resource" and it collapses. <strong>Error states are where conceptual models go to die.</strong></div>
<p>And for your industry: what model does a chat interface give someone about an LLM? Mostly <em>"it's a person who knows things."</em> That predicts wrongly about hallucination, context limits and statelessness — and almost every AI product's usability problem downstream is a consequence of that one inherited, incorrect model.</p>`,
source:{label:"CS6750 — Mental Models & Metaphor",url:"https://omscs6750.gatech.edu/spring-2022/required-reading-list/",note:"Week 6 of the syllabus: MacKenzie on mental models and metaphor, plus Norman's Chapter 5. Also read the conceptual-models section of DOET Ch. 1."},
drill:`<p>Pick a product you know deeply. Write (a) its conceptual model in <strong>three sentences a non-user would understand</strong>, (b) two things a user would predict correctly from it, (c) one place the system model <em>leaks through</em>.</p><p>Then do the same for a product you find confusing — the leak will be easier to find, and it will tell you what's wrong.</p>`},

{n:5,title:"Direct manipulation and why things feel good",
concept:`
<p>"It feels good" is a real property with real causes. Here they are.</p>
<p>Shneiderman named <em>direct manipulation</em> in 1983; Hutchins, Hollan and Norman explained the mechanism in 1985 in what is still the best thing written on the subject. Three properties:</p>
<ol>
<li><strong>Continuous representation</strong> of the objects of interest — always on screen, not hidden behind a command.</li>
<li><strong>Physical actions instead of complex syntax</strong> — you drag, not type <code>mv file /dest</code>.</li>
<li><strong>Rapid, incremental, reversible operations</strong> with immediately visible effects.</li>
</ol>
<p>Hutchins et al. added the crucial idea of <strong>directness as a felt property</strong> with two components:</p>
<p><strong>Distance</strong> — the gap between your intention and the actions the system requires. Every translation step you do in your head widens it.</p>
<p><strong>Engagement</strong> — the feeling of operating on the objects <em>themselves</em> rather than sending instructions to an intermediary.</p>
<p>Engagement is the subtle one, and it's where your motion background gives you an edge. A slider that updates live vs one that updates on release isn't an efficiency difference — it's an <em>engagement</em> difference. In the first, you are moving the value. In the second, you are asking a system to change it. Same information, completely different feel.</p>
<h4>Why this matters in 2026</h4>
<p>We're in a hard swing <em>away</em> from direct manipulation. Chat is the opposite of direct: describe an intention in words to an intermediary, wait, receive a result. Maximum distance, minimum engagement. That's why AI-generated design work often feels remote to work with even when the output is good.</p>
<p>The frontier — and this is genuinely where the interesting jobs are — is <strong>hybrid</strong>: language for expressing <em>intent</em> (which language is superb at), direct manipulation for <em>refinement</em> (which language is terrible at). Describe the layout; then drag the thing two pixels left.</p>
<div class="warn"><strong>A caution.</strong> Direct manipulation is poor at: operating on things you can't see, repetition across many objects, abstraction and conditionals, and precision. <strong>Direct manipulation for the concrete and visible; language for the abstract, absent, and repeated.</strong></div>`,
source:{label:"Hutchins, Hollan & Norman (1985) — Direct Manipulation Interfaces",url:"https://groups.csail.mit.edu/graphics/classes/6.831/readings.html",note:"On the MIT 6.831 readings list; findable via Google Scholar. Read at minimum the sections on distance and engagement."},
drill:`<p>Find <strong>three</strong> interactions: one maximally direct, one maximally indirect, one hybrid. For each, write what it costs and what it buys.</p><p>Then take one indirect interaction and sketch a direct version — and honestly name what the direct version makes <em>worse</em>.</p>`},

{n:6,studio:"A",title:"Studio A kickoff — choose your target and diagnose",
concept:`
<p>Time to make something. Read the Studio A brief in full before starting.</p>
<p>Today is <strong>flow capture and first-pass diagnosis</strong>. Three notes on doing it well:</p>
<p><strong>Capture before you judge.</strong> Go through the whole flow once, screenshotting every screen and state, doing nothing else. The instinct to start critiquing at screen two will make you miss the structure. You cannot diagnose a system you've only seen in fragments.</p>
<p><strong>Capture the states, not just the screens.</strong> The same screen with an empty list, a loading spinner, a validation error and a full list is four artifacts. This habit most separates product designers from UI designers — and it'll feel tedious today and invaluable in Week 10.</p>
<p><strong>Diagnose with this week's vocabulary only.</strong> No "this feels clunky." Every observation must use: gulf of execution/evaluation, one of the seven stages, affordance, signifier, constraint, mapping, conceptual model, directness. Constraining your vocabulary forces precision — and if you can't express a problem in these terms, you probably haven't understood it.</p>
<h4>Choosing your target</h4>
<p>Pick a <em>flow</em>, not an app — a sequence with a goal and an end state. At least 5 steps, at least one decision point, real data complexity. <strong>Not</strong> a famously-bad flow that's been torn down a thousand times. <strong>Not</strong> something you'd redesign because it's ugly.</p>`,
source:{label:"Stanford CS147 — assignment briefs",url:"https://hci.stanford.edu/courses/cs147/",note:"The public assignment briefs from past years are excellent self-directed exercises — particularly the needfinding and storyboard sequence."},
deliverable:"Deliverable A1 — Flow capture &amp; first-pass diagnosis",
drill:`<ol>
<li><strong>Choose your flow.</strong> One paragraph on why, and what you <em>think</em> is wrong. You'll check this prediction in Week 3.</li>
<li><strong>Capture</strong> every screen and state, sequenced and numbered, in FigJam or Figma.</li>
<li><strong>Annotate</strong> 10–15 observations using only this week's vocabulary. Tag each: <code>[GULF-EXEC]</code> <code>[GULF-EVAL]</code> <code>[SIGNIFIER]</code> <code>[CONSTRAINT]</code> <code>[MAPPING]</code> <code>[MODEL]</code> <code>[DIRECTNESS]</code>.</li>
<li><strong>Write the conceptual model</strong> the product is trying to give you, in three sentences. Note where it leaks.</li>
</ol>
<p><em>Time: capture ~25 min · annotation ~35 min · model ~15 min.</em></p>`}
]});
