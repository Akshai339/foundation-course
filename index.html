COURSE.push({w:2,phase:1,title:"Human Capabilities and the Laws",
thesis:"The human is a known machine with published specifications. Perception, memory, attention and motor control have measurable limits, and <b>most interface failures are attempts to exceed them.</b>",
days:[
{n:1,title:"Perception — what the eye does before you think",
concept:`
<p>You already have excellent visual instincts. This week converts them into <strong>stated rules you can defend in a meeting</strong> — the difference between "I think this should be bigger" and "this is the primary action and it's currently losing the pre-attentive competition to a decorative element."</p>
<p><strong>Pre-attentive processing</strong> is the set of visual judgments made in under ~250ms, before conscious attention arrives. Parallel, effortless, enormously fast. Only a few properties work this way:</p>
<div class="tablewrap"><table>
<tr><th>Channel</th><th>Strength</th><th>Notes</th></tr>
<tr><td>Colour (hue)</td><td>Very strong</td><td>Only ~5–7 distinguishable categories at a glance</td></tr>
<tr><td>Size / length</td><td>Very strong</td><td>Most accurate quantitative channel</td></tr>
<tr><td>Position</td><td>Very strong</td><td>Strongest of all for comparison</td></tr>
<tr><td>Motion / flicker</td><td>Overwhelming</td><td>Wins against everything. Extreme care.</td></tr>
<tr><td>Enclosure</td><td>Strong</td><td>A box around things groups them instantly</td></tr>
<tr><td>Shape</td><td>Weak</td><td>Slower, needs attention</td></tr>
</table></div>
<p>Anything encoded pre-attentively is found <em>without search</em>. Anything not is serially scanned. The difference is roughly an order of magnitude in time.</p>
<blockquote><p>The number of things competing pre-attentively on a screen is a <strong>budget</strong>, and it's small.</p></blockquote>
<p>If your primary CTA, notification badge, promo banner and brand accent are all saturated red, you've spent the whole budget on a four-way tie — and the user resolves it by ignoring all of them. That's the mechanism behind banner blindness and behind "nobody clicks our main button."</p>
<p><strong>Von Restorff</strong> is the flip side: the item that differs is remembered. One divergent element in a uniform field is unmissable. Two is a comparison. Five is noise. You already know one moving thing in a still frame owns the shot — same physics, static.</p>
<div class="warn"><strong>The takeaway:</strong> decide explicitly, per screen, what wins pre-attentively. Write it down. Then check nothing else competes. Most "cluttered" screens don't have too many elements — they have too many <em>emphasised</em> ones.</div>`,
source:{label:"MIT 6.831 — Lecture 4: Human Capabilities",url:"https://ocw.mit.edu/courses/6-831-user-interface-design-and-implementation-spring-2011/",note:"Also Jeff Johnson, <em>Designing with the Mind in Mind</em>, chapters 1–4."},
drill:`<p>Take three screens. Blur each heavily, then write down what you can still perceive — that's what's winning pre-attentively. Compare against what <em>should</em> win.</p><p>Then do it to your own most recent piece of UI work.</p>`},

{n:2,title:"Gestalt — grouping is a decision, not an accident",
concept:`
<p>A hundred years old, endlessly repeated, and almost universally applied at the wrong altitude. Designers use Gestalt to make things look tidy. Its actual power is <strong>structural</strong>: it determines what the user believes belongs to what — which <em>is</em> the interface's information architecture as experienced.</p>
<p>The ones that carry weight in product UI, in order of strength:</p>
<ol>
<li><strong>Proximity</strong> — near things are one thing. Strongest grouping force, and the one you most control. Whitespace is not decoration; it's a structural claim about relatedness.</li>
<li><strong>Common region</strong> — things inside a shared boundary are one thing. <em>Beats proximity</em> — an element inside a card belongs to that card even if physically closer to something outside it.</li>
<li><strong>Uniform connectedness</strong> — things connected by a line or shared background are one thing. Strongest of all when present.</li>
<li><strong>Similarity</strong> — things that look alike are the same <em>kind</em> of thing. How you signal "these are all actions" across a scattered layout.</li>
<li><strong>Prägnanz</strong> — people resolve complex arrangements into the simplest available reading. If your layout has a simpler <em>wrong</em> reading, that's what they'll get.</li>
</ol>
<blockquote><p>When a screen feels wrong, ask: <strong>what is this layout claiming belongs together, and is that claim true?</strong></p></blockquote>
<p>Nine times out of ten a confusing screen has a grouping that contradicts the actual data model — a label closer to the field below than above, a "cancel" nested inside the thing it cancels out of, filters proximate to results they don't filter.</p>
<p><strong>The most common real bug:</strong> in forms, label-to-field proximity. If the gap above a label equals the gap below it, the eye can't tell which field it belongs to, and users resolve it by trial and error. A two-minute fix that measurably reduces form errors — and invisible to anyone not taught to look for it.</p>
<div class="warn"><strong>Where your instincts may mislead you.</strong> In brand work, generous <em>uniform</em> whitespace reads as premium. In dense product UI, uniform whitespace <em>destroys grouping</em> — everything is equally far from everything. Product spacing must be rhythmic and unequal: tight within a group, loose between. Aim for at least 2× difference.</div>`,
source:{label:"Laws of UX — the Gestalt laws",url:"https://lawsofux.com/",note:"Read Proximity, Common Region, Similarity, Uniform Connectedness and Prägnanz. Two minutes each, with original sources."},
drill:`<p>Find a dense product screen — settings, dashboard, admin table. Draw boxes around what the <em>visual grouping</em> claims are groups. Separately, draw boxes around what <em>logically</em> belongs together.</p><p>Every mismatch is a real bug. Fix the worst one.</p>`},

{n:3,title:"Working memory, chunking and cognitive load",
concept:`
<p>Working memory is the scarcest resource in your design. It holds roughly <strong>4 ± 1 chunks</strong> for a few seconds. (Miller's famous "7 ± 2" was about a different kind of recall; for interface purposes, design for four.) It's destroyed by interruption and doesn't improve with expertise — only <em>chunking</em> does.</p>
<p><strong>A chunk is a unit meaningful to that person.</strong> <code>BBCITVNHS</code> is nine chunks to a non-Brit and three to a Brit. That's the whole mechanism of expertise: an expert doesn't have more memory, they have bigger chunks.</p>
<h4>Three consequences, by leverage</h4>
<p><strong>1. Every "remember this from a previous step" is a tax.</strong> The code on the last screen, the price from the comparison page, the setting from three steps ago. Each occupies a slot and each one leaks. The fix is nearly always: <em>put it on screen.</em> Recognition over recall.</p>
<p><strong>2. Interruption clears the buffer.</strong> A modal, a permission prompt, an unexpected page load — after any of them the user has lost the values they held and often the <em>intention</em> itself. This is why "are you sure?" dialogs are more harmful than they look: they cost a full memory reset to prevent an error undo would have handled free.</p>
<p><strong>3. Cognitive load has three kinds, and you can only remove one:</strong></p>
<div class="tablewrap"><table>
<tr><th>Type</th><th>What it is</th><th>Reducible?</th></tr>
<tr><td>Intrinsic</td><td>Inherent difficulty of the task</td><td>Only by changing the task</td></tr>
<tr><td>Extraneous</td><td>Load from <em>how it's presented</em></td><td><strong>Yes — this is your job</strong></td></tr>
<tr><td>Germane</td><td>Effort spent building understanding</td><td>No — and you don't want to; it's learning</td></tr>
</table></div>
<p>Almost all design improvement is removing <em>extraneous</em> load. Meanwhile the classic beginner mistake is stripping <em>germane</em> load — over-simplifying until the user never builds a model and stays permanently dependent on hand-holding.</p>
<div class="warn"><strong>Applied to your world:</strong> AI features are load-<em>shifters</em>. They reduce intrinsic load (the model does the hard task) while often increasing <em>evaluative</em> load (now you must judge whether it's right). If judging is harder than doing, the feature is a net negative — however impressive the generation. Ask this of every AI feature you ever design.</div>`,
source:{label:"Laws of UX — Cognitive Load, Miller's Law, Chunking",url:"https://lawsofux.com/",note:"Then Jeff Johnson, <em>Designing with the Mind in Mind</em>, the memory chapters."},
drill:`<p>Take a multi-step flow. At every step, list every piece of information the user must be <strong>holding in their head</strong> to proceed correctly. Count them. Any step over 3 is a redesign candidate.</p><p>Fix the worst one by putting the value on screen — and note how little <em>visual design</em> that fix required.</p>`},

{n:4,title:"Fitts's Law, Hick's Law and the real cost of a click",
concept:`
<p>Two predictive models. Both genuinely quantitative, both routinely quoted wrongly, and both give you arguments that survive contact with an engineer.</p>
<h4>Fitts's Law</h4>
<p>Time to acquire a target is a function of distance to it and size of it: <code>T = a + b · log₂(D/W + 1)</code></p>
<p>The practical content: <strong>size matters more than distance, and it's logarithmic.</strong> Doubling a small target helps a lot; doubling an already-large one barely helps.</p>
<ul>
<li><strong>Screen edges have infinite width.</strong> You cannot overshoot them. Why the Mac menu bar beats in-window menus, and why bottom-edge mobile nav beats a bar floating 12px above the edge.</li>
<li><strong>Corners are the fastest targets on any screen</strong> — infinite in two dimensions.</li>
<li><strong>The target is the hit area, not the visible one.</strong> A 14px icon with a 44px hit area is a 44px target. Conversely a big beautiful card where only the title is a link is a 20px target that <em>looks</em> like 300px — worse than looking small, because it invites a miss.</li>
</ul>
<h4>Hick's Law</h4>
<p>Decision time increases logarithmically with number of choices: <code>T = a + b · log₂(n + 1)</code></p>
<p>Also logarithmic — which means <strong>the popular use of it is wrong.</strong> It does <em>not</em> say "always reduce options." Going 10 → 5 saves much less than intuition suggests. And it only applies when options are <strong>unordered and equally likely</strong>. A sorted list, a categorised menu, a search field break the relationship entirely.</p>
<blockquote><p><strong>Structure beats subtraction.</strong> Organising twenty options into four groups of five beats cutting to ten.</p></blockquote>
<div class="warn"><strong>Where they collide:</strong> big targets take space, and space pushes other targets further away. Every enlargement is a Fitts trade against everything else. There's no free lunch — only an explicit decision about what the primary action is. Designers who skip that decision end up with screens where everything is medium-sized and nothing is fast.</div>`,
source:{label:"Laws of UX — Fitts's Law and Hick's Law",url:"https://lawsofux.com/",note:"Both with original citations. Then MIT 6.831 Lecture 4 for the formal treatment and the Model Human Processor."},
drill:`<p>Pick a screen you've designed or use daily. For each interactive element, estimate its <em>effective</em> target size (hit area) and its distance from the previous likely action. Rank them.</p><p>Then check: <strong>is that ranking the same as the importance ranking?</strong> Wherever it isn't, you have a Fitts bug. Fix the top one.</p>`},

{n:5,title:"Human error — slips, mistakes, and undo over confirm",
concept:`
<blockquote><p><strong>Most "human error" is design error.</strong> If a system reliably produces errors from competent, attentive people, the system is at fault.</p></blockquote>
<p>Not sentimentality — it's the only stance that produces improvement, because you can't redesign a human but you can redesign an interface.</p>
<p><strong>Slips</strong> — right intention, wrong execution. Autopilot failures. Clicking "Archive" because it's where "Reply" used to be. Slips happen <em>more</em> to experts, because expertise means automaticity, and automaticity means acting without checking.<br>
→ <strong>Fix with constraints, spacing, and reversibility.</strong> Never with warnings — the user isn't attending. This is a <em>layout</em> fix.</p>
<p><strong>Mistakes</strong> — correct execution, wrong intention. A model failure. Setting a recurring transfer thinking it was one-off.<br>
→ <strong>Fix with better feedback and clearer conceptual models.</strong> This is a <em>model</em> fix. Warnings can help here, but only if they say something specific about consequences.</p>
<p>Confusing these is why so much error handling fails. <strong>A confirmation dialog is a mistake-fix deployed against a slip.</strong> It doesn't work — the same autopilot that clicked "delete" clicks "yes." Everyone has experienced this and almost nobody names it correctly.</p>
<h4>The hierarchy of error handling</h4>
<ol>
<li><strong>Make it impossible</strong> — constraint</li>
<li><strong>Make it harmless</strong> — undo. Nearly always the right answer</li>
<li><strong>Make it obvious immediately</strong> — inline validation at entry, not on submit</li>
<li><strong>Make it recoverable</strong> — clear message, preserved input, obvious next step</li>
<li><strong>Warn beforehand</strong> — mostly ineffective for slips</li>
<li><strong>Blame the user</strong> — "Invalid input." Never</li>
</ol>
<p><strong>Undo over confirm</strong> is the highest-leverage principle in this week. A confirm interrupts every user every time to prevent a rare error. Undo interrupts nobody and fixes it when it happens. Gmail's "Undo Send" is the proof — it replaced a hated confirm pattern and is beloved. The cost is engineering, which is why designers must argue for it explicitly.</p>`,
source:{label:"The Design of Everyday Things — Ch. 5",url:"https://omscs6750.gatech.edu/spring-2022/required-reading-list/",note:"<em>Human Error? No, Bad Design.</em> One of the best chapters in design literature."},
drill:`<p>Find <strong>three</strong> confirmation dialogs in products you use. For each: classify the error as slip or mistake, then design the version that uses undo, a constraint, or better feedback instead.</p><p>Note honestly what each replacement costs to build — that's the conversation you'll actually have with engineering.</p>`},

{n:6,studio:"A",title:"Studio A — the cognitive audit",
concept:`
<p>Re-audit your Studio A flow with this week's instruments. Week 1 asked <em>"where are the gulfs?"</em> This week asks <strong>"what does this cost the human machine?"</strong></p>
<p>Screen by screen:</p>
<ul>
<li><strong>Pre-attentive</strong> — what wins the 250ms competition? Is it the right thing?</li>
<li><strong>Gestalt</strong> — what does the layout claim is grouped? Is the claim true?</li>
<li><strong>Memory</strong> — what must be held from a previous step? Count it.</li>
<li><strong>Fitts</strong> — are the highest-frequency targets the largest and closest?</li>
<li><strong>Hick</strong> — where is there an unordered choice set? Could structure beat subtraction?</li>
<li><strong>Error</strong> — where can a slip happen? A mistake? Is each handled with the right class of fix?</li>
</ul>`,
source:{label:"Laws of UX — full index",url:"https://lawsofux.com/",note:"Keep this open as your reference while auditing. Every finding should be taggable to a named law."},
deliverable:"Deliverable A2 — Cognitive audit",
drill:`<p>Produce the <strong>cognitive audit layer</strong> over your Week 1 capture. Per screen, a short annotation block:</p>
<pre>SCREEN 04 — Payment method selection
PRE-ATTENTIVE  Promo banner wins; primary CTA loses. Bug.
GESTALT        "Save card" checkbox proximate to wrong field group.
MEMORY         Holds: card type from step 2 (not shown here). Load: 1.
FITTS          Primary CTA 44px bottom-right: good. "Edit" links 16px: weak.
HICK           6 unordered payment types. Could group saved / new.
ERROR          Slip risk: "Remove" adjacent to "Set default". No undo.</pre>
<p>Then a <strong>one-page summary</strong>: the five highest-cost findings, ranked, each with the named law and a one-line proposed fix.</p>
<p><em>Time: audit ~60 min · summary ~25 min.</em></p>`}
]});

/* ---------------- WEEK 3 ---------------- */
COURSE.push({w:3,phase:1,title:"Interaction, State and Evaluation",
thesis:"An interface is a state machine a human is trying to steer. <b>Most usability failure is the human being unable to tell what state they're in, how they got there, or how to leave.</b>",
days:[
{n:1,title:"Nielsen's 10 heuristics, properly understood",
concept:`
<p>Everyone has seen this list. Almost nobody uses it well, because it gets taught as a checklist when it's actually a <strong>diagnostic vocabulary</strong>. The value isn't ticking boxes; it's that when something feels wrong you have ten specific hypotheses to test instead of vague unease.</p>
<ol>
<li><strong>Visibility of system status.</strong> The most violated and cheapest to fix. Loading, saving, syncing, progress. Norman's stage 5.</li>
<li><strong>Match between system and the real world.</strong> A conceptual model heuristic. "Archive" vs "Move to Cold Storage Tier." Your naming decisions live here.</li>
<li><strong>User control and freedom.</strong> A clearly marked emergency exit. Undo, redo, cancel, back. The right to change your mind.</li>
<li><strong>Consistency and standards.</strong> Two kinds — <em>internal</em> (within your product) and <em>external</em> (with platform and category convention). External consistency is Jakob's Law: users spend most of their time on <em>other</em> products.</li>
<li><strong>Error prevention.</strong> Better than good error messages is a design that prevents the problem.</li>
<li><strong>Recognition rather than recall.</strong> Yesterday's working-memory tax.</li>
<li><strong>Flexibility and efficiency of use.</strong> Accelerators — unseen by novices — that speed the expert. <em>The most neglected heuristic</em>, because designers optimise for the first run they see in demos and never the thousandth. If your users are daily, this outranks most of the others.</li>
<li><strong>Aesthetic and minimalist design.</strong> Note it says <em>relevance</em>, not sparseness. Removing needed density to look clean is a violation of this heuristic, not an application. Misreading it has caused enormous damage.</li>
<li><strong>Help users recognise, diagnose, and recover from errors.</strong> Plain language, precise problem, constructive solution. Three requirements; most errors meet zero.</li>
<li><strong>Help and documentation.</strong> Ideally unnecessary; realistically searchable, task-focused, concrete.</li>
</ol>
<blockquote><p>When something feels wrong, run the list and ask "is it this one?" You'll hit it in three or four. Then you have a <strong>named</strong> problem — which means a <em>class</em> of fix rather than a bespoke patch. That's the difference between fixing a screen and fixing a system.</p></blockquote>`,
source:{label:"Nielsen's 10 Usability Heuristics",url:"https://www.nngroup.com/articles/ten-usability-heuristics/",note:"The canonical statement with examples. Then, for contrast, <a href=\"https://asktog.com/atc/principles-of-interaction-design/\">Tognazzini's First Principles</a> — longer, more opinionated, more prescriptive."},
drill:`<p>Take a product you use daily. Find one <strong>clear violation of each</strong> of the ten.</p><p>If you can't find one for a given heuristic, that's a finding too — write down which ones it does well and hypothesise why (usually: it reflects what the team measures).</p>`},

{n:2,title:"Modes, state and visibility — the most common structural bug",
concept:`
<p><strong>A mode is a state in which the same input produces a different result.</strong> Caps Lock. "Edit mode" vs "view mode." Having a tool selected in Figma. Having text selected.</p>
<p>A <strong>mode error</strong> is doing the right thing in the wrong state. Not a rare edge case — among the most frequent and infuriating failures in software, and almost entirely a <em>visibility</em> problem. Larry Tesler fought modes hard enough that his licence plate read NO MODES.</p>
<p><strong>Why they're so dangerous:</strong> the user's action is <em>correct for their believed state</em>. So they don't perceive an error — they perceive the system misbehaving. That destroys trust far faster than ordinary failure, because it makes the system feel unpredictable rather than merely difficult.</p>
<h4>The three tolerable kinds</h4>
<ol>
<li><strong>Spring-loaded / quasi-modes</strong> — the mode persists only while you're physically holding something. Shift for uppercase. Space to pan in Figma. Nearly error-free, because your own body is the state indicator. <em>The single best trick in interaction design</em>, and underused outside professional tools.</li>
<li><strong>Modes with overwhelming visibility</strong> — impossible to miss. Full-screen colour change, persistent banner, changed cursor, border around the entire viewport.</li>
<li><strong>Modes the user explicitly and recently chose</strong> — and even then, only if #2 also applies.</li>
</ol>
<p>Everything else is a bug waiting for a user.</p>
<h4>Seeing state properly</h4>
<p>For any screen, enumerate its state dimensions. A single "inbox" is really:</p>
<pre>loading × (empty | has-items) × (filtered | unfiltered)
  × (selection: none | one | many) × (online | offline)
  × (permissions: read | write) × (error | ok)</pre>
<p>That's not one screen — it's dozens of meaningful combinations, of which maybe eight matter. <strong>Most designers design one.</strong> Then engineering invents the other seven, badly, at 6pm on a Friday, and everyone blames engineering — when the actual failure was that nobody designed the states.</p>
<div class="warn"><strong>In AI products</strong> there are states most designers never enumerate: <em>idle, prompted, thinking, streaming, complete, stopped-by-user, refused, errored, partially-wrong-but-completed.</em> That last one has no visual language in most products, which is why AI features so often feel unfinished at the edges.</div>`,
source:{label:"MIT 6.831 — Lecture 8: Design Principles",url:"https://ocw.mit.edu/courses/6-831-user-interface-design-and-implementation-spring-2011/",note:"Covers modes and visibility. Optionally Jef Raskin's <em>The Humane Interface</em> on modelessness — the most extreme and most interesting position on this."},
drill:`<p>Find <strong>three modes</strong> in software you use — at least one you didn't previously think of as a mode. How is each state signalled? How would you know you were in the wrong one? Design a better signal for the weakest.</p><p>Then pick any one screen and write out its full state dimensions.</p>`},

{n:3,title:"Feedback and the response-time budget",
concept:`
<p>Feedback converts a system's internal events into the user's understanding. Norman's stages 5 and 6 — and the cheapest high-value work in product design.</p>
<div class="tablewrap"><table>
<tr><th>Threshold</th><th>Experience</th><th>Design response</th></tr>
<tr><td>~100ms</td><td>Instantaneous; feels like <em>you</em> caused it</td><td>None needed — the result <em>is</em> the feedback</td></tr>
<tr><td>~1 second</td><td>Flow preserved, but delay is noticed</td><td>Show something immediate: state change, optimistic result</td></tr>
<tr><td>~10 seconds</td><td>Attention lost; user switches tasks</td><td>Progress <em>and</em> estimate; allow leaving and returning</td></tr>
</table></div>
<p>These thresholds are from Miller (1968) and have held up for fifty years.</p>
<h4>Four properties of good feedback</h4>
<ol>
<li><strong>Immediate.</strong> Feedback after the network round-trip is too late. Acknowledge the <em>input</em> instantly and the <em>result</em> when it arrives — two different events, and most products build only the second.</li>
<li><strong>Located.</strong> Feedback belongs where the action happened. A corner toast about something in the middle of the page is feedback the fovea never sees.</li>
<li><strong>Proportionate.</strong> Magnitude should match the event. A full-screen modal for a save is aggressive; a 200ms fade for "account deleted" is negligent. Getting this wrong systematically is what makes a product feel either nagging or careless.</li>
<li><strong>Informative about state, not just activity.</strong> "Loading…" says the system is busy. "Loading 240 of 1,200 records" says what's happening and how long. Costs nothing more; transforms the wait.</li>
</ol>
<div class="warn"><strong>The most common bug in modern products:</strong> optimistic UI without failure handling. You show the result instantly, the request fails silently, and now the user's mental model and the system state have diverged and neither of you knows. <strong>Optimistic UI is a promise. If you make it, you must design the retraction</strong> — and make it noticeable, because the user has already moved on.</div>
<p><strong>Your advantage:</strong> nearly all of this is temporal craft — what appears when, how long, with what easing, in what order. Most product designers have no time-based training and produce feedback that is technically present and perceptually useless. You have the instrument. Week 9 makes it the whole subject.</p>`,
source:{label:"Response Times: The 3 Important Limits",url:"https://www.nngroup.com/articles/response-times-3-important-limits/",note:"Short. Then browse <a href=\"https://m1.material.io/motion/duration-easing.html\">Material's duration &amp; easing guidance</a> with these thresholds in mind."},
drill:`<p>Instrument one flow: for each action, roughly time the gap between input and visible response. Classify each against the three thresholds.</p><p>Find the worst offender and design its feedback properly — immediate, located, proportionate, informative. <strong>Specify the durations.</strong></p>`},

{n:4,title:"Heuristic evaluation as a method",
concept:`
<p>Here you stop having opinions and start producing findings. Heuristic evaluation is a <strong>discount usability method</strong>: a small number of evaluators inspect an interface against principles, independently, then merge. Nielsen and Molich published it in 1990 and it remains the highest value-per-hour evaluation technique that exists.</p>
<p><strong>Why it works despite sounding unrigorous:</strong> individual evaluators find only ~30% of problems, but <em>different</em> evaluators find <em>different</em> problems. Aggregating three to five reaches roughly 70–80%. The power is in the aggregation.</p>
<h4>The protocol — follow it exactly</h4>
<ol>
<li><strong>Define the scope</strong> — specific flows, specific goals. Not "evaluate the app."</li>
<li><strong>Go through at least twice.</strong> First pass for flow and feel, second for element-level inspection. You cannot see detail and structure simultaneously.</li>
<li><strong>Evaluate independently.</strong> Alone? Evaluate on two different days. Discussing before recording contaminates findings — the loudest opinion wins and you lose the diversity that makes the method work.</li>
<li><strong>Record each problem separately</strong> — location, heuristic violated, why it's a problem, severity.</li>
<li><strong>Only then</strong> aggregate and discuss.</li>
</ol>
<h4>Severity — the part everyone skips</h4>
<p>Rate on <em>frequency</em> × <em>impact</em> × <em>persistence</em>:</p>
<div class="tablewrap"><table>
<tr><td>0</td><td>Not a usability problem</td></tr>
<tr><td>1</td><td>Cosmetic — fix if spare time</td></tr>
<tr><td>2</td><td>Minor — low priority</td></tr>
<tr><td>3</td><td>Major — high priority</td></tr>
<tr><td>4</td><td>Catastrophe — imperative before release</td></tr>
</table></div>
<div class="warn"><strong>The rule that saves your reputation:</strong> novice evaluations rate everything 3 or 4. If everything is major, nothing is, and your report gets ignored. Force a distribution — of twenty findings, expect ~two 4s, five 3s, the rest 1s and 2s. <strong>The willingness to call your own finding a "1" is what makes people believe your "4".</strong></div>
<p>And write findings as <em>problems</em>, not solutions:</p>
<p>✗ "Make the Save button blue."<br>
✓ "Save (screen 4) uses the same weight and colour as Cancel, so in the two-pass eye scan the primary action isn't identified. Users hesitate before committing. [H8; Severity 3]"</p>`,
source:{label:"How to Conduct a Heuristic Evaluation",url:"https://www.nngroup.com/articles/how-to-conduct-a-heuristic-evaluation/",note:"Plus the source paper: Nielsen &amp; Molich (1990), CHI '90. For finding-writing craft, Dumas, Molich &amp; Jeffries (2004), \"Describing usability problems.\""},
drill:`<p>Run a <strong>timed 45-minute heuristic evaluation</strong> on a small, contained interface — a settings page, a single form, one checkout step. Follow the protocol strictly, including two passes and severity ratings. Force a severity distribution.</p><p>This is a rehearsal for Day 6.</p>`},

{n:5,title:"Cognitive walkthrough — the four questions",
concept:`
<p>Heuristic evaluation asks <em>"is this well-built?"</em> Cognitive walkthrough asks a different and often more revealing question: <strong>"can a first-time user figure this out?"</strong> It's a <em>learnability</em> method — the right tool whenever discovery matters.</p>
<p>You walk through a specific task, step by step, as someone who has never used it. At <strong>each action</strong>, four questions:</p>
<ol>
<li><strong>Will the user try to achieve the right effect?</strong> Do they even know this sub-goal exists? <em>(Catches features nobody finds.)</em></li>
<li><strong>Will the user notice the correct action is available?</strong> <em>(Signifiers.)</em></li>
<li><strong>Will the user associate the correct action with the effect they want?</strong> <em>(Mapping.)</em></li>
<li><strong>If performed, will the user see progress being made?</strong> <em>(Feedback.)</em></li>
</ol>
<p>For each "no," <strong>write a failure story</strong> — a plausible narrative of what the user does instead. The story is the deliverable, not the "no." A no is a score; a story is a bug report someone can act on.</p>
<blockquote><p>A perfectly-designed feature that nobody knows exists passes all ten heuristics and fails question 1. In products where the biggest problem is "nobody uses the thing we built," this is nearly always the diagnosis — and it's found here.</p></blockquote>
<p><strong>The hard part, honestly:</strong> you must genuinely simulate not-knowing, and you <em>do</em> know. Two things help. Be specific about who the user is and what they've seen before — vague "a user" defaults to you. And when you answer "yes, obviously," ask <em>why</em> obviously: is it because the interface says so, or because you already know? If the second, it's a no.</p>
<div class="warn">This is the method with the largest gap between how useful it is and how it feels to run. It's slow and pedantic. It is also the method that most reliably finds the problems that kill adoption. Do it anyway.</div>`,
source:{label:"Cognitive Walkthroughs",url:"https://www.nngroup.com/articles/cognitive-walkthrough-workshop/",note:"A lighter entry point. The primary source is Polson, Lewis, Rieman &amp; Wharton (1992), listed in Week 11 of the <a href=\"https://omscs6750.gatech.edu/spring-2022/required-reading-list/\">CS6750 syllabus</a>."},
drill:`<p>Pick a feature in a product you know well but that a newcomer would have to <em>discover</em> — not a login, something optional. Walk through with the four questions, writing a failure story at every "no."</p><p>Then, hardest part: <strong>do the same for something you designed.</strong> Notice how much you're assuming.</p>`},

{n:6,studio:"A",title:"Studio A — the full evaluation writeup",
concept:`
<p>Today you produce the thing an actual team would read. Write it as if handing it to a PM who has fifteen minutes.</p>
<h4>Structure (keep this — it's reusable)</h4>
<ol>
<li><strong>Scope &amp; method</strong> — half a page. What flow, what goal, what methods, what you did <em>not</em> cover. Naming your gaps is what makes the rest credible.</li>
<li><strong>Summary of findings</strong> — severity-sorted table. The only part most people read, so it must stand alone.</li>
<li><strong>Detailed findings</strong> — screen reference, problem, heuristic violated, user consequence, severity, suggested <em>direction</em> (not a full solution).</li>
<li><strong>What's working</strong> — 3–5 things done well and why. Not politeness: it stops you redesigning something load-bearing, and it makes your criticism credible.</li>
<li><strong>The three that matter</strong> — which three you'd fix, in what order, and what you're consciously <em>not</em> fixing.</li>
</ol>
<div class="warn"><strong>Don't skip this:</strong> go back to the paragraph you wrote in Week 1 Day 6 predicting what was wrong. Compare it to what you actually found. Write a paragraph on the gap. <strong>That comparison is the most valuable artifact of the entire first phase</strong> — a direct measurement of what your intuition was missing, and it tells you what to distrust in yourself for the rest of your career.</div>`,
source:{label:"Describing usability problems (Dumas, Molich & Jeffries)",url:"https://www.nngroup.com/articles/how-to-conduct-a-heuristic-evaluation/",note:"On writing findings people act on. The NN/g method page covers report structure; the 2004 paper covers the language."},
deliverable:"Deliverable A3 — Full evaluation report",
drill:`<p>Write the full report. <strong>Target: 1,200–1,800 words plus annotated screens.</strong> Aim for 15–25 findings with a forced severity distribution.</p>
<p>Then the Week 1 prediction comparison — one honest paragraph.</p>
<p><em>Time: findings ~40 min · writing ~40 min · prediction comparison ~15 min.</em></p>
<p>Ask Claude to review it: <code>/product-design-course critique A3</code> — it'll check specifically whether your findings are structural or cosmetic.</p>`}
]});

/* ---------------- WEEK 4 ---------------- */
COURSE.push({w:4,phase:2,title:"Problem Framing and Product Sense",
thesis:"The highest-leverage work happens before any screen exists. A well-framed problem makes the design obvious; a badly-framed one makes brilliant execution worthless. <b>This is the week you stop receiving problems and start defining them.</b>",
days:[
{n:1,title:"Problem, symptom, solution — telling them apart",
concept:`
<p>Almost every design request you will ever receive is <strong>a solution in disguise.</strong> "Add a dashboard." "Make onboarding shorter." "Users want dark mode." "We need an AI assistant."</p>
<p>Each is someone's proposed <em>answer</em> to a problem they haven't articulated. Your first job, every time, is to reverse-engineer the question.</p>
<div class="tablewrap"><table>
<tr><th></th><th>What it is</th><th>How it sounds</th><th>What to do</th></tr>
<tr><td>Solution</td><td>A proposed implementation</td><td>"Add a filter dropdown"</td><td>Ask what it would fix</td></tr>
<tr><td>Symptom</td><td>An observed effect</td><td>"Tickets about finding old orders up 40%"</td><td>Ask why it's happening</td></tr>
<tr><td>Problem</td><td>The underlying cause</td><td>"Users can't recall order dates, and date is the only retrieval key we provide"</td><td>Design against this</td></tr>
</table></div>
<p>Notice the third already contains most of the design. <strong>That's the tell for a well-framed problem: once stated properly, the solution space is small and obvious.</strong> If you're staring at a framing and feeling like anything could solve it, it isn't framed yet.</p>
<h4>The technique: laddering</h4>
<p>Ask "what would that fix?" repeatedly.</p>
<blockquote><p>"We need a dashboard." → <em>Managers don't know how their team is doing.</em> → <em>They'd have to check five pages.</em> → <em>Mostly before Monday standup, and when something's gone wrong.</em> → <em>Right now they ask people on Slack.</em></p></blockquote>
<p>You've moved from "build a dashboard" to <em>"managers need a periodic and an exception-triggered read on team state, and currently pay for it in social cost by interrupting people."</em> That framing suggests things a dashboard doesn't — a Monday digest, an anomaly alert, a Slack integration. The dashboard might still be right, but now it's a <em>choice</em>, not an inheritance.</p>
<div class="warn"><strong>Why this matters more than five years ago:</strong> when execution was expensive, framing errors were caught by cost. Now you can generate ten polished variants of the wrong thing in an afternoon. The economic brake on bad framing is gone. <strong>Framing is now the only remaining brake, and it lives with you.</strong></div>
<p><strong>The political reality:</strong> laddering can read as obstruction. Never refuse the request — <em>widen</em> it. "Yes — and before I design it, let me make sure I understand what it's fixing, because there might be a cheaper way." Nobody objects to cheaper.</p>`,
source:{label:"Shape Up — Ch. 2: Principles of Shaping",url:"https://basecamp.com/shapeup",note:"Read the section on setting boundaries and finding the right level of abstraction. Free online."},
drill:`<p>Take <strong>three</strong> real design requests you've received. For each: write it as stated, ladder it down at least three "what would that fix?" levels, write the reframed problem.</p><p>Then note whether the original request would still be the right solution. At least one won't be.</p>`},

{n:2,title:"Jobs to be Done, and its honest limits",
concept:`
<p>JTBD's core claim: <strong>people don't buy products, they hire them to make progress in a particular circumstance.</strong></p>
<p>Christensen's milkshakes: a chain found a large share of milkshakes were bought before 9am by lone commuters, hiring the shake for a job with nothing to do with dessert — <em>make my boring commute less boring, one-handed, and keep me full until lunch.</em> The competitors weren't other milkshakes. They were bagels, bananas, and boredom.</p>
<blockquote><p>When ____ [situation], I want to ____ [motivation], so I can ____ [expected outcome].</p></blockquote>
<p>The <strong>situation</strong> clause does the work, and it's the part most people drop. "I want to share files easily" is not a job. <em>"When I've just finished a shoot and the client is waiting, I want to get 40GB to them without either of us installing anything, so I can invoice today"</em> — that's a job, and it immediately rules out half the design space.</p>
<h4>Why it's genuinely useful for you</h4>
<ul>
<li>It kills demographic thinking. Jobs are situational, not personal.</li>
<li>It reveals <strong>real competition</strong> — usually a spreadsheet, a WhatsApp message, or nothing.</li>
<li>It surfaces the <strong>forces of progress</strong>: push, pull, habit, anxiety. Adoption failures are almost always habit and anxiety, not insufficient pull — which is why adding features rarely fixes them. Your GTM background should find this familiar; it's a switching-cost analysis.</li>
</ul>
<h4>The honest limits</h4>
<ol>
<li><strong>It's a lens, not a method.</strong> No reliable procedure takes you from interviews to correct job statements. Two competent people produce different jobs from the same transcripts.</li>
<li><strong>The abstraction level is arbitrary.</strong> "Get files to a client" / "look professional" / "get paid faster" are all defensible for the same behaviour. Judgment, not method.</li>
<li><strong>It underweights the social and emotional.</strong> In practice teams reduce jobs to functional tasks, then wonder why the optimised product feels lifeless.</li>
<li><strong>It's retrospective.</strong> Explains adoption beautifully after the fact; much weaker as a generative tool.</li>
</ol>
<p><strong>Use it for:</strong> understanding why people adopted or didn't, finding non-obvious competition, keeping the situation in view. <strong>Not for:</strong> a substitute for research, or as a magic phrase in a room.</p>`,
source:{label:"Know Your Customers' Jobs to Be Done (HBR)",url:"https://hbr.org/2016/09/know-your-customers-jobs-to-be-done",note:"Faster and free. The full version is Christensen et al., <em>Competing Against Luck</em>. Bob Moesta's interviewing work is the practical companion."},
drill:`<p>Write <strong>three job statements</strong> in full format for a product you know deeply — one functional, one emotional, one social, all for the <em>same</em> product.</p><p>Then name what each competes with. If any competitor is "a spreadsheet," "a WhatsApp group," or "doing nothing," you've probably got it right.</p>`},

{n:3,title:"Point of View statements and How Might We",
concept:`
<p>The two artifacts that convert research into design direction. Used badly almost everywhere — used well, extremely sharp.</p>
<h4>The POV statement</h4>
<blockquote><p><strong>[User]</strong> needs <strong>[need]</strong> because <strong>[surprising insight]</strong>.</p></blockquote>
<p>Three rules that separate a POV from a platitude:</p>
<ol>
<li><strong>The need is a verb, not a noun.</strong> "Needs a faster upload" is a solution. "Needs to <em>reassure the client that the files arrived</em>" is a need. Nouns smuggle in solutions; verbs stay open.</li>
<li><strong>The insight must be surprising.</strong> If the "because" is something everyone already believed, you have a summary, not a POV.</li>
<li><strong>It must be falsifiable.</strong> You should be able to say what evidence would prove it wrong.</li>
</ol>
<p>✗ "Freelance photographers need an easier way to share files because current tools are complicated."</p>
<p>✓ "Freelance photographers need to <em>prove</em> delivery happened, because the real anxiety isn't the transfer — it's the two days of silence afterwards where they can't tell if the client is unhappy or just hasn't looked."</p>
<p>The second immediately generates designs the first never would: read receipts, view analytics, a nudge, a delivery page that feels like a handover. <strong>A good POV makes the design cheap.</strong></p>
<h4>How Might We</h4>
<p><code>How might we [do something] so that [outcome]?</code> The whole skill is <strong>altitude</strong>.</p>
<ul>
<li>✗ Too narrow: "How might we add read receipts to the download page?"</li>
<li>✗ Too broad: "How might we improve client communication?"</li>
<li>✓ Right: "How might we make the moment of delivery feel like a completed handover rather than a sent link?"</li>
</ul>
<p><strong>The check:</strong> a good HMW has at least five genuinely different answers, and you should not already know which is best. One answer = too narrow. Fifty unrelated ones = too broad.</p>
<p>Generate several from one POV at different altitudes — amplify the good, remove the bad, question the assumption. Then choose.</p>`,
source:{label:"Stanford CS147 — needfinding → POV assignments",url:"https://hci.stanford.edu/courses/cs147/",note:"The public assignment briefs walk this exact sequence. Also the d.school Design Thinking Bootleg (free PDF)."},
drill:`<p>From your Studio A findings, write <strong>one POV statement</strong> about the users of that flow. Force the "because" to be something your evaluation actually revealed rather than something you assumed.</p><p>Then generate <strong>five HMWs</strong> at different altitudes, and mark which one you'd design against, with a sentence on why.</p>`},

{n:4,title:"Appetite over estimates — Shape Up's core move",
concept:`
<p>The most immediately practical idea in the week, and the one most likely to change how you operate next Monday.</p>
<p><strong>The standard process:</strong> define the solution, estimate how long, negotiate. This fails predictably — estimates are unreliable, scope expands to fill them, and the conversation happens <em>after</em> the solution is chosen, when it's too late to trade.</p>
<blockquote><p>Not "how long will this take?"<br>But <strong>"how much time are we willing to spend?"</strong></p></blockquote>
<p>Appetite is a <em>constraint you design inside</em>, exactly like a canvas size. "This is a two-week problem" is a statement about the problem's value, made before any solution exists. Then the design work becomes: <em>what's the best thing we can do within this?</em></p>
<h4>Why this is transformative for a designer</h4>
<ol>
<li><strong>It makes scope a design material.</strong> You stop presenting one solution and asking for time. You present "here's the two-week version and the six-week version, and here's what the extra four weeks buys." That's a conversation a business person can have with you — and it makes you a partner rather than a supplicant.</li>
<li><strong>It kills the estimate trap.</strong> You'll always be wrong about how long design takes. You can be reliably right about what fits in a fixed time.</li>
<li><strong>It gives you a principled way to cut.</strong> With a fixed appetite, cutting isn't failure — it's the mechanism.</li>
</ol>
<h4>Three concepts worth stealing</h4>
<p><strong>Shaping</strong> — work at the right abstraction: concrete enough that the team knows what to build, abstract enough that they have room to solve problems. The artifact is a <em>pitch</em>: problem, appetite, rough solution, rabbit holes, explicit no-gos.</p>
<p><strong>Rabbit holes</strong> — the parts that could silently consume all the time. Identifying and <em>pre-solving</em> them is the highest-value part of shaping.</p>
<p><strong>The circuit breaker</strong> — if it doesn't ship in the cycle, no extension; it goes back to be re-shaped. Brutal, and the only thing that makes appetites real.</p>
<div class="warn"><strong>The fat marker sketch is the bit most relevant to you.</strong> Shape Up draws solutions at a fidelity so low they <em>can't</em> be over-specified. With strong visual chops this is uncomfortable — you can make it beautiful, so you do, and then the beautiful thing becomes the spec and engineering's judgment is squeezed out. <strong>Deliberately under-rendering early work is a professional skill.</strong> Practice it.</div>`,
source:{label:"Shape Up — Chapters 3, 4 and 5",url:"https://basecamp.com/shapeup",note:"Set Boundaries · Find the Elements · Risks and Rabbit Holes. About 45 minutes. Free online."},
drill:`<p>Take the HMW you selected yesterday. Write <strong>two pitches</strong> — a two-week appetite and a six-week appetite. Each: problem, appetite, fat-marker sketch (use an actual thick marker or a 20px brush), rabbit holes, no-gos.</p><p>Then one paragraph on what the extra four weeks buys and whether it's worth it.</p>`},

{n:5,title:"Product sense — building the intuition deliberately",
concept:`
<p>"Product sense" is what people call it when a designer consistently makes good calls without needing data for every decision. It gets talked about as innate taste. It isn't. It's a <strong>trained pattern library plus a habit of prediction and correction.</strong></p>
<p>Julie Zhuo's definition: having good instincts about what makes a product useful and well-loved, and the ability to design toward that outcome.</p>
<p><strong>The mechanism:</strong> product sense is a large, indexed store of <em>decision → outcome</em> pairs. Experts have seen thousands. You have hundreds, mostly from marketing. The way to acquire more, faster than by shipping, is to <strong>predict outcomes and then check.</strong></p>
<h4>The weekly protocol — ~40 minutes</h4>
<ol>
<li><strong>Use one product you've never used.</strong> Not skim — complete a real task.</li>
<li><strong>Reverse-engineer three decisions.</strong> Not "was this good" — <em>what goal makes this choice correct?</em> Assume competence; find the goal that makes the decision rational.</li>
<li><strong>Find the tradeoff.</strong> Every decision cost something. If you can't name it, you haven't understood the decision.</li>
<li><strong>Predict.</strong> Write down: "I think this will/won't work because ___." Date it.</li>
<li><strong>Check back monthly.</strong> The correction loop is where the sense forms — steps 1–4 without step 5 is just opinions with extra steps.</li>
</ol>
<p><strong>Compare products in pairs.</strong> Single-product analysis tells you what a team did; paired analysis tells you what was <em>optional</em>. Notion vs Linear. Cash App vs Venmo — same function, wildly different opinions about whether payment is social. Every difference between two competent products is a <em>decision</em>.</p>
<div class="warn"><strong>Your specific advantage.</strong> You've run GTM and performance marketing, so you have intuitions most designers lack — about acquisition cost, activation, how positioning constrains product, and which features are <em>messaging</em> rather than utility. Most designers can't tell a user-value feature from a sales-narrative feature, so they argue against the second and lose. You can name it, which means you can design <em>for</em> it honestly. Say this out loud in interviews.</div>
<p><strong>Your specific risk:</strong> marketing trains you to find the compelling story. Product sense requires being able to say "this story is compelling and the underlying thing doesn't work." Watch for the moment you're persuaded by a narrative rather than a mechanism.</p>`,
source:{label:"How to develop product sense — Jules Walter",url:"https://www.lennysnewsletter.com/p/product-sense",note:"The most concrete published method. Then <a href=\"https://medium.com/the-year-of-the-looking-glass/what-designers-can-learn-from-pms-3aa285f511bc\">Julie Zhuo — What Designers Can Learn from PMs</a>."},
drill:`<p>Start the practice today, properly. Pick one product you've never used, complete a real task, write the four-step analysis plus a dated prediction.</p><p>Create a note called <strong>Product Sense Log</strong> in your vault. Add one entry every week for the rest of the course — that's eight more, and it's the single habit here most likely to still be paying you in five years.</p>`},

{n:6,studio:"A",title:"Studio A close, Studio B kickoff",
concept:`
<p>Two things today. Close the loop on the teardown, and open the ambiguity.</p>
<p><strong>Closing Studio A.</strong> Your evaluation said what's wrong. The rebuild brief says what you'd <em>do about it</em>, under an appetite. This is the artifact that shows you can prioritise — which is what the studio was actually testing.</p>
<div class="warn">The brief is one page. <strong>Not screens.</strong> A one-page brief with no visuals is deliberately harder for you than a set of beautiful mockups. That's the point.</div>
<p><strong>Opening Studio B.</strong> The constraint that should drive your problem choice is: <strong>can you reach three people who have this problem, this week?</strong> Everything else is secondary. A perfect problem you can't research is worse than a mediocre problem you can.</p>
<p>Do not pick a problem where you can already picture the screens. If you can, you'll spend four weeks confirming what you already thought.</p>`,
source:{label:"Shape Up — writing the pitch",url:"https://basecamp.com/shapeup",note:"The pitch format is the closest thing to a template for the rebuild brief."},
deliverable:"Deliverables A4 (rebuild brief) + B0 (problem selection)",
drill:`<p><strong>A4 — Rebuild brief.</strong> One page, no visuals:</p>
<ul>
<li>The three problems worth fixing, in order, each with severity and principle</li>
<li>The appetite you're assuming, and what fits inside it</li>
<li>What you're explicitly <strong>not</strong> fixing, and why</li>
<li>What your changes make <strong>worse</strong> — at least two things, honestly</li>
<li>One fat-marker sketch, deliberately crude, of the most important change</li>
</ul>
<p><strong>B0 — Studio B problem selection.</strong> Half a page:</p>
<ul>
<li>The problem, stated as a problem not a solution</li>
<li>The three people you'll interview, by name, and how you'll reach them</li>
<li>Your current hypothesis about what they need — <strong>written down and dated</strong>, so Week 5 can prove you wrong</li>
<li>What would make you abandon this problem</li>
</ul>
<p><em>Time: A4 ~50 min · B0 ~35 min. Send the outreach messages today.</em></p>`}
]});
