COURSE.push({w:10,phase:4,title:"Accessibility and the Unhappy Path",
thesis:"The difference between a design that demos well and a design that ships is entirely in the parts nobody screenshots — <b>the error, the empty, the offline, the keyboard, the screen reader, the null field.</b>",
days:[
{n:1,title:"Accessibility as a design constraint, not a compliance task",
concept:`
<blockquote><p>Accessibility is a set of <strong>design constraints</strong>, like performance or screen size, that make the product better for everyone when handled early and worse for everyone when handled late.</p></blockquote>
<p><strong>Why "for everyone" is literal, not rhetorical.</strong> Every accommodation has large temporary and situational populations:</p>
<div class="tablewrap"><table>
<tr><th>Permanent</th><th>Temporary</th><th>Situational</th></tr>
<tr><td>Blind</td><td>Eye surgery recovery</td><td>Bright sunlight on a phone</td></tr>
<tr><td>Deaf</td><td>Ear infection</td><td>Loud train, watching without sound</td></tr>
<tr><td>One arm</td><td>Broken arm</td><td>Carrying a coffee, holding a baby</td></tr>
<tr><td>Motor tremor</td><td>Medication side effect</td><td>On a bus, cold hands</td></tr>
<tr><td>Cognitive disability</td><td>Concussion</td><td>Exhausted, stressed, distracted</td></tr>
</table></div>
<p>The situational column is <em>everyone, frequently</em>. Captions were built for deaf users and are now used by a large majority. Curb cuts were built for wheelchairs and are used by anyone with a suitcase or a pram. <strong>This is the argument that wins in a meeting</strong>, and it happens to be true.</p>
<p><strong>POUR</strong> — the structure of WCAG: <em>Perceivable</em> (contrast, text alternatives, not-colour-alone) · <em>Operable</em> (keyboard, target size, no seizure triggers) · <em>Understandable</em> (clear language, predictable behaviour, helpful errors) · <em>Robust</em> (semantics, assistive technology).</p>
<h4>What's genuinely the designer's job</h4>
<ol>
<li>Contrast and non-colour encoding — entirely yours, decided at design time</li>
<li>Focus order and focus states — yours, and almost always missing from design files</li>
<li>Target sizes</li>
<li>Content and error language</li>
<li>Heading structure and semantics — yours to <em>specify</em>. If you don't, it will be wrong.</li>
<li>Alternative text intent — depends on the image's <em>purpose in context</em>, which only you know</li>
<li>Reduced-motion variants</li>
</ol>
<div class="warn"><strong>A specific note for you.</strong> Your visual training optimises for aesthetic subtlety — low-contrast secondary text, thin weights, delicate greys. Nearly all of it fails WCAG. That tension is real and isn't resolved by ignoring it: it's resolved by finding the design that is <em>both</em>, which is a more interesting constraint problem than designing without it. <strong>The best accessible interfaces aren't visually compromised; they're visually disciplined.</strong></div>`,
source:{label:"WCAG 2.2 at a Glance",url:"https://www.w3.org/WAI/standards-guidelines/wcag/glance/",note:"For the structure, then <a href=\"https://www.w3.org/WAI/fundamentals/\">W3C Accessibility Fundamentals</a>. Microsoft's Inclusive Design toolkit is the source of the permanent/temporary/situational framing."},
drill:`<p>Take your Studio B screens. Run a contrast check on every text and UI element (Stark, or Figma's built-in checks). Count the failures.</p><p>Then fix them <strong>without</strong> abandoning your visual intent — find the version that's both. Note which forced a genuine compromise and which were just laziness.</p>`},

{n:2,title:"WCAG in practice — contrast, focus, target size, semantics",
concept:`
<p>The specific, checkable things. Learn these numbers; they come up constantly.</p>
<div class="tablewrap"><table>
<tr><th>Element</th><th>Minimum ratio (AA)</th></tr>
<tr><td>Body text</td><td><strong>4.5:1</strong></td></tr>
<tr><td>Large text (≥18pt, or ≥14pt bold)</td><td><strong>3:1</strong></td></tr>
<tr><td>UI components &amp; graphical objects (icons, borders, focus rings, chart elements)</td><td><strong>3:1</strong></td></tr>
</table></div>
<p>That third row is most often missed: <strong>a button's border, an input's outline, a meaningful icon, and a chart's series colours all need 3:1.</strong> A beautiful 1px hairline at 1.8:1 is a failure, and it's everywhere.</p>
<h4>Focus indicators</h4>
<ul>
<li><strong>Never <code>outline: none</code> without a replacement.</strong> The single most common accessibility crime on the web.</li>
<li>Must be visible against <em>every</em> background it can appear on — including dark mode and coloured surfaces</li>
<li><strong>Design focus states explicitly in your component library.</strong> If they're not in the Figma file, they'll be browser-default or absent.</li>
<li>Focus and hover are <em>different states</em>. Hover is "you could click this"; focus is "this is where keyboard input goes."</li>
</ul>
<p><strong>Target size.</strong> WCAG 2.2 sets 24×24 CSS px minimum with exceptions. Platform guidance is more generous and more useful: <strong>44×44pt (iOS) / 48×48dp (Android)</strong>. Design to the platform numbers. The target is the <em>hit area</em>, not the visual.</p>
<p><strong>Text and zoom.</strong> Must reflow at 200% without horizontal scrolling. Never disable pinch-zoom. Avoid text in images.</p>
<h4>Semantics you must specify</h4>
<ul>
<li><strong>Heading hierarchy</strong> — one h1, properly nested, no level-skipping. Headings are how screen reader users <em>navigate</em>; a page of visually-styled divs is unnavigable.</li>
<li><strong>Landmark regions</strong> — nav, main, header, footer, aside</li>
<li><strong>Labels on every input.</strong> A placeholder is not a label — it disappears on focus, fails contrast, and isn't read reliably. Be firm about this.</li>
<li><strong>Buttons vs links.</strong> Buttons <em>do</em> things, links <em>go</em> places. Getting it wrong breaks keyboard expectations and screen reader announcements.</li>
<li><strong>Error association</strong> — programmatically tied to its field, not just visually near it.</li>
</ul>`,
source:{label:"WCAG 2.2 quick reference",url:"https://www.w3.org/WAI/WCAG22/quickref/",note:"Filter to Level AA. Dense, but it's the actual standard. Then <a href=\"https://inclusive-components.design/\">Inclusive Components</a> for how these constraints shape real component design."},
drill:`<p>Take three components from your Studio B system. For each add: a designed focus state meeting 3:1 · verified target sizes · non-colour encoding for any status · specified semantics (element type, label association, error association).</p><p>Document these in the component spec — <strong>they are part of the API.</strong></p>`},

{n:3,title:"Keyboard, screen readers and the invisible interface",
concept:`
<p>There's a second interface to everything you design, and you almost certainly haven't experienced it.</p>
<h4>Keyboard operability — what you design</h4>
<ul>
<li><strong>Focus order</strong> follows visual/logical reading order. Breaks when DOM order diverges from visual order (very common with grid and absolute positioning) — which is why <em>you</em> must specify intended order.</li>
<li><strong>Focus management on state change</strong> — the subtle, important one. Modal opens: focus moves <em>into</em> it, is <em>trapped</em>, returns to the trigger on close. Content loads: focus goes somewhere sensible. Item deleted: focus not orphaned. <strong>Nobody designs this, and it's the difference between a keyboard-usable product and an unusable one.</strong></li>
<li><strong>Skip links</strong> — so keyboard users don't tab through 40 nav items on every page</li>
<li><strong>Escape closes things.</strong> Universally expected. Free. Frequently missing.</li>
<li><strong>No keyboard traps</strong> — you must be able to tab <em>out</em> of everything</li>
</ul>
<h4>Screen readers — what a designer needs to know</h4>
<ul>
<li>The experience is <strong>linear and by structure</strong> — users jump by heading, landmark, link, form control. Visual layout is invisible; <em>structure</em> is everything, which is why heading hierarchy is a design decision.</li>
<li><strong>Everything meaningful must be announced.</strong> An icon-only button with no accessible name announces as "button." A status change with no live region is silent.</li>
<li><strong>Order of announcement matters.</strong> A label after its input is announced after it — useless.</li>
<li><strong>Visual grouping is not announced</strong> unless the grouping is semantic.</li>
</ul>
<h4>Alt text — the rule is purpose, not description</h4>
<ul>
<li><strong>Informative</strong> → describe the information, concisely</li>
<li><strong>Decorative</strong> → empty <code>alt=""</code>, so it's skipped. Marking decorative images as decorative is as important as describing informative ones.</li>
<li><strong>Functional</strong> (an icon that's a button) → describe the <em>action</em>: "Delete," not "trash can icon"</li>
<li><strong>Complex</strong> (a chart) → short alt plus a longer description or a data table nearby</li>
</ul>
<div class="warn"><strong>The exercise that actually changes people:</strong> turn on VoiceOver (Cmd+F5 on Mac) or NVDA (free, Windows) and try to use a product you designed. Fifteen minutes teaches more than any amount of reading. It will be frustrating and slow — <strong>and the frustration is the information.</strong> That's the product you shipped.</div>`,
source:{label:"WebAIM — screen reader testing",url:"https://webaim.org/articles/screenreader_testing/",note:"Plus their keyboard accessibility material. Then actually turn one on."},
drill:`<p><strong>Two parts, both required.</strong></p><ol><li>Unplug your mouse. Use a product you designed, keyboard only, 15 minutes. Note every place you get stuck, lose focus, or can't tell where you are.</li><li>Turn on a screen reader. Try one flow, 15 minutes. Note what's silent, announced wrongly, or out of order.</li></ol><p>Then specify focus order and focus management for your Studio B modal or overlay.</p>`},

{n:4,title:"Empty, loading, error, partial, offline — the five states you forget",
concept:`
<h4>Empty states — the highest-leverage screen in your product</h4>
<div class="tablewrap"><table>
<tr><th>Kind</th><th>The situation</th><th>What the screen must do</th></tr>
<tr><td>First-run</td><td>Has nothing, doesn't know how it works</td><td><strong>Teach the conceptual model</strong> and offer the first action. Show what a filled state looks like.</td></tr>
<tr><td>User-emptied</td><td>Had things, cleared them</td><td>Acknowledge the achievement. "Inbox zero," not "No messages." Offer undo if recent.</td></tr>
<tr><td>Filtered to nothing</td><td>Has things, the filter excludes them</td><td>Say <em>what filter</em> is excluding them, offer to clear it. Never suggest creating something.</td></tr>
</table></div>
<p>If you design nothing else well this week, design first-run empty states. They carry the entire onboarding burden in most products and are usually an afterthought.</p>
<h4>Error states — three requirements, and most errors meet zero</h4>
<ol>
<li><strong>Say what happened</strong>, in plain language, from the user's perspective</li>
<li><strong>Say why</strong>, if it helps them fix it</li>
<li><strong>Say what to do next</strong>, with the action right there</li>
</ol>
<p>✗ "Error: request failed (500)"<br>
✗ "Something went wrong. Please try again."<br>
✓ "We couldn't save your changes — the connection dropped. Your work is stored locally. <strong>[Retry]</strong>"</p>
<p><strong>Never lose the user's input.</strong> A form that clears on error is a hostile act. And place errors <strong>inline, at the field</strong> — a summary at the top requires mapping from message to field, a working-memory task you created for no reason.</p>
<p><strong>Partial states.</strong> Show partial data with a clear marker of what's missing, or show nothing? Usually the former — but <em>only if the incompleteness is unmistakable</em>. Partial data that looks complete is worse than an error, because the user makes decisions on it.</p>
<p><strong>Offline and degraded.</strong> Make the boundary <em>visible and predictable</em> rather than pretending nothing changed. A product that silently fails to save loses trust permanently in a single incident.</p>
<p><strong>Success states.</strong> The forgotten one. Proportionate to stakes — a saved draft needs a whisper; a submitted tax return needs a receipt.</p>
<div class="warn"><strong>A useful stance in a design review:</strong> ask "what does this look like when it's empty, and when it's broken?" The fastest way to find out whether a design is finished — and it works on other people's work as well as your own.</div>`,
source:{label:"Polaris — empty states and error messaging",url:"https://polaris.shopify.com/",note:"Best-in-class. Then NN/g's error message guidelines."},
drill:`<p>Design <strong>all three empty states</strong> and <strong>three error states</strong> for Studio C, properly. Each error must meet all three requirements.</p><p>Then take one error state from a product you use, judge it against the three requirements, and rewrite it.</p>`},

{n:5,title:"Content design — writing as an interface material",
concept:`
<p>Interface text is not decoration applied to a design — <strong>it is the design.</strong> A button's label does more work than its colour. A confirmation dialog is 90% words. An empty state is entirely words.</p>
<p><strong>Given your background this is a genuine advantage.</strong> You've written marketing copy, so you can write. The transfer problem: <strong>marketing copy persuades; interface copy clarifies.</strong> Marketing earns attention; interface copy respects that attention has already been given and should be spent on the task.</p>
<ol>
<li><strong>Clear over clever, always.</strong> A pun in a button label costs comprehension on every use.</li>
<li><strong>Use the user's words.</strong> From your interviews. Grep your transcripts. Internal vocabulary ("entities," "assets") should be translated at the boundary.</li>
<li><strong>Front-load the meaningful words.</strong> People read the first 2–3 words of a line and decide. "Delete project," not "Are you sure you want to delete this project?"</li>
<li><strong>Buttons state the action, not the response.</strong> ✗ "OK / Cancel." ✓ "Delete project / Keep it." Users click without reading dialogs — a verb-labelled button is the last line of defence.</li>
<li><strong>Second person, active voice, present tense.</strong> "You'll get a receipt," not "A receipt will be sent to the user."</li>
<li><strong>Sentence case for UI.</strong> Easier to scan; doesn't shout.</li>
<li><strong>Numbers as numerals.</strong> "3 items," not "three items" — numerals are pre-attentively distinct and scan faster.</li>
<li><strong>Say what happens, not what the system does.</strong> "Your file is saved," not "Save operation completed successfully."</li>
</ol>
<p><strong>The microcopy that carries most weight, in order:</strong> button labels · error messages · empty states · field labels and helper text · confirmation dialogs · permission requests.</p>
<blockquote><p><strong>The exercise that improves copy fastest: read it aloud.</strong> Text that sounds strange spoken reads as strange. Catches passive voice, jargon, and false politeness immediately.</p></blockquote>
<div class="warn"><strong>Using AI for interface copy.</strong> Models are very good at generating twenty label variations, flagging inconsistent terminology across a product, and rewriting system-voice into user-voice. They're weak at knowing your users' <em>actual vocabulary</em> — which is why the transcripts from Week 5 are the input that makes the output good. <strong>Feed the model your users' words, not just your intent.</strong></div>`,
source:{label:"Polaris content guidelines",url:"https://polaris.shopify.com/content",note:"Genuinely the best public writing on this. The book is Torrey Podmajersky, <em>Strategic Writing for UX</em>."},
drill:`<p>Take every piece of text in one Studio C screen — every label, button, heading, helper, error. Rewrite all of it against the eight principles. <strong>Read it aloud.</strong></p><p>Then do the same for a confirmation dialog in a product you use, and note how much better the verb-labelled version is.</p>`},

{n:6,studio:"C",title:"Studio C — state and edge-case matrix",
concept:`
<p>More demanding than Week 6's, because AI features have states conventional software doesn't.</p>
<pre>idle · prompted · thinking · streaming · complete
stopped-by-user · refused · errored · timed-out
low-confidence · partially-wrong · out-of-scope · stale-context
rate-limited · degraded-model</pre>
<p>Plus every standard dimension from Week 6. The <strong>confidently wrong</strong> screen is the most important artifact in the whole studio.</p>`,
source:{label:"Microsoft HAX — design patterns by interaction stage",url:"https://www.microsoft.com/en-us/haxtoolkit/design-patterns/",note:"Organised by when: initially, during interaction, when wrong, over time. Use the \"when wrong\" section directly for this matrix."},
deliverable:"Deliverable C3 — State &amp; edge-case matrix",
drill:`<ul>
<li>Full matrix: every screen × every state, standard and AI-specific</li>
<li>Every <code>—</code> justified in one line</li>
<li><strong>All three empty states designed</strong></li>
<li><strong>Three error states designed</strong>, meeting all three requirements</li>
<li><strong>The "confidently wrong" screen designed</strong></li>
<li>Accessibility spec for every screen: contrast verified, focus order specified, focus management on state change, non-colour encoding, target sizes</li>
<li>All interface copy written and read aloud</li>
<li>Reduced-motion variants noted</li>
</ul>
<p><em>Time: matrix ~40 min · screens ~80 min. A long day.</em></p>
<p><code>/product-design-course critique C3</code> — ask Claude to attack the "confidently wrong" case and the focus management specifically. That's where AI design work is usually thinnest.</p>`}
]});

/* ---------------- WEEK 11 ---------------- */
COURSE.push({w:11,phase:4,title:"Designing AI Products",
thesis:"Every principle you've learned assumed a deterministic system — same input, same output, knowable rules. A model breaks that assumption, and the break propagates through every layer. <b>This is the week that makes you specifically valuable where you work.</b>",
days:[
{n:1,title:"What changes when the system is probabilistic",
concept:`
<p>Five things break. Understanding <em>which</em> five is what lets you design deliberately instead of copying whatever ChatGPT did last month.</p>
<p><strong>1. The conceptual model has no correct version.</strong> Your job is to give a simplified, predictive model of the system — but a language model's behaviour isn't summarisable in a way that predicts reliably. Every metaphor is wrong in a load-bearing way:</p>
<ul>
<li><em>"It's a person who knows things"</em> → wrong about hallucination, memory, consistency</li>
<li><em>"It's a search engine"</em> → wrong about synthesis and sourcing</li>
<li><em>"It's a tool"</em> → wrong about variability; a hammer does the same thing twice</li>
</ul>
<p>So <strong>you can't fix this with a metaphor — you must fix it with behaviour.</strong> The interface has to <em>demonstrate</em> the limits repeatedly, in context, at the moment they're relevant. Showing sources teaches "it can be wrong about facts." A confidence signal teaches "it has degrees of certainty." Regeneration teaches "it's non-deterministic." That accumulation <em>is</em> the design work.</p>
<p><strong>2. The Gulf of Evaluation becomes enormous.</strong> Normally stage 6 takes milliseconds. With a model, evaluating output can be <em>harder than producing it manually</em>. This is the central design problem of the field — and why "make the output prettier" is almost never the highest-value work. <strong>Reducing verification cost is.</strong></p>
<p>Verification cost drops when you show provenance, show reasoning or intermediate steps, structure output for scanning rather than reading, highlight what's uncertain, and make it cheap to check <em>one</em> claim rather than all of them.</p>
<p><strong>3. Errors are graded, not binary.</strong> A model produces output on a spectrum from perfect to plausible-nonsense, and the <em>user</em> has to place it. Your error design has to handle "70% right" — a state with no established design language. Most products have a success state and an error state and nothing in between, which is precisely wrong for the actual distribution of outcomes.</p>
<p><strong>4. Consistency partially breaks.</strong> Same input, different output. Sometimes a feature; usually a cost. Do you offer regeneration (embracing variance) or caching (hiding it)? Concealing it is tempting and produces a worse mental model.</p>
<p><strong>5. The failure surface is unbounded.</strong> You can enumerate how a form fails. You cannot enumerate how a model is wrong. So design shifts from <em>handling known errors</em> to <strong>building general-purpose recovery</strong>: undo, edit, steer, constrain, escalate.</p>
<blockquote><p><strong>In deterministic software, you design the happy path and handle exceptions. In AI software, you design the recovery path and handle the happy case as a special instance of it.</strong></p></blockquote>`,
source:{label:"Google PAIR — Mental Models & Errors + Graceful Failure",url:"https://pair.withgoogle.com/guidebook-v2/",note:"The best free writing on this. Read both chapters."},
drill:`<p>Take an AI feature you use daily. Write: (a) the conceptual model it gives you, in three sentences · (b) two things that model predicts <em>wrongly</em> · (c) what the interface does to correct those wrong predictions · (d) what it <em>could</em> do.</p><p>Section (d) is candidate work for Studio C.</p>`},

{n:2,title:"Microsoft's 18 Human–AI guidelines",
concept:`
<p>Amershi et al. (CHI 2019) synthesised twenty years of scattered guidance into 18 validated guidelines, organised by <em>when in the interaction</em> they apply. The closest thing the field has to a standard.</p>
<h4>Initially</h4>
<ol><li>Make clear what the system can do.</li>
<li>Make clear <strong>how well</strong> the system can do what it can do. — <em>The most-violated guideline in the industry</em>, because overselling capability is commercially tempting and produces exactly the trust collapse it was trying to avoid.</li></ol>
<h4>During interaction</h4>
<ol start="3"><li>Time services based on context.</li>
<li>Show contextually relevant information.</li>
<li>Match relevant social norms.</li>
<li>Mitigate social biases.</li></ol>
<h4>When wrong</h4>
<ol start="7"><li>Support efficient invocation.</li>
<li>Support efficient <strong>dismissal</strong>. — <em>Frequently missing, and its absence makes a feature feel imposed.</em></li>
<li>Support efficient <strong>correction</strong>. — <strong>The single highest-value guideline for most products.</strong></li>
<li>Scope services when in doubt. — When uncertain, do less.</li>
<li>Make clear <strong>why</strong> the system did what it did.</li></ol>
<h4>Over time</h4>
<ol start="12"><li>Remember recent interactions.</li>
<li>Learn from user behaviour.</li>
<li>Update and adapt cautiously.</li>
<li>Encourage granular feedback.</li>
<li>Convey the consequences of user actions.</li>
<li>Provide global controls.</li>
<li>Notify users about changes.</li></ol>
<blockquote><p>Use them not as a checklist to pass but as an <strong>audit grid</strong>. Mark each: <em>implemented / deliberately skipped / gap</em>. <strong>The "deliberately skipped" column is the valuable one</strong> — it's where you demonstrate judgment rather than compliance.</p></blockquote>
<p><strong>The four most commonly missing</strong>, where you can add most value:</p>
<ul>
<li><strong>#2</strong> — because saying "this is right about 80% of the time" feels like admitting weakness. It isn't; it's the foundation of calibrated trust, and products that do it get <em>more</em> trust over time.</li>
<li><strong>#8</strong> — features that can't be easily ignored are experienced as intrusive regardless of quality.</li>
<li><strong>#9</strong> — most products offer accept-or-regenerate. Regenerating throws away a 90%-correct output and rolls the dice. <strong>Editing beats regenerating, almost always.</strong></li>
<li><strong>#11</strong> — even shallow explanation ("based on your last three projects") substantially improves trust and the mental model.</li>
</ul>`,
source:{label:"Guidelines for Human-AI Interaction",url:"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/",note:"Canonical wording, plus the <a href=\"https://www.microsoft.com/en-us/haxtoolkit/design-patterns/\">design pattern library</a> for concrete implementations of each. The paper is Amershi et al., CHI 2019."},
drill:`<p>Audit an AI product you use against all 18. Mark each implemented / skipped / gap. Then pick the three biggest gaps and sketch what closing them would look like.</p><p>Keep this — it's the format for Deliverable C4.</p>`},

{n:3,title:"Trust calibration — confidence, explanation, graceful wrongness",
concept:`
<p>The goal is <strong>not maximum trust. It's calibrated trust</strong> — the user's confidence should track the system's actual reliability.</p>
<ul>
<li><strong>Under-trust</strong> — they don't use a capable feature, or check everything manually. Net-negative on effort.</li>
<li><strong>Over-trust</strong> — they accept output they should have checked. <strong>The more dangerous failure</strong>, and design frequently causes it, because polish reads as competence.</li>
</ul>
<div class="warn">A fluent, well-typeset, confidently-worded wrong answer is more dangerous than a hesitant one — and <strong>your visual craft actively contributes to the problem.</strong> Sit with that: the better you make it look, the more you have to work to keep trust calibrated.</div>
<div class="tablewrap"><table>
<tr><th>Confidence method</th><th>Notes</th></tr>
<tr><td>Numeric probability</td><td>Precise, mostly useless — people are bad at probabilities and false precision reads as certainty</td></tr>
<tr><td>Categorical (high/med/low)</td><td>Better. Coarse enough to be honest.</td></tr>
<tr><td>Hedged language</td><td>Natural and works — easy to overdo into uselessness</td></tr>
<tr><td>Visual encoding</td><td>Strong when it marks <em>which parts</em> are uncertain, not the whole output</td></tr>
<tr><td>Showing alternatives</td><td>Very strong — communicates non-determinism structurally</td></tr>
<tr><td>Showing sources</td><td>Strongest for factual output. Converts "trust me" into "check this."</td></tr>
<tr><td>Showing the work</td><td>Lets the user verify the <em>process</em> when they can't verify the <em>answer</em></td></tr>
</table></div>
<blockquote><p>The best confidence signals are the ones that give the user something to <strong>do</strong>. A percentage is information; a source is an action.</p></blockquote>
<p><strong>Three kinds of explanation:</strong> <em>provenance</em> (where did this come from — cheapest and highest-value, start here) · <em>process</em> (how was it derived) · <em>rationale</em> (why this rather than something else).</p>
<h4>Designing graceful wrongness</h4>
<ol>
<li><strong>Notice</strong> — the wrongness must be detectable. If not, everything else fails.</li>
<li><strong>Understand</strong> — wrong facts, wrong intent, or wrong scope?</li>
<li><strong>Correct efficiently</strong> — edit the specific part, not regenerate everything</li>
<li><strong>Prevent recurrence</strong> — constrain, instruct, or teach it</li>
<li><strong>Escape</strong> — do it manually, no penalty, no loss of what they'd built</li>
</ol>
<p>Point 5 is the one products skip. <strong>An AI feature with no manual fallback is a trap</strong>, and users learn to avoid features that trap them.</p>
<p><strong>A stance worth adopting:</strong> the interface should be as confident as the system deserves, and no more. When asked to make output "feel more authoritative," that's a request to miscalibrate trust. The honest counter — calibrated systems accrue trust over time and overconfident ones lose it in a single incident — is a business argument, not just an ethical one, and it's the one that lands.</p>`,
source:{label:"PAIR Guidebook — Explainability + Trust",url:"https://pair.withgoogle.com/guidebook-v2/",note:"Then HAX guidelines #2, #10 and #11."},
drill:`<p>Take one AI output from a product you use. Design <strong>three different confidence expressions</strong> — one categorical, one visual/inline, one provenance-based.</p><p>Then honestly assess: which would make you <em>check</em> the output when you should? That's the one that works.</p>`},

{n:4,title:"The interaction primitives of AI products",
concept:`
<p>The pattern language is being invented right now. Here's the current state — and which primitives are underused.</p>
<h4>Input</h4>
<ul>
<li><strong>Open prompt</strong> — maximum expressiveness, maximum blank-page problem. Needs scaffolding: examples, suggestions, templates.</li>
<li><strong>Structured prompt</strong> — fields and constrained inputs that compose into a prompt. Far better discoverability, and teaches the capability surface implicitly. <em>Underused.</em></li>
<li><strong>Selection-based</strong> — act on what's selected. Lowest friction, highest context, no blank page. <strong>The most underused primitive in the field.</strong> "Explain this" on a highlighted paragraph beats a chat box asking about the same paragraph, every time.</li>
<li><strong>Ambient / proactive</strong> — highest value when right, highest annoyance when wrong. Requires excellent timing (#3) and dismissal (#8).</li>
</ul>
<h4>Output</h4>
<ul>
<li><strong>Streaming</strong> — only valuable if it starts <em>sooner</em>, not because motion is nice</li>
<li><strong>Structured output</strong> — tables, lists, sections rather than prose. Dramatically reduces verification cost. <strong>The single easiest win in most AI products.</strong></li>
<li><strong>Inline / in-place</strong> — output appears where the work is; keeps the spatial model intact</li>
<li><strong>Multiple candidates</strong> — shows non-determinism honestly, lets the user <em>select</em> rather than judge</li>
<li><strong>Cited / grounded</strong> — claims linked to sources</li>
<li><strong>Diff / preview</strong> — show the <em>change</em>, not the result. Enormously better for edits: the user verifies a delta rather than re-reading everything. <strong>Badly underused.</strong></li>
</ul>
<h4>Control — where most products are weakest</h4>
<ul>
<li><strong>Stop</strong> — converts waiting into a choice. Essential.</li>
<li><strong>Regenerate</strong> — cheap to build, throws away partial value</li>
<li><strong>Edit output</strong> — <em>better than regenerate almost always</em>, and much rarer</li>
<li><strong>Steer</strong> — "shorter," "more formal," "focus on X." Cheaper than re-prompting</li>
<li><strong>Constrain</strong> — set boundaries in advance. Prevention over correction</li>
<li><strong>Undo</strong> — non-negotiable for anything that modifies the user's work</li>
<li><strong>Escalate / fall back</strong> — manual, or a human</li>
</ul>
<blockquote><p><strong>The four-question checklist:</strong> Does the user know what it can do? Do they know how well? Can they tell when it's wrong? Can they fix it without starting over?<br><br>Most AI features fail the last three. Getting them right is a differentiated product.</p></blockquote>
<div class="warn"><strong>Where your motion background pays off:</strong> almost every primitive above is <em>temporal</em>. Streaming, progressive structure, diff reveal, steering that transforms existing output rather than replacing it — all choreography problems. A diff that animates from old to new <em>teaches</em> the change; a diff that cuts makes the user compare manually. Most teams building these have no time-based craft and produce jump-cuts. That's your opening.</div>`,
source:{label:"HAX design patterns library",url:"https://www.microsoft.com/en-us/haxtoolkit/design-patterns/",note:"Organised by guideline and interaction stage. Then examine four AI products closely and catalogue which primitives each uses."},
drill:`<p>Build a <strong>primitive audit</strong> of four AI products: which input, output and control primitives does each use? Which are missing?</p><p>Then for Studio C, choose your primitives explicitly and justify each. Pay particular attention to whether you can use <em>selection-based input</em> and <em>diff-based output</em> instead of the default chat-and-prose.</p>`},

{n:5,title:"Evaluation and feedback loops as UX surface",
concept:`
<p>In conventional software, feedback collection is a PM activity. In AI products it's <strong>an interface surface with direct functional consequence.</strong></p>
<p><strong>Three purposes feedback serves</strong> — and conflating them produces bad design: improving the model (aggregate, invisible) · correcting this instance (immediate, visible) · teaching the system about this user (personal, cumulative).</p>
<p>Thumbs up/down conflates all three and delivers poorly on all of them. The user doesn't know which they're doing, sees no consequence, and stops bothering. <strong>HAX #16 — convey the consequences of user actions — is the fix.</strong></p>
<p><strong>Granular feedback beats binary.</strong> "This part is wrong" is far more useful than "this is bad" — to you, and to the user, who gets to be specific rather than merely dissatisfied. Design for span-level marking · category (wrong fact / wrong tone / wrong format / missed the point / unsafe) · <strong>correction as feedback</strong> — the user's edit <em>is</em> the signal. Highest-quality feedback available, and free. <em>If a user edits your output, capture the diff.</em></p>
<h4>The reciprocity problem — why feedback systems die</h4>
<p>Users give feedback when they believe it does something. If nothing visibly changes, they stop within a few uses. In ascending order of effectiveness: acknowledge it → apply it immediately in-session → <strong>show accumulated preferences somewhere the user can see and edit them</strong> → show change over time.</p>
<p>The third is underrated: a visible, editable memory of what the system has learned about you satisfies HAX #12, #13, #16 and #17 simultaneously, and turns an invisible adaptive system into a legible one.</p>
<h4>Evaluation as a design concern</h4>
<blockquote><p>Not "is the model accurate" but <strong>"can the user achieve their goal, including the cost of verification and correction?"</strong> These come apart constantly. A more accurate model with worse correction affordances produces a worse product.</p></blockquote>
<p>That's a genuinely useful argument, because it puts design work on the same footing as model work in a roadmap conversation.</p>
<p><strong>Design-layer metrics:</strong> acceptance rate · <strong>edit distance</strong> (small edits = good; total rewrites = bad even if "accepted") · correction depth · abandonment · <strong>time to acceptable output vs time to do it manually</strong> — the honest bottom line, and the verification-cost test expressed as something you can instrument.</p>`,
source:{label:"PAIR Guidebook — Feedback + Control",url:"https://pair.withgoogle.com/guidebook-v2/",note:"Then HAX guidelines #12–#18."},
drill:`<p>Design the <strong>feedback and control surface</strong> for Studio C: granular feedback mechanism · what the user sees as consequence · where accumulated learning is visible and editable · the global controls (HAX #17).</p><p>Then define your five design-layer metrics.</p>`},

{n:6,studio:"C",title:"Studio C — design the AI interaction",
concept:`
<p>The core design of your AI feature, mapped against the standard. This is the heart of the capstone.</p>
<p>Remember the deliverable that matters most: <strong>the wrongness design.</strong> Show the screen where the model is confidently incorrect and the user recovers gracefully. That screen is the whole portfolio piece.</p>`,
source:{label:"HAX Toolkit + PAIR Guidebook",url:"https://www.microsoft.com/en-us/haxtoolkit/ai-guidelines/",note:"Keep both open as you design. Cross-reference every decision against the 18 guidelines."},
deliverable:"Deliverable C4 — The AI interaction design + HAX audit",
drill:`<p><strong>1. The interaction design</strong> — screens and flows:</p>
<ul>
<li>Capability communication (what it can do, how well) — HAX #1, #2</li>
<li>Input primitive, chosen and justified</li>
<li>The latency and streaming experience (from C2)</li>
<li>Output primitive, justified — with a strong bias toward structured and diff-based over prose</li>
<li>Confidence expression — actionable, not just informational</li>
<li>Explanation / provenance</li>
<li>All control primitives: stop, edit, steer, constrain, undo, fall back</li>
<li>The feedback surface and its visible consequence</li>
</ul>
<p><strong>2. The wrongness design:</strong> the confidently-wrong screen with full recovery · the subtly-wrong case (how does the user notice?) · the refusal case · the manual escape hatch.</p>
<p><strong>3. The HAX audit</strong> — all 18, marked implemented / deliberately skipped / gap, with a one-line justification for every skip. <strong>The skips are where your judgment shows.</strong></p>
<p><strong>4. The verification-cost statement</strong> — revisited from C1, now with evidence from the design.</p>
<p><em>Time: ~2.5 hrs. Split across two days if needed.</em></p>
<p><code>/product-design-course critique C4</code> — ask Claude to attack it as a skeptical user who has just been burned by a confidently wrong output.</p>`}
]});

/* ---------------- WEEK 12 ---------------- */
COURSE.push({w:12,phase:4,title:"Measurement, Critique and Shipping",
thesis:"Design work that can't be measured, defended, or handed over doesn't ship. <b>This is the week that converts a designer into a colleague other people want to work with</b> — and where your marketing and GTM background stops being a side note.",
days:[
{n:1,title:"HEART and Goals–Signals–Metrics",
concept:`
<p>Designers who can't talk about measurement get overruled by people who can. You have an advantage — you've run performance marketing, so you're fluent in funnels and cohorts. The transfer is mostly about <em>what to measure when the goal is quality of experience rather than conversion.</em></p>
<div class="tablewrap"><table>
<tr><th></th><th>What it measures</th><th>Example signals</th></tr>
<tr><td>Happiness</td><td>Attitudinal — how do they feel?</td><td>Satisfaction, perceived ease, ratings</td></tr>
<tr><td>Engagement</td><td>Depth of involvement per user</td><td>Sessions/week, actions/session, time in core task</td></tr>
<tr><td>Adoption</td><td>New users of a feature</td><td>% of eligible users who tried it in 30 days</td></tr>
<tr><td>Retention</td><td>Users who come back</td><td>% still active after 4 weeks</td></tr>
<tr><td>Task success</td><td>Efficiency and effectiveness</td><td>Completion rate, time on task, error rate</td></tr>
</table></div>
<p><strong>You do not measure all five.</strong> The paper's own guidance is to pick what matters for <em>this</em> product at <em>this</em> stage. A new feature cares about Adoption and Task Success. A mature product cares about Retention and Happiness. Filling in all five signals you haven't decided what matters.</p>
<h4>GSM — Goals, Signals, Metrics</h4>
<ol>
<li><strong>Goal</strong> — what success means, for the user <em>and</em> the business. Write both.</li>
<li><strong>Signal</strong> — what observable behaviour indicates it? <em>This is where the thinking is.</em></li>
<li><strong>Metric</strong> — how do you turn that signal into a trackable number?</li>
</ol>
<blockquote><p><strong>Goal:</strong> Users draft client updates faster, without losing their voice.<br>
<strong>Signal:</strong> They accept generated drafts with light edits rather than rewriting or abandoning.<br>
<strong>Metric:</strong> Acceptance rate; median edit distance; % abandoned; time-to-send vs manual baseline.</p></blockquote>
<p>Note the metric set includes a <strong>counter-metric</strong> (abandonment) and a <strong>baseline</strong> (manual). Both essential, both usually missing.</p>
<div class="tablewrap"><table>
<tr><th>Primary</th><th>Counter-metric</th></tr>
<tr><td>Engagement ↑</td><td>Task completion time ↓ <em>(engaged or lost?)</em></td></tr>
<tr><td>Adoption ↑</td><td>Retention of adopters <em>(did they come back?)</em></td></tr>
<tr><td>Acceptance rate ↑</td><td>Edit distance, downstream corrections <em>(accepted ≠ correct)</em></td></tr>
<tr><td>Time on task ↓</td><td>Error rate <em>(faster and wronger is not better)</em></td></tr>
</table></div>
<div class="warn"><strong>What design can and can't be held to.</strong> Be precise — it protects you. Design can be held to task success, error rates, feature adoption, perceived ease. Design <em>cannot</em> be held to revenue, company-level retention, or growth — too many other variables. <strong>Agreeing the measurable surface before you ship is how you avoid being blamed for a market condition.</strong></div>`,
source:{label:"Rodden, Hutchinson & Fu (2010) — the HEART paper",url:"https://research.google.com/pubs/archive/36299.pdf",note:"Free PDF, short and readable. Then <a href=\"https://kerryrodden.com/heart/\">Kerry Rodden's own summary</a>."},
deliverable:"Deliverable C5 — Measurement plan",
drill:`<p>Build the measurement plan for Studio C: a HEART table with <em>only</em> the categories that matter (justify the exclusions) · a full GSM breakdown for your primary goal · a counter-metric for every primary metric · the five design-layer AI metrics from Week 11.</p><p>State what you'd instrument and what baseline you'd compare to.</p>`},

{n:2,title:"Experiments — what A/B testing can and cannot tell you",
concept:`
<p>You know experiments from performance marketing. The transfer is good, but three things differ.</p>
<p><strong>Good at:</strong> comparing two specific alternatives on a specific measurable outcome, with enough traffic, over a short horizon.</p>
<h4>What it cannot do</h4>
<p><strong>1. It can't tell you what to test.</strong> The hypothesis is the hard part and comes from research, framing and judgment. A/B testing is a <em>selection</em> mechanism, not a <em>generation</em> one. Teams that lean entirely on testing converge on local maxima — endlessly refined versions of a fundamentally mediocre design.</p>
<p><strong>2. It's biased toward short-horizon, easily-measured outcomes.</strong> Trust, comprehension, learnability and mental-model quality develop over weeks and are near-invisible in a two-week test. This is why testing systematically over-rewards dark patterns and urgency mechanics — they win the two-week window and lose the two-year one. <strong>Being able to name this bias is one of the most valuable things a designer contributes to a growth team.</strong></p>
<p><strong>3. Novelty and change-aversion contaminate the window.</strong> New things get engagement because they're new; changes to familiar things get resistance because they're changes. A two-week test frequently measures neither design but the <em>transition</em>.</p>
<p><strong>Statistical points worth having ready:</strong> underpowered tests are worse than no test · peeking and stopping when significant inflates false positives dramatically · testing many variants without correction guarantees a spurious winner · segment effects hide in aggregates (a change can help new users, hurt power users, and net to zero).</p>
<h4>When not to A/B test — the more useful list</h4>
<ul>
<li>Low traffic — you'll never reach power; use qualitative methods</li>
<li>The change is obviously correct — testing a WCAG fix wastes a cycle</li>
<li>The outcome is long-horizon — use cohorts and longitudinal measures</li>
<li>It's a structural change — you're comparing two <em>products</em>, not two buttons</li>
<li>It would require shipping something you believe is harmful. <strong>You are allowed to say no</strong>, and the argument is that a test which damages trust costs more than the information is worth.</li>
</ul>
<blockquote><p><strong>The healthy relationship:</strong> qualitative research tells you <em>what to build and why</em>. Usability testing tells you <em>whether it's comprehensible</em>. A/B testing tells you <em>which of two comprehensible options performs better at scale</em>. Using any one for another's job produces the characteristic failures of each.</p></blockquote>`,
source:{label:"NN/g on the limits of A/B testing",url:"https://www.nngroup.com/articles/ab-testing-and-ux-research/",note:"For the design-specific critique. Your marketing background covers the mechanics."},
drill:`<p>For Studio C, write <strong>two hypotheses you'd A/B test</strong> and <strong>two questions you'd refuse to A/B test</strong>, with reasons for the refusals.</p><p>The refusals are the interesting half.</p>`},

{n:3,title:"Critique — how to run one, how to survive one",
concept:`
<p>Critique is how design quality gets built socially rather than individually. Done well it's the highest-leverage hour in a design team's week. Done badly it's a status contest that makes everyone defensive.</p>
<blockquote><p><strong>Three passes, in order.</strong> 1. Structural — is this the right set of screens/steps at all? 2. Interaction — is each step clear, forgiving, low-load? 3. Visual — hierarchy, spacing, type, colour.</p></blockquote>
<p>Critiques default to pass 3 because visual issues are easiest to see and safest to raise. The result is a room full of people polishing a structure nobody examined. <strong>The single most valuable thing a facilitator does is refuse to let the conversation start at pass 3.</strong></p>
<h4>Running one</h4>
<ul>
<li><strong>The presenter frames first</strong>, in two minutes: the job, the constraint, and the <em>specific thing they want help with</em>. Without a stated ask, you get scattered opinion.</li>
<li><strong>Set the stage explicitly</strong> — exploring, or converging? Feedback appropriate for one is destructive to the other.</li>
<li><strong>Silent review first</strong>, 5 minutes. Everyone writes before anyone speaks — otherwise the first speaker anchors the room. Same mechanism as independent heuristic evaluation.</li>
<li><strong>Questions before opinions.</strong> "What happens if the list is empty?" surfaces more than "I don't like the empty state."</li>
<li><strong>Separate observation from prescription.</strong> "I couldn't tell which was the primary action" is a finding. "Make it blue" is a solution — and generating those is the presenter's job.</li>
<li><strong>Timebox and capture.</strong> Someone writes it down or it didn't happen.</li>
</ul>
<h4>Receiving — the harder skill</h4>
<ul>
<li><strong>Your only job is to understand.</strong> Write everything down before responding to any of it. The instinct to explain is the instinct that stops you hearing, and it's strongest exactly when the feedback is most useful.</li>
<li><strong>Distinguish three things you'll hear:</strong> a <em>problem</em> (valuable, always), a <em>solution</em> (treat as a symptom — find the problem underneath), a <em>preference</em> (acknowledge, weigh, often discard).</li>
<li><strong>You don't have to act on everything.</strong> You do have to say why you didn't. Unexplained non-action is how designers lose the room's willingness to engage.</li>
<li><strong>Notice defensiveness as data.</strong> The point you most want to defend is usually the one you're least sure about.</li>
</ul>
<div class="warn"><strong>On stakeholder feedback</strong> — what your marketing background prepared you for: stakeholders are <strong>excellent problem detectors and unreliable solution generators.</strong> When a VP says "make the logo bigger," the useful response is neither compliance nor resistance but translation: <em>what did you notice that made you say that?</em> There's usually a real finding underneath, with better solutions than the one proposed.</div>`,
source:{label:"How we do design critiques at Figma",url:"https://www.figma.com/blog/design-critiques-at-figma/",note:"Six formats and the reasoning behind each. The <a href=\"https://nlevin.medium.com/design-critiques-at-figma-799d4a3a1b0\">longer Noah Levin version</a> goes deeper."},
drill:`<p>Run a <strong>real critique</strong> on Studio C. Get two people — ideally one non-designer. Frame it properly, silent review first, enforce the three passes in order. Capture everything.</p><p>Then write your response: what you'll act on, what you won't, and why.</p>`},

{n:4,title:"Design rationale — the document that gets you trusted",
concept:`
<p>The single most reliable way to be treated as senior is to write down your reasoning <em>before you're asked for it</em>.</p>
<p><strong>Why it matters more than it seems.</strong> Design decisions get revisited constantly — by a new PM, in a quarterly review, by an engineer six months later. Without written rationale, every revisit is a fresh argument decided by whoever is most senior or most recently annoyed. <strong>With it, the decision is a fact with a reason attached, and the conversation moves to whether the reason still holds</strong> — a much better conversation.</p>
<h4>The structure</h4>
<ol>
<li><strong>The decision</strong>, in one sentence.</li>
<li><strong>The problem it addresses</strong>, with evidence — a research finding, a metric, support volume, a heuristic violation.</li>
<li><strong>The options considered</strong> — at least three, including the obvious one and the one you rejected. <em>This section is what makes the doc credible.</em> One option reads as justification; three reads as a decision.</li>
<li><strong>Why this one</strong> — the reasoning, the principle, the tradeoff.</li>
<li><strong>What we're giving up.</strong> Explicit. Naming your cost is the fastest signal of seniority available to you.</li>
<li><strong>What would change our mind</strong> — the conditions to revisit. Turns a decision into a hypothesis: more honest <em>and</em> more defensible.</li>
<li><strong>How we'll know it worked</strong> — the metric from Day 1.</li>
</ol>
<p><strong>Length: one page.</strong> If it's longer, the decision is probably three decisions.</p>
<blockquote><p><strong>Write the rationale <em>while</em> designing, not after.</strong> Writing forces you to notice when you don't actually have a reason — the most useful moment in the process, because it's where you discover you were about to ship an assumption.</p></blockquote>
<p><strong>On tone:</strong> confidence with stated uncertainty. "I recommend X. The main risk is Y, and if Z happens we should reconsider." Reads as far more competent than either false certainty or hedging, because it shows you've modelled the failure case.</p>
<div class="warn"><strong>Your specific advantage:</strong> you write for a living already. Most designers don't and find this genuinely difficult. Being the designer who reliably produces clear one-page rationale docs costs you almost nothing and compounds enormously — it's how you become the person whose opinion is asked for <em>before</em> decisions rather than after.</div>`,
source:{label:"Shape Up — the pitch format",url:"https://basecamp.com/shapeup",note:"The closest thing to a template. Also read a few public engineering ADRs (architecture decision records) — the format transfers directly."},
drill:`<p>Write <strong>three rationale docs</strong>, one page each, for the three most significant decisions in Studio C. Full structure.</p><p>At least one must be a decision you're genuinely uncertain about — and the doc must say so.</p>`},

{n:5,title:"Working with engineering and PM",
concept:`
<p>The last skill: getting the work built the way you intended, without being the person who blocks everything.</p>
<h4>What engineers actually need from you, in order</h4>
<ol>
<li><strong>States, not screens.</strong> Every state from your Week 6 and Week 10 matrices. The number one gap, and filling it prevents most implementation drift.</li>
<li><strong>Rules for the cases you didn't draw.</strong> "All list errors use inline error + retry" covers more ground than fifty artboards.</li>
<li><strong>Component APIs, not artboards.</strong> Props, variants, slots, invalid combinations.</li>
<li><strong>Tokens named as they'll be in code.</strong> If your Figma variable is <code>action-primary</code> and their CSS variable is <code>--color-action-primary</code>, handoff is a lookup rather than a translation.</li>
<li><strong>What's essential vs what's flexible.</strong> Mark it explicitly. Engineers make a hundred small decisions; telling them which ones you care about is the difference between getting what you wanted and getting a negotiation.</li>
<li><strong>To be available.</strong> Most drift happens because a question came up and asking you was slower than guessing.</li>
</ol>
<p><strong>What PMs need:</strong> the appetite conversation. Options with costs, not one solution with a deadline. "Here's the two-week version and the six-week version, and here's what the extra four weeks buys" is the sentence that makes you a partner.</p>
<h4>The scope conversation</h4>
<ul>
<li><strong>Cut breadth, not depth</strong> — fewer flows done properly beats all flows done badly</li>
<li><strong>Cut the rare states last, not first.</strong> Counterintuitive and correct: the error state makes the product feel trustworthy; the third onboarding illustration makes it feel nice. Cut nice.</li>
<li><strong>Cut what you can add later without rework.</strong> Know which things are cheap to retrofit and which require structural change — and defend the structural ones.</li>
<li><strong>Never cut accessibility</strong> — retrofitting costs many times more, and it's the one cut that's genuinely irreversible in practice.</li>
</ul>
<p><strong>Handoff isn't a moment, it's a relationship.</strong> What works: engineers in the critique from Week 3 onward; you in their standup occasionally; a shared understanding of what's decided and what's open. A cultural thing you can influence from any seniority, and the influence is mostly just showing up.</p>
<p><strong>Design QA</strong> — the step everyone skips. Before ship, go through the built thing against your spec. Not to be precious about 2px, but to catch missing states, wrong focus behaviour, broken responsive cases, unimplemented motion, shifted contrast. File specific, prioritised issues — <em>use the severity discipline from Week 3.</em> A QA list where everything is critical gets ignored exactly like an evaluation report where everything is severity 4.</p>
<div class="warn"><strong>The thing that matters more than any of the above:</strong> be the person who is easy to build with. Designers who are precious, slow to respond, or who relitigate settled decisions get routed around, and the work suffers regardless of how good the design was. <strong>Being reliably responsive, clear about what's flexible, and gracious when overruled buys you enormously more design influence than being right does.</strong></div>`,
source:{label:"Shape Up — scope hammering and the building phase",url:"https://basecamp.com/shapeup",note:"Then read your own product's engineering docs. Literacy about how the thing is built is a genuine multiplier on your influence."},
drill:`<p>Write the <strong>handoff package</strong> for Studio C: state list · rules for undrawn cases · component APIs · token names in code convention · an explicit "essential vs flexible" annotation on your key screens.</p><p>Then write the three-question list you'd send an engineer to check your assumptions.</p>`},

{n:6,studio:"C",title:"The case study — packaging Studio C",
concept:`
<p>The final deliverable.</p>
<blockquote><p><strong>The one thing that determines whether this works: section 3, "what I had to figure out."</strong></p></blockquote>
<p>Most portfolios are galleries — here's the research, here's the wireframes, here's the final screens, here's a mockup on an iPhone. They demonstrate that you can execute a process. <strong>They do not demonstrate judgment</strong>, and judgment is the only thing anyone is hiring for now that execution is cheap.</p>
<p>The case studies that work show <em>the two or three genuinely hard questions</em> and how you thought about them. Not "I did user research" but <em>"I had to decide whether to show confidence numerically or categorically, and here's why the numeric version was worse despite being more precise."</em> That paragraph is worth more than every screenshot in the deck.</p>
<div class="warn"><strong>Given your background, the specific risk:</strong> you will make this look extraordinary. Your visual and motion craft will produce a case study far better-looking than the average product designer's — a genuine asset, and also a place to hide. <strong>The temptation will be to spend the day on presentation and half an hour on sections 2, 3 and 8. Do the opposite.</strong> Write the thinking first, in plain text, badly formatted. Then design it.</div>
<p>A reviewer skims your visuals in fifteen seconds and forms an impression. Then they read one section to decide if you can think. Make sure that section exists.</p>`,
source:{label:"The Studios brief — case study structure",url:"https://basecamp.com/shapeup",note:"The eight-section structure is in your vault at 03 The Studios. Shape Up's pitch format is the closest published analogue for sections 2–4."},
deliverable:"Deliverable C6 — The case study",
drill:`<ol>
<li>The situation — 3 sentences</li>
<li><strong>The problem, framed</strong> — POV statement and the evidence</li>
<li><strong>What I had to figure out</strong> — 2–3 genuinely hard questions and your reasoning. <em>Longest section.</em></li>
<li>The exploration — including what you killed and why</li>
<li>The design — flows and screens, annotated with rationale</li>
<li><strong>The unhappy path</strong> — errors, edge cases, the model being confidently wrong</li>
<li>How I'd know it worked — the HEART table</li>
<li><strong>What I'd do differently</strong> — one honest paragraph</li>
</ol>
<p><strong>Write sections 2, 3 and 8 first, as plain text, before opening Figma.</strong></p>
<p><em>Time: writing ~90 min · design ~90 min. Take two days — it's the last thing you'll do and the thing people will actually see.</em></p>
<p>Finally: <strong>re-read the 200 words you wrote on Week 1, Day 1.</strong> What would you now say was actually wrong with it?</p>`}
]});

    var a=new Date(list[i]), b=new Date(list[i-1]);
    var diff=Math.round((a-b)/86400000);
    if(diff===1){ s++; } else if(diff>1){ break; }
  }
  var last=list[list.length-1];
  var gap=Math.round((new Date(todayStr())-new Date(last))/86400000);
  if(gap>1) return list.length+" days logged · last "+gap+" days ago";
  return s+"-day streak · "+list.length+" days logged";
}

/* ---------- rendering ---------- */

function esc(s){ return String(s); }

function renderRail(){
  var rail=document.getElementById("rail");
  var tabs=document.getElementById("mobtabs");
  rail.innerHTML=""; tabs.innerHTML="";
  VIEWS.forEach(function(v){
    var b=document.createElement("button");
    b.className="navbtn"; b.type="button"; b.dataset.view=v.id;
    b.innerHTML='<span class="ic">'+v.ic+'</span>'+v.label;
    b.addEventListener("click",function(){ show(v.id); });
    rail.appendChild(b);

    var m=document.createElement("button");
    m.className="mtab"; m.type="button"; m.dataset.view=v.id;
    m.innerHTML='<span class="ic">'+v.ic+'</span>'+v.label;
    m.addEventListener("click",function(){ show(v.id); });
    tabs.appendChild(m);
  });
}

function renderProgress(){
  var n=doneCount();
  document.getElementById("rp-n").textContent=n;
  document.getElementById("rp-bar").style.width=(n/72*100).toFixed(1)+"%";
  var ph=document.getElementById("rp-phase");
  if(n===0){ ph.textContent="Not started"; }
  else if(n>=72){ ph.textContent="Course complete"; }
  else {
    var wk=getWeek(state.cur.w);
    ph.textContent="Week "+pad(state.cur.w)+" · "+PHASES[(wk?wk.phase:1)-1].title;
  }
  document.getElementById("rp-streak").textContent=streakText();
}

function renderToday(){
  var v=document.getElementById("v-today");
  var w=state.cur.w, d=state.cur.d;
  var wk=getWeek(w), day=getDay(w,d);
  if(!wk||!day){ v.innerHTML="<p>Not found.</p>"; return; }
  var ph=PHASES[wk.phase-1];
  var isDone=!!state.done[key(w,d)];
  var idx=(w-1)*6+d;

  var h='';
  h+='<div class="today-head">';
  h+= '<div class="today-meta">';
  h+=  '<span class="chip ph'+wk.phase+'">Phase 0'+wk.phase+' · '+ph.title+'</span>';
  h+=  '<span class="chip ghost">Week '+pad(w)+' · Day '+d+'</span>';
  h+=  '<span class="chip ghost">Day '+idx+' of 72</span>';
  if(day.studio) h+='<span class="chip studio">Studio '+day.studio+'</span>';
  if(isDone) h+='<span class="chip done">✓ Complete</span>';
  h+= '</div>';
  h+= '<h1 class="vt">'+day.title+'</h1>';
  h+= '<div class="wk-thesis"><strong>Week '+pad(w)+' — '+wk.title+'.</strong> '+wk.thesis+'</div>';
  if(wk.compress) h+='<div class="prose"><div class="warn">'+wk.compress+'</div></div>';
  h+='</div>';

  h+='<div class="blocks">';

  h+='<article class="block"><div class="block-head"><h3>Concept</h3><time>20–25 min</time></div>';
  h+='<div class="block-body"><div class="prose">'+day.concept+'</div></div></article>';

  h+='<article class="block"><div class="block-head"><h3>Source</h3><time>25–35 min</time></div>';
  h+='<div class="block-body"><div class="srcbox">';
  h+='<a class="srclink" href="'+day.source.url+'" target="_blank" rel="noopener">'+day.source.label+'<span class="ar">↗</span></a>';
  h+='<p class="srcnote">'+day.source.note+'</p>';
  h+='</div></div></article>';

  h+='<article class="block"><div class="block-head"><h3>Drill</h3><time>45–60 min</time></div>';
  h+='<div class="block-body"><div class="prose">';
  if(day.deliverable) h+='<div class="deliv">'+day.deliverable+'</div>';
  h+=day.drill;
  h+='</div></div></article>';

  h+='</div>';

  h+='<div class="daynav">';
  h+='<button class="navbtn2" type="button" id="prev-day"'+(idx<=1?' disabled':'')+'>← Previous</button>';
  h+='<button class="bigbtn'+(isDone?' isdone':'')+'" type="button" id="mark">'+(isDone?'✓ Completed — mark undone':'Mark day complete')+'</button>';
  h+='<button class="navbtn2" type="button" id="next-day"'+(idx>=72?' disabled':'')+'>Next →</button>';
  h+='</div>';

  v.innerHTML=h;
  document.getElementById("crumb").textContent="Today · Week "+pad(w)+" Day "+d;

  var mk=document.getElementById("mark");
  if(mk) mk.addEventListener("click",function(){ toggleDone(w,d); });
  var pv=document.getElementById("prev-day");
  if(pv) pv.addEventListener("click",function(){ step(-1); });
  var nx=document.getElementById("next-day");
  if(nx) nx.addEventListener("click",function(){ step(1); });
}

function step(dir){
  var idx=(state.cur.w-1)*6+state.cur.d+dir;
  if(idx<1||idx>72) return;
  state.cur={w:Math.ceil(idx/6), d:((idx-1)%6)+1};
  saveState(); renderToday(); renderCourse(); renderProgress();
  window.scrollTo({top:0,behavior:"auto"});
}

function toggleDone(w,d){
  var k=key(w,d);
  if(state.done[k]){ delete state.done[k]; }
  else{
    state.done[k]=1;
    var t=todayStr();
    if(!state.days) state.days=[];
    if(state.days.indexOf(t)===-1) state.days.push(t);
    var nxt=firstIncomplete();
    state.cur=nxt;
  }
  saveState(); renderToday(); renderCourse(); renderProgress();
  window.scrollTo({top:0,behavior:"auto"});
}

function renderCourse(){
  var v=document.getElementById("v-course");
  var h='<div class="today-head"><p class="eyebrow">All 72 days</p><h1 class="vt">The curriculum</h1>';
  h+='<p class="lede">Four phases. Each assumes the last. Day 7 of every week is deliberately empty — catch up, go deeper, or rest.</p></div>';

  PHASES.forEach(function(p){
    h+='<div class="phase p'+p.n+'">';
    h+='<div class="phase-head"><span class="chip ph'+p.n+'">Phase 0'+p.n+'</span><h3>'+p.title+'</h3><p class="gl">'+p.gloss+'</p></div>';
    h+='<div class="wgrid">';
    COURSE.forEach(function(wk){
      if(wk.phase!==p.n) return;
      var c=0; for(var i=1;i<=6;i++){ if(state.done[key(wk.w,i)]) c++; }
      h+='<div class="wcard"><div class="wcard-top"><span class="wn">W'+pad(wk.w)+'</span><b>'+wk.title+'</b><span class="cnt">'+c+'/6</span></div><div class="dlist">';
      wk.days.forEach(function(dy){
        var dn=state.done[key(wk.w,dy.n)];
        var cur=(state.cur.w===wk.w&&state.cur.d===dy.n);
        var cls="drow"+(dn?" is-done":"")+(cur?" is-cur":"")+(dy.studio?" is-studio":"");
        h+='<button class="'+cls+'" type="button" data-w="'+wk.w+'" data-d="'+dy.n+'">';
        h+='<span class="tick">'+(dn?"✓":"")+'</span><span class="dn">'+dy.n+'</span><span class="dt">'+dy.title+'</span></button>';
      });
      h+='</div></div>';
    });
    h+='</div></div>';
  });
  v.innerHTML=h;
  Array.prototype.forEach.call(v.querySelectorAll(".drow"),function(b){
    b.addEventListener("click",function(){
      state.cur={w:parseInt(b.dataset.w,10), d:parseInt(b.dataset.d,10)};
      saveState(); renderToday(); show("today");
    });
  });
}

function renderStudios(){
  var v=document.getElementById("v-studios");
  var h='<div class="today-head"><p class="eyebrow">Three projects</p><h1 class="vt">The studios</h1>';
  h+='<p class="lede">There are exactly three ways a product designer gets handed work. Each studio is one of them. The daily drills accumulate into these.</p></div>';
  h+='<div class="studios">';
  STUDIOS.forEach(function(s){
    h+='<article class="studio'+(s.cap?" cap":"")+'"><div class="smeta"><span>Studio '+s.id+'</span><span>'+s.weeks+'</span></div>';
    h+='<h3>'+s.name+'</h3><p>'+s.brief+'</p>';
    h+='<div class="dlv">';
    s.items.forEach(function(it){
      var id="dlv-"+it[0];
      h+='<label for="'+id+'"><input type="checkbox" id="'+id+'" data-dlv="'+it[0]+'"'+(state.dlv[it[0]]?" checked":"")+'><span class="code">'+it[0]+'</span><span>'+it[1]+'</span></label>';
    });
    h+='</div>';
    h+='<p class="fail"><b>Fail condition:</b> '+s.fail+'</p></article>';
  });
  h+='</div>';
  v.innerHTML=h;
  Array.prototype.forEach.call(v.querySelectorAll("input[data-dlv]"),function(b){
    b.addEventListener("change",function(){
      if(b.checked){ state.dlv[b.dataset.dlv]=1; } else { delete state.dlv[b.dataset.dlv]; }
      saveState();
    });
  });
}

function renderLibrary(){
  var v=document.getElementById("v-library");
  var h='<div class="today-head"><p class="eyebrow">Primary sources</p><h1 class="vt">Library</h1>';
  h+='<p class="lede">The material this course was distilled from. Go here when a lesson hooks you and you want the source. <span class="st">★</span> marks the handful worth reading if you read nothing else.</p></div>';
  h+='<div class="lib">';
  LIBRARY.forEach(function(g){
    h+='<div class="libgroup"><h3>'+g.g+'</h3><ul>';
    g.items.forEach(function(it){
      h+='<li>'+(it.s?'<span class="st">★</span> ':'')+'<a href="'+it.u+'" target="_blank" rel="noopener">'+it.t+'</a><span class="by">'+it.by+'</span></li>';
    });
    h+='</ul></div>';
  });
  h+='</div>';
  v.innerHTML=h;
}

function renderSettings(){
  var v=document.getElementById("v-settings");
  var h='<div class="today-head"><p class="eyebrow">Progress &amp; devices</p><h1 class="vt">Sync</h1>';
  h+='<p class="lede">This page opens on any device you’re signed in on. Progress is stored in each browser separately — there is no server holding it. To move progress between devices, copy the code below and paste it on the other device.</p></div>';
  h+='<div class="panel"><h3>Move progress to another device</h3>';
  h+='<p>Copy this on the device that’s up to date, then paste it into the same box on the other device and press Load.</p>';
  h+='<textarea class="synccode" id="code" spellcheck="false"></textarea>';
  h+='<div class="row"><button class="pbtn" type="button" id="copy">Copy code</button><button class="pbtn sec" type="button" id="load">Load pasted code</button><span class="ok" id="okmsg"></span></div>';
  h+='</div>';
  h+='<div class="panel" style="margin-top:16px"><h3>The full course lives in your vault</h3>';
  h+='<p>This app is the daily driver. The long-form lessons, rubrics and studio briefs are in Obsidian at <code>Product Design Course\\</code> — edit them, extend them, link them into the rest of your vault.</p>';
  h+='<p>To run a day with Claude, including critique of what you make: <code>/product-design-course</code></p>';
  h+='</div>';
  h+='<div class="panel" style="margin-top:16px"><h3>Reset</h3><p>Clears all progress on this device only.</p>';
  h+='<div class="row"><button class="pbtn sec" type="button" id="reset">Reset progress</button></div></div>';
  v.innerHTML=h;

  var ta=document.getElementById("code");
  ta.value=JSON.stringify({done:state.done,dlv:state.dlv,cur:state.cur,days:state.days});
  document.getElementById("copy").addEventListener("click",function(){
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(function(){}); }
    document.getElementById("okmsg").textContent="Copied.";
  });
  document.getElementById("load").addEventListener("click",function(){
    try{
      var p=JSON.parse(ta.value);
      state.done=p.done||{}; state.dlv=p.dlv||{}; state.cur=p.cur||{w:1,d:1}; state.days=p.days||[];
      saveState(); renderAll();
      document.getElementById("okmsg").textContent="Loaded.";
    }catch(e){ document.getElementById("okmsg").textContent="That code didn’t parse."; }
  });
  document.getElementById("reset").addEventListener("click",function(){
    state={done:{},dlv:{},cur:{w:1,d:1},days:[],last:null};
    saveState(); renderAll();
  });
}

function show(id){
  VIEWS.forEach(function(v){
    var el=document.getElementById("v-"+v.id);
    if(el) el.hidden = (v.id!==id);
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-view]"),function(b){
    if(b.dataset.view===id){ b.setAttribute("aria-current","page"); } else { b.removeAttribute("aria-current"); }
  });
  var names={today:"Today",course:"Course",studios:"Studios",library:"Library",settings:"Sync"};
  if(id!=="today") document.getElementById("crumb").textContent=names[id];
  if(id==="settings") renderSettings();
  window.scrollTo({top:0,behavior:"auto"});
}

function renderAll(){
  renderToday(); renderCourse(); renderStudios(); renderLibrary(); renderProgress();
}

renderRail();
renderAll();
show("today");

document.getElementById("jump-today").addEventListener("click",function(){
  state.cur=firstIncomplete(); saveState(); renderToday(); renderCourse(); renderProgress(); show("today");
});
</script>
